# ============================================================
# 粘贴位置：宝塔面板 → 网站 → <你的站> → 设置 → 配置文件 → server { } 内部
# 作用：① 防止 .git / .env / 备份 / 密钥被公网下载  ② 静态资源长缓存、HTML 不缓存
# 注意：宝塔自动生成的那几行（#SSL-START、#REWRITE-START、#PROXY-START 等标记区）
#       不要删，也不要手工改标记区内的内容 —— 面板更新配置时会覆盖它们。
#       本段请贴在这些标记区之外。
# ============================================================

# ---- 1. 仓库与敏感文件绝不外露（Git 方案的安全前提）----
location ~ /\.(git|svn|htaccess) {
    deny all;
    return 404;
}
# .env 及所有变体（.env.docker / .env.local 等）一律 404
location ~ /\.env {
    deny all;
    return 404;
}

# ---- 2. 备份、日志、压缩包、数据库导出，一律 404 ----
location ~* \.(bak|bak2|old|orig|swp|sql|log|tar|tgz|zip|rar|corrupt)$ {
    deny all;
    return 404;
}
location ^~ /backups/     { deny all; return 404; }
location ^~ /__pycache__/ { deny all; return 404; }
location ^~ /error_images/ { deny all; return 404; }

# ---- 3. 静态资源长缓存；HTML 不缓存，保证 push 完就能看到新版 ----
location ~* \.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    access_log off;
}
location = /index.html { add_header Cache-Control "no-cache"; }
location = /app.html   { add_header Cache-Control "no-cache"; }

# ---- 4. 传输压缩（宝塔全局若已开启，这里重复设置不会冲突）----
gzip              on;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_vary         on;
gzip_types        text/plain text/css application/javascript application/json
                  image/svg+xml text/xml application/xml;
