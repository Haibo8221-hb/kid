<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学习目标工作台</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* hidden 属性必须真正隐藏：.sheetwrap/.banner 等带 display 规则，会覆盖 UA 的 [hidden]{display:none} */
  [hidden]{display:none !important}
  :root{
    --bg:#f5f6fb; --card:#ffffff; --ink:#1f2430; --ink2:#5b6478; --muted:#8b93a7;
    --line:#e7e9f2; --accent:#5b6cff; --accent-soft:#eef0ff; --green:#10b981; --green-soft:#e7f8f1;
    --amber:#f59e0b; --amber-soft:#fff5e3; --red:#ef4444; --red-soft:#fdecec; --violet:#8b5cf6;
    --r:16px; --sh:0 2px 10px rgba(31,36,48,.06); --sh2:0 8px 24px rgba(31,36,48,.10);
  }
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:76px}
  h1,h2,h3,h4{margin:0}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .wrap{max-width:1040px;margin:0 auto;padding:0 14px}

  /* ── 顶栏 ─────────────────────────────── */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
  .topbar .inner{max-width:1040px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .logo{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px}
  .t1{font-weight:800;font-size:15px;letter-spacing:.2px}
  .t2{font-size:11.5px;color:var(--muted)}
  .kpis{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .kpi{display:flex;align-items:baseline;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink2)}
  .kpi b{font-size:15px;color:var(--ink)}
  .kpi .k{font-size:12px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 13px;font-size:13.5px;font-weight:600;transition:.15s}
  .btn:hover{border-color:#cfd4e6}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--ink2)}
  .btn.big{padding:11px 18px;font-size:15px;border-radius:14px}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
  .btn[disabled]{opacity:.5;pointer-events:none}

  /* ── 标签导航 ─────────────────────────── */
  .tabs{display:flex;gap:6px;max-width:1040px;margin:12px auto 0;padding:0 14px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;white-space:nowrap}
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff}

  /* ── 区块 ─────────────────────────────── */
  .sec{margin:16px 0 10px;display:flex;align-items:center;gap:8px}
  .sec h2{font-size:14.5px;font-weight:800}
  .sec .sub{font-size:12px;color:var(--muted)}
  .sec .right{margin-left:auto;display:flex;gap:8px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .hint{border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.7;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
  .hint .hi{font-size:17px;line-height:1.3}
  .hint.info{background:var(--accent-soft);color:#3b47a8}
  .hint.warn{background:var(--amber-soft);color:#8a5a00}
  .hint.danger{background:var(--red-soft);color:#a52121}
  .hint.good{background:var(--green-soft);color:#0b6b4b}
  .hint .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  /* ── 目标卡（今日） ───────────────────── */
  .goalcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
  .gc-head{display:flex;align-items:flex-start;gap:10px}
  .gc-icon{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}
  .gc-title{min-width:0;flex:1}
  .gc-title b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gc-meta{font-size:12px;color:var(--muted)}
  .gc-streak{font-size:12px;color:var(--amber);font-weight:700;background:var(--amber-soft);border-radius:999px;padding:3px 9px;flex:none}
  .bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:11px 0 8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));border-radius:99px;transition:width .4s}
  .bar.green i{background:linear-gradient(90deg,var(--green),#34d399)}
  .gc-suggest{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .gc-suggest b{color:var(--accent);font-size:15px}
  .gc-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600}
  .chip.on{background:var(--accent-soft);border-color:#c9ceff;color:#3b47a8}
  .tagline{font-size:12px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .planbox{background:var(--bg);border-radius:11px;padding:9px 11px;font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.7}
  .planbox b{color:var(--ink)}

  /* ── 周节奏条 ─────────────────────────── */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
  .wcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;color:var(--muted)}
  .wcell .d{font-size:15px;margin:2px 0}
  .wcell.done{background:var(--green-soft);border-color:#bfead9;color:#0b6b4b}
  .wcell.miss{background:var(--red-soft);border-color:#f6cfcf;color:#a52121}
  .wcell.rest{background:var(--amber-soft);border-color:#f6dfb4;color:#8a5a00}
  .wcell.makeup{background:var(--accent-soft);border-color:#c9ceff;color:#3b47a8}
  .wcell.today{outline:2px solid var(--accent);outline-offset:-2px}

  /* ── 看板 ─────────────────────────────── */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .bcol{background:#eef0f6;border-radius:14px;padding:10px;min-height:120px}
  .bcol h3{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .bcol h3 .n{margin-left:auto;background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .bcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px}
  .bcard b{display:block;font-size:13.5px;margin-bottom:5px}
  .bcard .m{font-size:11.5px;color:var(--muted)}
  .bcard .mv{display:flex;gap:5px;margin-top:7px}
  .bcard .mv button{border:1px solid var(--line);background:#fff;border-radius:8px;font-size:11px;padding:2px 7px;color:var(--ink2)}

  /* ── 进展 ─────────────────────────────── */
  .progcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
  .pstat{background:var(--bg);border-radius:11px;padding:9px 11px}
  .pstat .k{font-size:11px;color:var(--muted)}
  .pstat .v{font-size:17px;font-weight:800}
  .spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
  .spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .spark i.has{background:var(--accent)}
  .spark i.rest{background:var(--amber-soft)}
  .mslist{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .ms{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--bg);border-radius:9px;padding:7px 10px}
  .ms .st{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
  .ms.doing .st{background:var(--amber)}
  .ms.done .st{background:var(--green)}
  .ms .q{margin-left:auto;color:var(--muted);font-size:11.5px}

  /* ── 目标总览 ─────────────────────────── */
  .goalrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
  .grow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

  /* ── 抽屉 ─────────────────────────────── */
  .sheetwrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
  .mask{position:absolute;inset:0;background:rgba(20,24,36,.45)}
  .sheet{position:relative;background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:var(--sh2);max-height:88vh;overflow:auto}
  .sheet h3{font-size:16px;font-weight:800;margin-bottom:4px}
  .sheet .tip{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .frow{margin-bottom:12px}
  .frow label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
  .frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:14px;background:var(--card);color:var(--ink)}
  .frow textarea{min-height:74px;resize:vertical}
  .frow .hintline{font-size:11.5px;color:var(--muted);margin-top:5px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sactions{display:flex;gap:10px;margin-top:6px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
  .sactions .btn{flex:1;padding:11px}
  .steps{display:flex;gap:6px;margin-bottom:12px}
  .steps i{height:4px;flex:1;border-radius:99px;background:var(--line)}
  .steps i.on{background:var(--accent)}
  .tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tpl{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2)}
  .tpl.on{border-color:var(--accent);background:var(--accent-soft);color:#3b47a8}
  .tpl .e{font-size:20px;display:block;margin-bottom:3px}
  .msedit{display:grid;grid-template-columns:1fr 88px 28px;gap:6px;margin-bottom:6px}
  .msedit input{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:var(--card);color:var(--ink)}
  .msedit .x{border:1px solid var(--line);background:var(--card);border-radius:9px;color:var(--muted)}

  /* ── 底部导航（手机） ─────────────────── */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav .inner{display:grid;grid-template-columns:repeat(4,1fr)}
  .bottomnav button{border:none;background:none;padding:9px 0 8px;font-size:11px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bottomnav button .e{font-size:18px}
  .bottomnav button.on{color:var(--accent)}

  .toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:86vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 10px}
  .loading{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
  .banner{background:var(--amber-soft);color:#8a5a00;border-radius:12px;padding:9px 13px;font-size:12.5px;margin:10px 0;display:flex;gap:8px;align-items:center}

  @media (max-width:760px){
    .board{grid-template-columns:1fr 1fr}
    .kpis{width:100%;margin-left:0;order:3}
    .tabs{display:none}
    .bottomnav{display:block}
    .topbar .inner{padding:9px 12px}
    .t2{display:none}
  }
  @media (max-width:420px){ .board{grid-template-columns:1fr} .f2{grid-template-columns:1fr} }
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <span class="logo">🎯</span>
      <div>
        <div class="t1">我的学习目标台</div>
        <div class="t2" id="todayDate">—</div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi" id="connBadge" title="数据连接状态"><span class="k">🔌</span><b>连接中…</b></div>
      <div class="kpi"><span class="k">🔥</span><b id="kpiStreak" data-sp-bindable="database" data-sp-database-id="i9Xqzcu83aVjk4YkSBOzX4">0</b><span>天连续</span></div>
      <div class="kpi"><span class="k">✅</span><b id="kpiDone" data-sp-bindable="database" data-sp-database-id="1e8NVpAwolZUlwpRmrui3v">0</b>/<b id="kpiTotal">0</b><span>今日</span></div>
      <div class="kpi"><span class="k">⏱</span><b id="kpiMin" data-sp-bindable="database" data-sp-database-id="1e8NVpAwolZUlwpRmrui3v">0</b><span>分钟</span></div>
    </div>
    <button class="btn primary" type="button" id="btnNewGoal">+ 新目标</button>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs">
    <button class="tab active" type="button" data-view="today">今日</button>
    <button class="tab" type="button" data-view="board">看板</button>
    <button class="tab" type="button" data-view="progress">进展</button>
    <button class="tab" type="button" data-view="goals">目标</button>
  </nav>

  <div id="syncBanner" class="banner" hidden>📡 有 <b id="outboxCount">0</b> 条记录没传上去，恢复网络后会自动补传。</div>

  <!-- 今日 -->
  <section id="view-today">
    <div class="sec"><h2>今天要做</h2><span class="sub" id="todaySummary">—</span></div>
    <div id="hintZone"></div>
    <div id="todayList"><div class="loading">正在读取你的目标…</div></div>
    <div class="sec"><h2>本周节奏</h2><span class="sub">✓ 完成 · ○ 未打 · △ 补记 · ☕ 休息</span></div>
    <div class="week" id="weekStrip"></div>
  </section>

  <!-- 看板 -->
  <section id="view-board" hidden>
    <div class="sec"><h2>看板</h2><span class="sub">用 ◀ ▶ 移动目标的状态；移到「受阻」会提示你启用预案</span></div>
    <div class="board" id="boardWrap"></div>
  </section>

  <!-- 进展 -->
  <section id="view-progress" hidden>
    <div class="sec"><h2>进展</h2><span class="sub">看得见的进步，才会有动力</span></div>
    <div id="progressList"></div>
  </section>

  <!-- 目标 -->
  <section id="view-goals" hidden>
    <div class="sec"><h2>我的目标</h2><span class="sub">有终点、有总量的目标才值得追</span>
      <div class="right"><button class="btn sm" type="button" id="btnNewGoal2">+ 新目标</button></div>
    </div>
    <div id="goalList"></div>
  </section>
</div>

<nav class="bottomnav" id="bottomnav">
  <div class="inner">
    <button type="button" data-view="today" class="on"><span class="e">📅</span>今日</button>
    <button type="button" data-view="board"><span class="e">🗂️</span>看板</button>
    <button type="button" data-view="progress"><span class="e">📈</span>进展</button>
    <button type="button" data-view="goals"><span class="e">🎯</span>目标</button>
  </div>
</nav>

<div class="sheetwrap" id="sheetWrap" hidden>
  <div class="mask" data-close="1"></div>
  <div class="sheet" id="sheet">
    <h3 id="sheetTitle">标题</h3>
    <div class="tip" id="sheetTip"></div>
    <div id="sheetBody"></div>
    <div class="sactions">
      <button class="btn" type="button" data-close="1">取消</button>
      <button class="btn primary" type="button" id="sheetOk">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ================================================================
   * 数据源绑定（资料库数据表 · 页面与表双向同步）
   * ================================================================ */
  var DB_GOALS   = 'i9Xqzcu83aVjk4YkSBOzX4';  // 学习目标
  var DB_CHECKS  = '1e8NVpAwolZUlwpRmrui3v';  // 学习打卡记录
  var DB_STAGES  = '1MDvvnykFG9DtBfXhfLw1G';  // 目标阶段

  var STATE = { goals:[], checks:[], stages:[], options:{}, outbox:[] };
  window.__LGW_STATE__=STATE;   // 调试/自测只读入口
  var UI = { view:'today', goalId:null, sheet:null, wizard:{step:1,draft:null} };
  var db = (window.__SMART_PAGE__ && window.__SMART_PAGE__.database) || null;

  /* ================================================================
   * 通用工具
   * ================================================================ */
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function el(tag,cls,txt){ var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n; }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function today(){ return ymd(new Date()); }
  function parseD(s){ if(!s) return null; var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); if(!m) return null; return new Date(+m[1],+m[2]-1,+m[3]); }
  function addDays(s,n){ var d=parseD(s)||new Date(); d.setDate(d.getDate()+n); return ymd(d); }
  function diffDays(a,b){ var da=parseD(a), db2=parseD(b); if(!da||!db2) return 0; return Math.round((da-db2)/86400000); }
  function wkName(s){ var d=parseD(s); if(!d) return ''; return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]; }
  function uid(){ return 'r'+Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
  function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
  function round1(n){ return Math.round(n*10)/10; }
  function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2200); }
  function bind(el2,dbId){ if(el2){ el2.setAttribute('data-sp-bindable','database'); el2.setAttribute('data-sp-database-id',dbId); } return el2; }

  /* select 读取兼容：接口可能返回选项 text 或 id，统一转 text */
  function optText(dbId,field,val){
    if(val==null||val==='') return '';
    var list=(STATE.options[dbId]&&STATE.options[dbId][field])||[];
    for(var i=0;i<list.length;i++){ if(list[i].text===val) return val; if(list[i].id===val) return list[i].text; }
    return String(val);
  }
  function optId(dbId,field,text){
    var list=(STATE.options[dbId]&&STATE.options[dbId][field])||[];
    for(var i=0;i<list.length;i++){ if(list[i].text===text) return list[i].id; }
    return text;
  }
  function goalStatus(g){ return optText(DB_GOALS,'状态',g['状态']); }
  function isActive(g){ var s=goalStatus(g); return s==='进行中'||s==='受阻'; }
  function gname(g){ return g['目标名称']||'（未命名目标）'; }
  function unit(g){ return g['单位']||'次'; }
  function total(g){ return num(g['目标总量']); }
  function done(g){ return num(g['已完成量']); }
  function remain(g){ return Math.max(0, round1(total(g)-done(g))); }

  /* ================================================================
   * 目标计算：建议量 / 连续天数 / 漏打 / 休息日 / 收口
   * ================================================================ */
  function checksOf(goalId){ return STATE.checks.filter(function(c){ return c['目标ID']===goalId; }); }
  /* 日期键统一按「本地日」计算：库里存的是 ISO（含 UTC），直接 slice(0,10) 会比本地日差一天 */
  function dateKey(v){
    if(v==null||v==='') return '';
    var s=String(v);
    if(s.indexOf('T')>=0){ var d=new Date(s); if(!isNaN(d.getTime())) return ymd(d); }
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m? (m[1]+'-'+m[2]+'-'+m[3]) : '';
  }
  function checkMap(goalId){
    var m={};
    checksOf(goalId).forEach(function(c){ var d=dateKey(c['打卡日期']); if(d) m[d]=c; });
    return m;
  }
  function restWeekday(g){ var t=optText(DB_GOALS,'休息日',g['休息日']); return (t==='无'||!t)?null:t; }
  function restQuota(g){ return num(g['休息额度']); }
  function isRestDay(g,dateStr){
    if(restQuota(g)<=0) return false;
    var w=restWeekday(g); if(!w) return false;
    return wkName(dateStr)===w;
  }
  /* 有效天数：从今天到截止日之间、非休息日的天数 */
  function effectiveDays(g){
    var end=dateKey(g['截止日期'])||null;
    if(!end) return 1;
    var t=today(), n=Math.max(0,diffDays(end,t)), eff=0, i;
    for(i=0;i<=n;i++){ var d=addDays(t,i); if(!isRestDay(g,d)) eff++; }
    return Math.max(1,eff);
  }
  /* 今日建议量：剩余 ÷ 有效天数，向上取整到 1；受「每日上限」与节奏惩罚约束 */
  function suggest(g){
    var r=remain(g); if(r<=0) return 0;
    var base=Math.ceil(r/effectiveDays(g));
    var cap=num(g['每日上限']); if(cap>0) base=Math.min(base,cap);
    var pen=penaltyFactor(g); if(pen<1) base=Math.max(1,Math.floor(base*pen));
    return Math.max(1,Math.round(base));
  }
  /* 节奏惩罚：漏打 2 天 → 0.7；漏打 3 天以上 → 0.5；启用预案 → 0.5 */
  function penaltyFactor(g){
    var miss=missedDays(g);
    if(miss>=3) return 0.5;
    if(miss===2) return 0.7;
    if(String(g['节奏提示']||'').indexOf('预案')>=0) return 0.5;
    return 1;
  }
  /* 连续漏打天数（从昨天往回数，跳过休息日） */
  /* 漏打卡天数：从昨天往回数，跳过休息日。
     下界 = max(目标开始日期, 今天-60)：目标刚创建时开始日期之前的日子不算"漏打"，
     否则新目标一上线就会被判成"断了 52/60 天"。 */
  function missedDays(g){
    var map=checkMap(g['目标ID']), n=0, d=addDays(today(),-1);
    var floor=addDays(today(),-60);
    var start=dateKey(g['开始日期']);
    // 开始日期比 60 天前更晚 → 以开始日期为下界（目标创建前的日子不算漏打）
    if(start&&diffDays(start,floor)>0) floor=start;
    for(var i=0;i<60;i++){
      if(diffDays(d,floor)<0) break;             // 已越过下界，不再累计
      if(map[d]){ if(String(map[d]['打卡类型'])==='补记'){ /* 补记也算这天有动作 */ } else { break; } }
      else { if(isRestDay(g,d)){ d=addDays(d,-1); continue; } n++; }
      d=addDays(d,-1);
    }
    return n;
  }
  /* 连续打卡天数（休息日不断签）；无打卡历史时回退到目标表里已存的连续天数。
     同样以开始日期为下界，避免把目标之前的日子算成断签。 */
  function streakOf(g){
    if(!checksOf(g['目标ID']).length) return num(g['连续天数']);
    var map=checkMap(g['目标ID']), n=0, d=today();
    if(!map[d]) d=addDays(d,-1);
    var start=dateKey(g['开始日期']);
    for(var i=0;i<400;i++){
      if(start&&diffDays(d,start)<0) break;     // 早于开始日期 → 停
      if(map[d]) n++;
      else if(!isRestDay(g,d)) break;
      d=addDays(d,-1);
    }
    return n;
  }
  function isOverdue(g){
    var end=dateKey(g['截止日期'])||null;
    if(!end) return false;
    return diffDays(today(),end)>0 && remain(g)>0;
  }
  function planText(g){ return String(g['拆解计划']||'').trim(); }
  function contingency(g){ return String(g['障碍预案']||'').trim(); }
  function stageList(gid){ return STATE.stages.filter(function(s){ return s['目标ID']===gid; }).sort(function(a,b){ return num(a['阶段顺序'])-num(b['阶段顺序']); }); }

      db.getSchema({databaseId:'1e8NVpAwolZUlwpRmrui3v'}).then(captureOpts('1e8NVpAwolZUlwpRmrui3v')).catch(function(e){ console.error('[schema]',e); }),
      db.getSchema({databaseId:'1MDvvnykFG9DtBfXhfLw1G'}).then(captureOpts('1MDvvnykFG9DtBfXhfLw1G')).catch(function(e){ console.error('[schema]',e); })
    ]);

  function captureOpts(id){

      (sc.properties||[]).forEach(function(f){
        if((f.type==='select'||f.type==='multi_select')&&f.config&&f.config.options){

  /* 分页拉全量：每张表一个带字面量 databaseId 的查询（平台要求 id 为字面量） */
  function pageStep(queryFn,cursor,acc,guard){
    guard=guard||0;
    if(guard>60) return Promise.resolve(acc);
    return queryFn(cursor).then(function(res){
      acc=acc.concat(res.results||[]);
      var next=res.nextCursor;
      if(res.hasMore&&next&&next!==cursor&&(res.results||[]).length) return pageStep(queryFn,next,acc,guard+1);
      return acc;
    });
  }

    if(DEMO||SRV.ready) return Promise.resolve(STATE.goals.slice());
    return pageStep(function(cursor){

    },undefined,[],0);
  }
  function queryChecks(){
    if(DEMO||SRV.ready) return Promise.resolve(STATE.checks.slice());
    return pageStep(function(cursor){
      return db.query({databaseId:'1e8NVpAwolZUlwpRmrui3v',sorts:[{property:'打卡日期',direction:'descending'}],pageSize:200,startCursor:cursor});
    },undefined,[],0);

  /* 写：每张表一个带字面量 databaseId 的入口（平台要求 id 为字面量） */

  function flushOne(it){
    if(it.op==='update'&&it.table==='goals'){
      return db.updateRecord({databaseId:'i9Xqzcu83aVjk4YkSBOzX4',recordId:it.recordId,properties:it.properties});
    }
    if(it.table==='goals') return db.addRecord({databaseId:'i9Xqzcu83aVjk4YkSBOzX4',properties:it.properties});
    if(it.table==='checks') return db.addRecord({databaseId:'1e8NVpAwolZUlwpRmrui3v',properties:it.properties});
    return db.addRecord({databaseId:'1MDvvnykFG9DtBfXhfLw1G',properties:it.properties});
  }
  function flushOutbox(){
    if(!db||!STATE.outbox.length) return Promise.resolve();
    var items=STATE.outbox.slice();
    return items.reduce(function(p,it){
      return p.then(function(){
        return flushOne(it).then(function(){ STATE.outbox.shift(); saveOutbox(); })
          .catch(function(){ throw new Error('outbox'); });
      });
    },Promise.resolve()).then(function(){ if(STATE.outbox.length===0) toast('补传完成 ✓'); })
      .catch(function(){ /* 保留队列，下次再试 */ });
  }

  function watchUpdates(){

          if(info.databaseIds.indexOf(DB_GOALS)>=0||info.databaseIds.indexOf(DB_CHECKS)>=0||info.databaseIds.indexOf(DB_STAGES)>=0){

  function realDaily(g){
    var map=checkMap(g['目标ID']);

    if(!arr.length) return 0;
    var s=0; arr.forEach(function(v){ s+=v; });
    return round1(s/arr.length);
  }
  function spark(g){
    var map=checkMap(g['目标ID']); var sp=el('div','spark'); var max=1;

    for(var i=13;i>=0;i--){ var d=addDays(today(),-i); var v=map[d]?num(map[d]['本次完成量']):0; vals.push({d:d,v:v,r:isRestDay(g,d)}); if(v>max) max=v; }

      var i=el('i'); i.style.height=Math.max(2,Math.round(x.v/max*40))+'px';
      if(x.v>0) i.className='has';
      else if(x.r) i.className='rest';
      i.title=x.d+(x.v?(' · '+x.v):(x.r?' · 休息':''));
      sp.appendChild(i);
    });
    return sp;
  }

  /* ================================================================
   * 交互：打卡 / 调整 / 补记 / 休息 / 预案 / 重规划
   * ================================================================ */
  function goalById(id){ for(var i=0;i<STATE.goals.length;i++){ if(STATE.goals[i]['目标ID']===id||STATE.goals[i].record_id===id) return STATE.goals[i]; } return null; }
  function goalRecId(g){ return g.record_id||g['_recordId']||null; }
  function recordCheckIn(g,amount,minutes,dateStr,type,state,note){
    var newDone=round1(done(g)+num(amount));
    if(newDone>total(g)) newDone=total(g);
    var props={
      '记录ID':uid(),
      '目标ID':g['目标ID'],
      '打卡日期':new Date(dateStr+'T00:00:00').toISOString(),
      '本次完成量':num(amount),
      '累计完成量':newDone,
      '用时分钟':num(minutes),
      '打卡类型':optId(DB_CHECKS,'打卡类型',type),
      '当时状态':optId(DB_CHECKS,'当时状态',state),
      '备注':note||'',
      '提交时间':new Date().toISOString()
    };
    var gprops={
      '已完成量':newDone,
      '投入分钟':num(g['投入分钟'])+num(minutes),
      '连续天数':0,
      '今日建议量':suggest(g),
      '最近更新':new Date().toISOString(),
      '状态':g['状态']
    };
    if(newDone>=total(g)&&total(g)>0) gprops['状态']=optId(DB_GOALS,'状态','已完成');
    return addCheckRecord(props,SRV.ready?gprops:null).then(function(){
      // 先把记录并入本地，再算连续天数（否则算的是「打卡之前」的连续）
      STATE.checks.push(props);
      gprops['连续天数']=streakOf(g);
      if(SRV.ready) return null;                 // 服务器态已在同一事务内更新目标
      return updateGoalRecord(goalRecId(g),gprops);
    }).then(function(){
      g['已完成量']=newDone; g['投入分钟']=gprops['投入分钟']; g['连续天数']=gprops['连续天数'];
      if(gprops['状态']) g['状态']=gprops['状态'];
      render();
      if(newDone>=total(g)&&total(g)>0) celebrate(g);
    });
  }
  function celebrate(g){
    toast('🎉 目标达成：'+gname(g)+'！要不要马上定下一个？');
  }
  function quickCheck(id,extra){
    var g=goalById(id); if(!g) return;
    var amt=extra!==undefined&&extra!==null&&extra!==''?num(extra):suggest(g);
    recordCheckIn(g,amt,0,today(),'正常','顺利','');
  }
  function restToday(id){
    var g=goalById(id); if(!g) return;
    recordCheckIn(g,0,0,today(),'休息跳过','顺利','');
  }
  function useContingency(id){
    var g=goalById(id); if(!g) return;
    updateGoalRecord(goalRecId(g),{
      '状态':optId(DB_GOALS,'状态','受阻'),
      '节奏提示':'已启用预案：今日建议量减半',
      '最近更新':new Date().toISOString()
    }).then(function(){
      g['状态']=optId(DB_GOALS,'状态','受阻');
      g['节奏提示']='已启用预案：今日建议量减半';
      render(); toast('已启用预案，今天少做一点也算数');
    });
  }
  function replan(id){
    var g=goalById(id); if(!g) return;
    openSheet('重新规划：'+gname(g),'不惩罚，只调整计划。选一个方向：',[
      {label:'总量缩 20%',act:'shrink',id:id},
      {label:'截止延后 7 天',act:'delay',id:id},
      {label:'每周休 2 天',act:'restmore',id:id}
    ],function(){ return true; });
  }
  function doShrink(g){
    var nt=Math.max(done(g)+1, Math.ceil(total(g)*0.8));
    updateGoalRecord(goalRecId(g),{'目标总量':nt,'节奏提示':'','最近更新':new Date().toISOString()}).then(function(){
      g['目标总量']=nt; g['节奏提示']=''; render(); toast('总量改成 '+nt+' '+unit(g));
    });
  }
  function doDelay(g){
    var nd=addDays(dateKey(g['截止日期'])||today(),7);
    updateGoalRecord(goalRecId(g),{'截止日期':new Date(nd+'T00:00:00').toISOString(),'节奏提示':'','最近更新':new Date().toISOString()}).then(function(){
      g['截止日期']=nd; g['节奏提示']=''; render(); toast('截止日延到 '+nd);
    });
  }
  function doRestMore(g){
    updateGoalRecord(goalRecId(g),{'休息额度':2,'休息日':optId(DB_GOALS,'休息日','周日'),'节奏提示':'','最近更新':new Date().toISOString()}).then(function(){
      g['休息额度']=2; g['休息日']=optId(DB_GOALS,'休息日','周日'); g['节奏提示']=''; render(); toast('改成每周休 2 天');
    });
  }
  function doClose(g,way){
    if(way==='done'){
      updateGoalRecord(goalRecId(g),{'已完成量':total(g),'状态':optId(DB_GOALS,'状态','已完成'),'收口方式':optId(DB_GOALS,'收口方式','完成'),'最近更新':new Date().toISOString()}).then(function(){
        g['已完成量']=total(g); g['状态']=optId(DB_GOALS,'状态','已完成'); render(); toast('已按实际完成收口 🎉');
      });
    }else if(way==='drop'){
      updateGoalRecord(goalRecId(g),{'状态':optId(DB_GOALS,'状态','已放弃'),'收口方式':optId(DB_GOALS,'收口方式','放弃'),'最近更新':new Date().toISOString()}).then(function(){
        g['状态']=optId(DB_GOALS,'状态','已放弃'); render(); toast('已存档（放弃不算失败）');
      });
    }
  }

  function draftSuggest(d){
    var rem=d.total||0, days=Math.max(1,Math.round((parseD(d.end)-parseD(d.start))/86400000));

  /* 第 idx 段（从 0 起）的截止日：把总时长按段数均分 */

  }

  /* ================================================================
   * 草稿缓存（DSDK008：只缓存真正会提交的字段）

  var CACHE_KEY='lgw_draft_';
  var cacheTimer=null;
  function cacheFields(root,scope){
    $$('input,textarea,select',root).forEach(function(f){
      if(f.type==='password'||f.getAttribute('data-no-cache')) return;
      if(/密码|身份证|secret|token|key/i.test(f.name||'')) return;
      f.addEventListener('input',function(){ scheduleCache(root,scope); });
      f.addEventListener('change',function(){ scheduleCache(root,scope); });
    });
  }
  function scheduleCache(root,scope){
    clearTimeout(cacheTimer);
    cacheTimer=setTimeout(function(){
      var o={};
      $$('input,textarea,select',root).forEach(function(f){
        if(f.type==='password') return;
        if(/密码|身份证|secret|token|key/i.test(f.name||'')) return;
        o[f.name||('f'+Math.random())]=f.value;
      });
      try{ localStorage.setItem(CACHE_KEY+scope,JSON.stringify(o)); }catch(e){}
    },300);
  }
  function clearCache(scope){ try{ localStorage.removeItem(CACHE_KEY+scope); }catch(e){} }
  function restoreCache(scope){
    try{
      var o=JSON.parse(localStorage.getItem(CACHE_KEY+scope)||'null'); if(!o) return null;
      return o;
    }catch(e){ return null; }
  }

  function onAction(act,id,extra,dir){
    var g=id?goalById(id):null;
    switch(act){
      case 'quick': quickCheck(id); break;
      case 'add': quickCheck(id,extra); break;
      case 'adjust': if(g) openAdjust(g,false); break;
      case 'makeup': if(g) openAdjust(g,true); break;
      case 'rest': restToday(id); break;
      case 'usePlan': useContingency(id); break;
      case 'replan': if(g) replan(id); break;
      case 'shrink': if(g) doShrink(g); break;
      case 'delay': if(g) doDelay(g); break;
      case 'restmore': if(g) doRestMore(g); break;
      case 'closeDone': if(g) doClose(g,'done'); break;
      case 'closeDrop': if(g) doClose(g,'drop'); break;
      case 'edit': if(g) openEdit(g); break;
      case 'stages': if(g) setView('progress'); break;
      case 'move':
        if(g){
          var order=['待开始','进行中','受阻','已完成'];
          var cur=order.indexOf(goalStatus(g));
          var nx=Math.max(0,Math.min(3,cur+parseInt(dir,10)));
          if(nx===cur) break;
          if(order[nx]==='受阻'){
            updateGoalRecord(goalRecId(g),{'状态':optId(DB_GOALS,'状态','受阻'),'最近更新':new Date().toISOString()}).then(function(){ g['状态']=optId(DB_GOALS,'状态','受阻'); render(); toast('已标记受阻：记得用预案'); });
          }else{
            updateGoalRecord(goalRecId(g),{'状态':optId(DB_GOALS,'状态',order[nx]),'最近更新':new Date().toISOString()}).then(function(){ g['状态']=optId(DB_GOALS,'状态',order[nx]); render(); });
          }
        }
        break;
      default: break;
    }
  }
  function bindEvents(){
    document.addEventListener('click',function(e){
      var t=e.target;

      if(actEl){
        onAction(actEl.getAttribute('data-act'),actEl.getAttribute('data-id'),actEl.getAttribute('data-amt'),actEl.getAttribute('data-dir'));
        return;
      }
      var tab=t.closest? t.closest('[data-view]'):null;
      if(tab){ setView(tab.getAttribute('data-view')); return; }
      var tpl=t.closest? t.closest('[data-tpl]'):null;
      if(tpl){

        if(tp){ if(!d.unit) d.unit=tp.unit; if(!d.total) d.total=tp.total; }

      if(t.getAttribute&&t.getAttribute('data-addstage')){
        var dd=UI.wizard.draft; dd.stages.push({name:'',qty:0}); renderWizard(); return;

   * 复用站点登录会话（/api/auth/login），因此数据是服务器端真实存储，
   * 手机 / 平板 / 电脑打开同一地址即共享同一份数据（多端同步）。

  var SRV={active:false,ready:false};
  function srvDetect(){
    if(db) return false;                                   // 资料库形态
    if(location.protocol==='file:') return false;           // 本地文件 → 演示模式
    // 页面自身挂在服务器上但不在资料库域 → 服务器形态
    return !/workbuddy\.(cn|link)$/.test(location.hostname);

  function srvLogin(){
    return fetch('/api/auth/status',{credentials:'same-origin'}).then(function(r){
      if(r.ok) return r.json();
      var pwd=window.prompt('请输入访问密码（与学习台相同）');
      if(!pwd) return Promise.reject(new Error('未登录'));
      return fetch('/api/auth/login',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})})
        .then(function(r2){ if(!r2.ok) throw new Error('密码错误'); return r2.json(); });
    });
  }
  function srvRequest(path,opts){
    return fetch('/api/goals'+path,Object.assign({credentials:'same-origin'},opts||{}))
      .then(function(r){
        if(r.status===401) throw new Error('未登录');
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      });
  }

  function demoLoad(){
    var raw=null;
    try{ raw=localStorage.getItem('lgw_demo_data'); }catch(e){}
    if(raw){ try{ DEMO=JSON.parse(raw); }catch(e){ DEMO=null; } }
    if(!DEMO||!DEMO.goals||!DEMO.goals.length) DEMO=demoSeed();
    STATE.options=demoOptions();
    STATE.goals=DEMO.goals; STATE.checks=DEMO.checks; STATE.stages=DEMO.stages;
    var b=el('div','hint warn'); b.appendChild(el('span','hi','🧪'));
    var tx=el('div',null,DEMO_BANNER);
    var act=el('div','act');
    var reset=el('button','btn sm','恢复示例数据'); reset.type='button';
    reset.addEventListener('click',function(){ try{ localStorage.removeItem('lgw_demo_data'); }catch(e){} DEMO=null; demoLoad(); render(); toast('已恢复示例数据'); });
    act.appendChild(reset); tx.appendChild(act); b.appendChild(tx);
    var zone=$('#hintZone'); if(zone) zone.appendChild(b);
  }
  function demoSave(){ try{ localStorage.setItem('lgw_demo_data',JSON.stringify(DEMO)); }catch(e){} }

  /* ================================================================
   * 启动
   * ================================================================ */
  function boot(){
    bindEvents();
    renderWeek();
    loadOutbox();
    if(db){                                   // ① 资料库：SDK + 数据表
      loadAll().then(function(){ watchUpdates(); flushOutbox(); });
      return;
    }
    if(srvDetect()){                          // ② 服务器独立目录：同源 API（真实存储）
      var tip=el('div','card empty','正在连接服务器数据…');
      $('#todayList').innerHTML=''; $('#todayList').appendChild(tip);
      srvLogin().then(function(){
        SRV.ready=true;
        return loadAll();
      }).then(function(){
        toast('已连接服务器数据（多端同步）');
      }).catch(function(e){
        SRV.ready=false;
        var msg=el('div','card empty','未能连接服务器数据：'+(e&&e.message?e.message:'登录失败')+'。请确认访问密码，或改用资料库版本打开。');
        $('#todayList').innerHTML=''; $('#todayList').appendChild(msg);
      });
      return;
    }
    demoLoad();                              // ③ 本地打开：演示模式（localStorage）
    render();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
