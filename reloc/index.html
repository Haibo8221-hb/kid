<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迪拜搬迁台 · Dubai Relocation · 规范 v2</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--tx:#1a1d28;--tx2:#5b6474;--tx3:#8a93a5;--line:#e3e8f0;
--blue:#3f7dff;--green:#10b981;--amber:#d97706;--red:#dc2626;--violet:#7c3aed}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'PingFang SC','Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.7;padding:20px;max-width:1080px;margin:0 auto}
body.embed{padding:12px;max-width:none}
h1{font-size:22px;margin-bottom:2px}
h3{font-size:15px}
.sub{color:var(--tx3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
.card h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-size:24px;display:block}
.stat span{font-size:12px;color:var(--tx3)}
.badge{display:inline-block;padding:1px 9px;border-radius:9px;font-size:12px;font-weight:600}
.b-high{background:#fee2e2;color:var(--red)}.b-med{background:#fef3c7;color:var(--amber)}
.b-low{background:#dcfce7;color:#15803d}.b-todo{background:#e0e7ff;color:#4338ca}
.b-waiting_on{background:#fef3c7;color:var(--amber)}.b-research{background:#ede9fe;color:var(--violet)}
.b-doing{background:#dbeafe;color:var(--blue)}.b-done{background:#dcfce7;color:#15803d}.b-blocked{background:#fee2e2;color:var(--red)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--tx);border-radius:9px;padding:6px 14px;font-size:14px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--tx3);font-weight:600;font-size:12.5px}
.tid{font-weight:700;color:var(--blue);white-space:nowrap}
.ov{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:14.5px}
.src{font-size:12px;color:var(--tx3);word-break:break-all;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);border-radius:16px;padding:3px 13px;font-size:13px;cursor:pointer;background:var(--surface)}
.chip.on{background:var(--tx);color:var(--blue);border-color:var(--tx)}
.sel{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px}
.tool{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.muted{color:var(--tx3);font-size:13px}
.finding{border-bottom:1px solid var(--line);padding:10px 0}
.finding:last-child{border:0}
.hidden{display:none}
#ingestInput{width:100%;min-height:74px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:14px/1.6 inherit;color:var(--tx);background:var(--surface);resize:vertical}
a{color:var(--blue)}
/* 周报三段 */
.sec-title{font-size:13px;font-weight:700;color:var(--tx2);letter-spacing:.3px;margin:10px 0 4px}
.confirm{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.confirm b{color:#b45309}
.confirm .row{margin-top:3px}
.confirm .rep{color:#166534;font-weight:600}
details{ margin-top:8px }
details summary{cursor:pointer;color:var(--blue);font-size:13px}
details[open] summary{margin-bottom:8px}
.cncl{font-size:14px;padding:3px 0}
table.cmp{font-size:13px}
table.cmp td,table.cmp th{padding:5px 8px}
/* 调研结论阅读层：卡片 / 自动归类 / 来源还原（RESEARCH_V3） */
.rsch-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rsch-stat{font-size:12.5px;color:var(--tx3)}
.rsch-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.rsch-grp{margin-top:14px}
.rsch-grp-t{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--tx2);
  padding:5px 2px;border-bottom:1px solid var(--line)}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:9px}
.rcard.attention{border-left:3px solid var(--amber)}
.rcard-head{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.rcard-id{font-size:11px;font-weight:700;color:var(--blue);background:#eff6ff;border-radius:6px;padding:1px 7px;white-space:nowrap}
.rcard-topic{font-weight:700;font-size:14.5px;flex:1;min-width:170px;line-height:1.5}
.rcard-meta{font-size:12px;color:var(--tx3);white-space:nowrap}
.rcard-sum{margin-top:8px;font-size:14px;line-height:1.75;color:var(--tx)}
.rcard-sum.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rcard-more{background:none;border:0;color:var(--blue);font-size:12.5px;cursor:pointer;padding:3px 0}
.reflink{color:var(--blue);font-size:10px;vertical-align:super;text-decoration:none}
.openbox{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 11px;margin-top:9px;font-size:13px}
.openbox b{color:#b45309}
.openbox ul{margin:5px 0 0 16px;padding:0}
.openbox li{margin:2px 0}
.rcdetails{margin-top:8px}
.srclist{list-style:none;margin:4px 0 0;padding:0}
.srclist li{padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;word-break:break-word;line-height:1.55}
.srclist li:last-child{border:0}
.srclist .dom{color:var(--tx3);font-size:11px;margin-left:6px}
.needbox{background:#fffbeb;border:1px solid #fde68a;border-radius:11px;padding:11px 13px;margin-top:10px}
.needbox .t{font-weight:700;color:#b45309;font-size:13.5px}
.needbox ol{margin:6px 0 0 18px;font-size:13px}
.needbox li{margin:3px 0;line-height:1.6}

/* 自循环状态条 */
#pulse{position:fixed;right:16px;bottom:16px;z-index:8;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:8px 13px;font-size:12.5px;box-shadow:0 4px 18px rgba(20,30,50,.12);color:var(--tx2)}
#pulse b{color:var(--green)}
#pulse.busy b{color:var(--amber)}
#pulse.err b{color:var(--red)}
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:10;background:var(--tx);color:#fff;
  border-radius:9px;padding:9px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"><div class="sub">加载中…</div></div>
<div id="pulse" class="hidden">状态：<b>初始化</b></div>
<div id="toast"></div>
<script>
/* ── 令牌：服务端自动注入（bootstrap），页面不再要求人工输入 ── */
var RTOK='wb_hrd_remote_token';
function getToken(){ try{return localStorage.getItem(RTOK)||'';}catch(e){return '';} }
function setToken(t){ try{localStorage.setItem(RTOK,t);}catch(e){} }
function H(tok){ return {'Content-Type':'application/json','X-HRD-Token':tok}; }
var state={data:null,findings:[],phase:'ALL',autorun:true,ingesting:false,
           ver:'',updated:'',booting:false,lastAutoAt:0,rphase:'ALL',draft:'',bootPending:false};
var POLL_MS=30000;
var AUTO_MS=30*60*1000;

function pulse(text,kind){
  var el=document.getElementById('pulse'); if(!el) return;
  el.classList.remove('hidden','busy','err');
  if(kind) el.classList.add(kind);
  el.innerHTML='状态：<b>'+esc(text)+'</b>'+
    (state.ver?' · 版本 '+esc(state.ver):'')+
    (state.updated?' · 更新 '+esc(state.updated.slice(5,16).replace('T',' ')):'');
}
function toast(msg){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.add('on');
  clearTimeout(t._timer); t._timer=setTimeout(function(){t.classList.remove('on');},2600);
}
async function getTokenAuto(){
  var tok=getToken();
  if(tok) return tok;
  try{
    var r=await fetch('/api/reloc/bootstrap');
    if(!r.ok) return '';
    var d=await r.json();
    if(d&&d.token){ setToken(d.token); return d.token; }
  }catch(e){}
  return '';
}
async function api(path,opt){
  var tok=await getTokenAuto();
  var o=Object.assign({},opt||{});
  o.headers=Object.assign({},H(tok),o.headers||{});
  var r=await fetch(path,o);
  if(r.status===401){
    try{localStorage.removeItem(RTOK);}catch(e){}
    tok=await getTokenAuto();
    o.headers=Object.assign({},H(tok),o.headers||{});
    r=await fetch(path,o);
  }
  return r;
}
async function boot(silent){
  /* 防重入但不吞请求：正在拉取时标记 pending，等当前这轮结束后自动再跑一轮 */
  if(state.booting){ state.bootPending=true; return waitBoot(); }
  state.booting=true;
  try{
    var r=await api('/api/hrd/reloc/summary');
    if(!r.ok) throw new Error('HTTP '+r.status);
    var d=await r.json();
    if(!d.ok) throw new Error(d.error||'summary failed');
    var changed=(state.ver!==String(d.meta.version||''));
    state.data=d;
    state.ver=String(d.meta.version||'');
    state.updated=d.meta.last_ingest||String((d.digest||{}).date||'');
    try{
      var r2=await api('/api/hrd/reloc/findings');
      var d2=await r2.json(); state.findings=(d2.findings||[]);
    }catch(e){}
    render();
    if(changed && !silent && state.ver){ toast('已同步新版 v'+state.ver); }
    pulse(state.ingesting?'AI 入库中…':'已同步');
  }catch(e){
    document.getElementById('app').innerHTML='<div class="card">加载失败：'+esc(e.message)+
      ' <button class="btn" onclick="boot()">重试</button></div>';
    pulse('同步失败','err');
  }finally{
    state.booting=false;
    if(state.bootPending){
      state.bootPending=false;
      setTimeout(function(){ boot(true); },0);
    }
  }
}
function waitBoot(){
  return new Promise(function(res){
    var t=setInterval(function(){ if(!state.booting){ clearInterval(t); res(); } },30);
    setTimeout(function(){ clearInterval(t); res(); },8000);
  });
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function badge(cls,txt){ return '<span class="badge b-'+cls+'">'+esc(txt)+'</span>'; }
function stBadge(s){ return badge(s,{todo:'待启动',research:'研究中',waiting_on:'等待外部',blocked:'受阻',doing:'进行中',done:'已完成',dropped:'放弃'}[s]||s); }
function riskBadge(r){ return r==='high'?badge('high','高风险'):r==='med'?badge('med','中'):badge('low','低'); }

/* ── 周报：三段式（≤15行精神：先结论后依据） ── */
function weeklyBlock(d){
  var dg=d.digest||{};
  var w=dg.weekly||{};
  var done=(w.done_auto||dg.actions||[]);
  var confs=(w.confirmations||dg.confirmations||[]);
  var cncl=(w.countdown||dg.countdown||[]);
  var doneHtml=done.map(function(a){return '<div class="cncl">· '+esc(a)+'</div>';}).join('')||'<div class="muted">· 本周无自动进展</div>';
  var confHtml=confs.map(function(c){
    var line='【需确认】'+c.item+'｜推荐：'+c.recommend+'｜'+c.why+'｜截止'+(c.deadline||'—')+'｜回复"1"即同意';
    return '<div class="confirm"><b>【需确认】'+esc(c.item)+'</b>'+
      '<div class="row">推荐方案：<span class="rep">'+esc(c.recommend)+'</span></div>'+
      '<div class="row">理由：'+esc(c.why)+'　截止：'+esc(c.deadline||'—')+'</div>'+
      '<div class="row muted">回复“1”即同意（微信同效）　·　'+c.id+'</div>'+
      '<div class="row"><button class="btn" onclick="copyConfirm(this)" data-txt="'+esc(line)+'">复制确认请求</button>'+
      '<button class="btn" onclick="ackConfirm(this)" data-id="'+esc(c.id||'')+'" data-item="'+esc(c.item||'')+'">已确认 · 销账</button></div></div>';
  }).join('')||'<div class="muted">· 本周无需确认</div>';
  var cnclHtml=cncl.map(function(x){return '<div class="cncl">· '+esc(x)+'</div>';}).join('');
  var g=d.gate||dg.gate||{}, f=d.family||dg.family||{};
  var gHtml='<div class="cncl">· 工作签闸门 GATE-01：'+(g.issued?'<span class="rep">已下发</span>':'<span class="badge b-waiting_on">待确认（每周五问一次）</span>')+'</div>';
  var fHtml='<div class="cncl">· 家属签 FAM-01：'+esc(f.stage||'材料齐备')+'（材料齐备→递交→获批）</div>';
  var cp=(dg.critical_path||[]).map(function(x){return badge(x.risk==='high'?'high':x.risk==='med'?'med':'low',x.id+' '+x.status);}).join(' ')||'<span class="muted">无</span>';
  return '<div class="card"><h3>本周汇总 <span class="muted" style="font-weight:400;font-size:12px">版本 '+esc(state.ver||'—')+' · 规范 v2</span></h3>'+
    '<div class="sec-title">① 已完成（自动）</div>'+doneHtml+
    '<div class="sec-title">② 需你确认（'+confs.length+'/3）</div>'+confHtml+
    '<div class="sec-title">③ 关键路径倒计时与风险</div>'+cnclHtml+gHtml+fHtml+
    '<div class="muted" style="margin-top:6px">关键路径：'+cp+'</div>'+
    (dg.note?'<div class="muted" style="margin-top:6px">'+esc(dg.note)+'</div>':'')+
    '</div>';
}
function copyConfirm(btn){
  var t=btn.getAttribute('data-txt')||'';
  try{ navigator.clipboard.writeText(t).then(function(){toast('已复制，可直接粘贴回复');}); }
  catch(e){ toast('请长按选择文字复制'); }
}
async function ackConfirm(btn){
  var id=btn.getAttribute('data-id')||'', item=btn.getAttribute('data-item')||'';
  try{
    var r=await api('/api/hrd/reloc/confirm',{method:'POST',body:JSON.stringify({id:id,item:item})});
    var d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||('HTTP '+r.status));
    toast('已销账 · v'+d.version);
    await boot(true);
  }catch(e){ toast('销账失败：'+e.message); }
}

/* ── 调研结论：自动归类 / 摘要折叠 / 来源还原 / 需知会聚合（RESEARCH_V3） ── */
var RCH_PHASES=['GATE','FAM','HOUSE','CAR','KIDS','DOCS','OTHER'];
var RCH_LABEL={GATE:'工作签闸门',FAM:'家属签证',HOUSE:'住房',CAR:'用车',KIDS:'孩子教育',DOCS:'文件签署',OTHER:'其他'};
function rphase(f){
  var t=String(f.task_id||'')+' '+String(f.topic||'');
  if(/GATE|居留|Emirates|工作签|入职手续/i.test(t)) return 'GATE';
  if(/FAM|家属签|配偶签/i.test(t)) return 'FAM';
  if(/nursery|幼儿园|托儿|学校|入学|校历|探亲|教育|孩子|子女|waitlist|Headington|Blossom|小学/i.test(t)) return 'KIDS';
  if(/认证|公证|apostille|FCDO|出生证|结婚证|学历|文件|签署|保单|保险|签证材料/i.test(t)) return 'DOCS';
  if(/用车|汽车|驾照|上牌|车牌|购车/i.test(t)) return 'CAR';
  if(/住房|租房|房租|房源|物业|小区|地址登记|入住|HOUSE/i.test(t)) return 'HOUSE';
  return 'OTHER';
}
function rjson(x){ try{var a=JSON.parse(x||'[]');return Array.isArray(a)?a:[];}catch(e){return [];} }
function rtext(x){ return String(x==null?'':x).replace(/\s+/g,' ').trim(); }
function rsummary(t,n){
  t=rtext(t); if(t.length<=n) return t;
  var c=t.slice(0,n), p=Math.max(c.lastIndexOf('。'),c.lastIndexOf('；'),c.lastIndexOf('. '));
  return (p>n*0.55?c.slice(0,p+1):c)+'…';
}
function rrefs(t){
  var a=[],m,re=/\[(\d+)\]/g;
  while((m=re.exec(String(t||'')))){var n=+m[1];if(a.indexOf(n)<0)a.push(n);}
  return a.sort(function(x,y){return x-y;});
}
function rlink(t,cid){
  return esc(t).replace(/\[(\d+)\]/g,function(all,n){
    return '<a class="reflink" href="#src-'+cid+'-'+n+'" title="跳到来源 '+n+'">['+n+']</a>';
  });
}
function rsources(f,obj){
  if(obj&&obj.sources&&obj.sources.length) return obj.sources.map(function(x){
    return {title:String(x.title||'来源'),url:String(x.url||'')};
  });
  return String(f.source||'').split(/\s*\|\|\s*/).map(function(part){
    var m=part.match(/^(.+?):\s*(https?:\/\/\S+)\s*$/);
    return m?{title:m[1].trim(),url:m[2].trim()}:{title:part.trim(),url:''};
  }).filter(function(x){return x.title;});
}
function rsafe(u){ return /^https?:\/\//i.test(u)?esc(u):''; }
function rdomain(u){ try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return '';} }
function robj(f){
  try{var p=JSON.parse(f.conclusion||'');if(p&&typeof p==='object'&&p.conclusion!=null)return p;}catch(e){}
  return null;
}
function ropens(f,obj){ return rjson(f.open_items).concat(obj&&obj.next_confirm?obj.next_confirm:[]); }

function rcard(f,cid){
  var obj=robj(f);
  var text=obj?String(obj.conclusion||''):String(f.conclusion||'');
  var opens=ropens(f,obj), srcs=rsources(f,obj), refs=rrefs(text);
  var sum=rsummary(text,150);
  var conf=String(f.confidence||'');
  var cc=conf.indexOf('高')===0?'low':conf.indexOf('中')===0?'med':'high';
  var h='<div class="rcard'+(opens.length?' attention':'')+'" id="rc-'+cid+'">';
  h+='<div class="rcard-head"><span class="rcard-id">'+esc(f.task_id||'')+'</span>'+
     '<span class="rcard-topic">'+esc(f.topic||'调研')+'</span>'+
     badge(cc,conf||'未标注')+'<span class="rcard-meta">'+esc(String(f.checked||'').slice(0,10))+'</span></div>';
  h+='<div class="rcard-sum clamp" id="rcsum-'+cid+'">'+rlink(sum,cid)+'</div>';
  h+='<div class="rcard-sum hidden" id="rcfull-'+cid+'">'+rlink(text,cid)+'</div>';
  h+='<button class="rcard-more" onclick="rtoggle('+cid+')" id="rcbtn-'+cid+'">展开全文'+
     (text.length>150?'（'+text.length+' 字）':'')+'</button>';
  if(opens.length){
    h+='<div class="openbox"><b>需你知会 · '+opens.length+' 项待核实</b><ul>'+
      opens.slice(0,3).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+
      (opens.length>3?'<li class="muted">另有 '+(opens.length-3)+' 项，见下方明细</li>':'')+'</ul></div>';
  }
  h+='<details class="rcdetails"><summary>来源与依据（'+srcs.length+'）· 全部待核实 · 6段明细</summary>';
  h+='<div class="sec-title">数据来源与日期</div>';
  h+=srcs.length?('<ul class="srclist">'+srcs.map(function(x,k){
      var u=rsafe(x.url), d=rdomain(u);
      return '<li id="src-'+cid+'-'+(k+1)+'">'+(k+1)+'. '+
        (u?'<a href="'+u+'" target="_blank" rel="noopener">'+esc(x.title)+'</a>':esc(x.title))+
        (d?'<span class="dom">'+esc(d)+'</span>':'')+'</li>';
    }).join('')+'</ul>'):'<div class="muted">未核实</div>';
  h+='<div class="muted" style="margin-top:5px">核对：'+esc(String(f.checked||'').slice(0,16).replace('T',' '))+
     '　出处：'+esc(String(f.source||'').indexOf('家长录入')===0?'家长录入':String(f.source||'').slice(0,36))+'</div>';
  if(opens.length) h+='<div class="sec-title">全部待核实（'+opens.length+'）</div><ul class="srclist">'+
    opens.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
  if(obj){
    if(obj.table&&obj.table.length){
      var keys=Object.keys(obj.table[0]).slice(0,6);
      h+='<div class="sec-title">对比表</div><div style="overflow-x:auto"><table class="cmp"><tr>'+
        keys.map(function(k){return '<th>'+esc(k)+'</th>';}).join('')+'</tr>'+
        obj.table.slice(0,5).map(function(row){return '<tr>'+keys.map(function(k){return '<td>'+esc(row[k])+'</td>';}).join('')+'</tr>';}).join('')+'</table></div>';
    }
    if(obj.score_rule) h+='<div class="muted" style="margin-top:4px">评分规则：'+esc(obj.score_rule)+'</div>';
    if(obj.risks&&obj.risks.length) h+='<div class="sec-title">风险与不确定点</div>'+
      obj.risks.slice(0,3).map(function(x){return '<div class="cncl">· '+esc(x)+'</div>';}).join('');
    if(obj.next_auto&&obj.next_auto.length) h+='<div class="sec-title">下一步 · 自动执行</div>'+
      obj.next_auto.map(function(x){return '<div class="cncl">· '+esc(x)+'</div>';}).join('');
  }
  h+='</details></div>';
  return h;
}

function rneeds(list){
  var items=[];
  list.forEach(function(f){
    var a=ropens(f,robj(f));
    a.forEach(function(x){items.push({task:String(f.task_id||''),text:String(x)});});
  });
  if(!items.length) return '';
  var tasks=[]; items.forEach(function(x){if(tasks.indexOf(x.task)<0)tasks.push(x.task);});
  return '<div class="needbox"><div class="t">需你知会 · '+items.length+' 项待核实（自动汇总自 '+tasks.length+' 条调研）</div>'+
    '<ol>'+items.slice(0,3).map(function(x){return '<li>'+esc(x.text)+' <span class="muted">['+esc(x.task)+']</span></li>';}).join('')+'</ol>'+
    (items.length>3?'<div class="muted">另有 '+(items.length-3)+' 项，见各卡片内「需你知会」</div>':'')+
    '<button class="btn" style="margin-top:8px" onclick="copyNeeds()">复制需知会清单</button></div>';
}
function copyNeeds(){
  var out=[];
  (state.findings||[]).forEach(function(f){
    ropens(f,robj(f)).forEach(function(x){out.push('【需知会】'+(f.task_id||'')+'｜'+x);});
  });
  var t=out.slice(0,10).join('\n');
  try{navigator.clipboard.writeText(t).then(function(){toast('已复制 '+Math.min(out.length,10)+' 项');});}
  catch(e){toast('请长按选择文字复制');}
}
function setRPhase(p){ state.rphase=p; render(); }
function rtoggle(id){
  var s=document.getElementById('rcsum-'+id), f=document.getElementById('rcfull-'+id), b=document.getElementById('rcbtn-'+id);
  if(!s||!f||!b) return;
  if(f.classList.contains('hidden')){
    s.classList.add('hidden'); f.classList.remove('hidden'); b.textContent='收起';
  }else{
    f.classList.add('hidden'); s.classList.remove('hidden'); b.textContent='展开全文';
  }
}
function researchBlock(fs){
  /* 自动剔除验证用脏数据；不误伤真实人工录入 */
  var list=(fs||[]).filter(function(f){ return !/^验证测试：请忽略此条/.test(rtext(f.conclusion||f.topic)); });
  var cards=list.map(function(f,k){
    return {f:f,i:k,ph:rphase(f),n:ropens(f,robj(f)).length,date:String(f.checked||'')};
  });
  cards.sort(function(a,b){ return (b.n-a.n)||b.date.localeCompare(a.date); });
  var phs=RCH_PHASES.filter(function(p){ return cards.some(function(c){return c.ph===p;}); });
  var tabs='<div class="rsch-tabs"><span class="chip'+(state.rphase==='ALL'?' on':'')+'" onclick="setRPhase(\'ALL\')">全部 '+cards.length+'</span>'+
    phs.map(function(p){
      return '<span class="chip'+(state.rphase===p?' on':'')+'" onclick="setRPhase(\''+p+'\')">'+
        RCH_LABEL[p]+' '+cards.filter(function(c){return c.ph===p;}).length+'</span>';
    }).join('')+'</div>';
  var shown=cards.filter(function(c){return state.rphase==='ALL'||c.ph===state.rphase;});
  var body=phs.map(function(p){
    var g=shown.filter(function(c){return c.ph===p;});
    if(!g.length) return '';
    return '<div class="rsch-grp"><div class="rsch-grp-t"><span>'+RCH_LABEL[p]+'</span><span>'+g.length+' 条</span></div>'+
      g.map(function(c){return rcard(c.f,c.i);}).join('')+'</div>';
  }).join('')||'<div class="muted">暂无研究结论</div>';
  var needN=0; list.forEach(function(f){needN+=ropens(f,robj(f)).length;});
  return '<div class="card"><div class="rsch-head"><h3>调研结论 '+
    '<span class="muted" style="font-weight:400;font-size:12px">自动归类 · 来源还原 · 需知会聚合</span></h3>'+
    '<span class="rsch-stat">'+cards.length+' 条调研 · '+phs.length+' 类 · '+needN+' 项待核实</span></div>'+
    rneeds(list)+tabs+body+'</div>';
}

var PHASE_LABEL={GATE:'工作签闸门',FAM:'家属签证',HOUSE:'住房',CAR:'用车',KIDS:'孩子教育',DOCS:'文件签署'};
function render(){
  /* 保留正在输入的草稿与光标，避免 30 秒轮询把 textarea 冲掉 */
  var _old=document.getElementById('ingestInput');
  var _focused=_old&&document.activeElement===_old;
  var _pos=_old&&typeof _old.selectionStart==='number'?_old.selectionStart:null;
  if(_old&&_old.value) state.draft=_old.value;
  var d=state.data, dg=d.digest||{}, m=d.meta||{}, c=d.counts||{};
  var phases=Array.from(new Set(d.tasks.map(function(t){return t.phase;}))).sort();
  var chips=['ALL'].concat(phases).map(function(p){
    return '<span class="chip'+(state.phase===p?' on':'')+'" onclick="setPhase(\''+p+'\')">'+
      (p==='ALL'?'全部':(PHASE_LABEL[p]||p))+'</span>';}).join('');
  var rows=d.tasks.filter(function(t){return state.phase==='ALL'||t.phase===state.phase;}).map(function(t){
    return '<tr><td class="tid">'+t.id+'</td><td>'+esc(t.title)+
      (t.notes?'<div class="muted" style="font-size:12.5px">'+esc(t.notes)+'</div>':'')+'</td>'+
      '<td>'+esc(t.owner||'—')+'</td><td>'+esc(t.due||'—')+(t.depends_on?'<div class="muted" style="font-size:12px">前置 '+esc(t.depends_on)+'</div>':'')+'</td>'+
      '<td>'+stBadge(t.status)+' '+riskBadge(t.risk)+(t.human_gate?' <span class="badge b-high">需确认</span>':'')+'</td>'+
      '<td><select class="sel" onchange="setSt(\''+t.id+'\',this.value)">'+
      ['todo','research','waiting_on','blocked','doing','done'].map(function(s){return '<option value="'+s+'"'+(s===t.status?' selected':'')+'>'+({todo:'待启动',research:'研究中',waiting_on:'等待外部',blocked:'受阻',doing:'进行中',done:'已完成'})[s]+'</option>';}).join('')+'</select></td></tr>';
  }).join('');
  document.getElementById('app').innerHTML=
   (new URLSearchParams(location.search).get('embed')==='1'?'':
    '<div class="tool"><div><h1>迪拜搬迁台</h1><div class="sub">伊斯坦布尔 → 迪拜 · '+esc(m.arrival_anchor||'')+
    ' · 数据版本 '+esc(state.ver||'—')+' · 更新 '+esc(state.updated.slice(0,16).replace('T',' '))+'</div></div>'+
    '<div><button class="btn" onclick="boot()">刷新</button></div></div>')+
   weeklyBlock(d)+
   '<div class="card"><h3>AI 入库 · 自循环</h3>'+
    '<div class="muted">按行为规范 v2 分析 6 条主线与已核实结论，产出周报三段，自动写回并递增版本（'+POLL_MS/1000+' 秒同步，每 '+AUTO_MS/60000+' 分钟自动分析）。信息搜集/比价/清单/草稿/催办/排期/预警全部自动；仅付款·签字·交证件·偏好取舍·信息缺失五类需你确认。</div>'+
    '<div class="muted" style="margin-top:10px">录入新线索（可选）：政策变化、签证/住房进展、学校反馈——AI 一并分析，金额会保留原币种并附折算。</div>'+
    '<textarea id="ingestInput" placeholder="例：11/14 学校回复：Latin 已换成 Classical Civilisation；房租 AED 95,000/年（≈¥18.6万，11/15 查）…" oninput="state.draft=this.value;"></textarea>'+
    '<div class="chips"><button class="btn btn-pri" id="ingestBtn" onclick="runIngest(true)"'+(state.ingesting?' disabled':'')+'>'+
      (state.ingesting?'分析中…':'立即 AI 入库')+'</button>'+
      '<button class="btn" onclick="toggleAuto()">'+(state.autorun?'暂停自动循环':'恢复自动循环')+'</button></div>'+
    '<div class="muted" id="ingestMsg">'+esc(m.last_ingest_by==='reloc-ai-ingest'?('最近由 AI 于 '+String(m.last_ingest||'').slice(5,16).replace('T',' ')+' 更新'):'尚未执行 AI 入库')+'</div></div>'+
   researchBlock(state.findings)+
   '<div class="card"><h3>主线任务图（'+d.tasks.length+' 项 · 6 条主线）</h3><div class="chips">'+chips+'</div>'+
    '<div style="overflow-x:auto"><table><tr><th>ID</th><th>里程碑</th><th>负责</th><th>截止/前置</th><th>状态</th><th>改状态</th></tr>'+rows+'</table></div>'+
    '<div class="muted" style="margin-top:10px">跟踪粒度：工作签由公司办、只留 GATE-01 一个下发状态；家属签只记三状态；4 类主事项只保留里程碑。红线：签字/付款/交证件永远人工确认。</div></div>';
  var _new=document.getElementById('ingestInput');
  if(_new&&state.draft){ _new.value=state.draft; }
  if(_new&&_focused){ try{ _new.focus(); if(_pos!=null)_new.setSelectionRange(_pos,_pos); }catch(e){} }
}
function setPhase(p){ state.phase=p; render(); }
async function setSt(id,s){
  var r=await api('/api/hrd/reloc/task',{method:'POST',body:JSON.stringify({id:id,status:s})});
  var d=await r.json();
  if(d.ok){ var t=state.data.tasks.find(function(x){return x.id===id;}); if(t) t.status=s; render(); toast('已更新 '+id); }
  else alert('更新失败：'+(d.error||''));
}
async function runIngest(force){
  if(state.ingesting) return;
  state.ingesting=true; pulse('AI 入库中…','busy');
  var btn=document.getElementById('ingestBtn'); if(btn){btn.disabled=true;btn.textContent='分析中…';}
  try{
    var inp=document.getElementById('ingestInput');
    var userInput=inp?String(inp.value||'').trim():'';
    var r=await api('/api/hrd/reloc/ingest',{method:'POST',
      body:JSON.stringify({force:!!force,input:userInput})});
    var d=await r.json();
    if(!r.ok||!d.ok) throw new Error(d.error||('HTTP '+r.status));
    if(d.skipped){ toast(d.seconds_left+' 秒内已分析过，跳过'); }
    else{
      toast('AI 入库完成 · v'+d.version+(d.degraded?'（降级模式）':'')+
        ((d.auto_closed&&d.auto_closed.length)?' · 自动关闭 '+d.auto_closed.map(function(x){return x.id;}).join('/'):''));
      var msg=document.getElementById('ingestMsg');
      if(msg) msg.textContent='AI 于 '+String(d.updated).slice(11,16)+' 更新 · '+(d.actions||[]).length+' 条进展 · '+(d.confirmations||[]).length+' 条待确认';
    }
    state.lastAutoAt=Date.now();
    /* 入库成功后先确保数据刷新完成，再清空草稿，避免"没更新"错觉 */
    await boot(true);
    if(userInput && d.ok && !d.skipped){
      state.draft='';
      var ninp=document.getElementById('ingestInput'); if(ninp) ninp.value='';
      toast('已录入 '+userInput.length+' 字，AI 已纳入分析');
    }
  }catch(e){ toast('AI 入库失败：'+e.message); pulse('入库失败','err'); }
  finally{
    state.ingesting=false;
    var b=document.getElementById('ingestBtn'); if(b){b.disabled=false;b.textContent='立即 AI 入库';}
    if(!state.ingesting) pulse('已同步');
  }
}
function toggleAuto(){ state.autorun=!state.autorun; toast(state.autorun?'自动循环已恢复':'自动循环已暂停'); render(); }

setInterval(function(){
  if(state.ingesting) return;                       /* 入库中不轮询，防止重建 DOM */
  var ta=document.getElementById('ingestInput');
  if(ta && document.activeElement===ta && ta.value) return; /* 用户正在输入时不打断 */
  boot(true);
},POLL_MS);
setInterval(function(){
  if(!state.autorun||state.ingesting||document.hidden) return;
  if(Date.now()-state.lastAutoAt<AUTO_MS) return;
  state.lastAutoAt=Date.now();
  runIngest(false);
},60000);
try{ window.addEventListener('storage',function(e){ if(e.key==='reloc-version') boot(true); }); }catch(e){}
function watchVersion(){
  var v=(state.data&&state.data.meta.version)||'';
  try{ if(v && localStorage.getItem('reloc-version')!==String(v)) localStorage.setItem('reloc-version',String(v)); }catch(e){}
  setTimeout(watchVersion,5000);
}
if(new URLSearchParams(location.search).get('embed')==='1') document.body.classList.add('embed');
boot();
watchVersion();
</script>
