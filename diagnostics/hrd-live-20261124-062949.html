function openForm(m,row,asNew){
  var focused=false;                                     // 新增时自动聚焦首个文本输入
  /* asNew（P0-1 笔记转待办）：预填新增——字段值取 row 渲染，保存走新增分支并携带 row._ref */
  var isEdit=!!row&&!asNew;
  /* 笔记配图：编辑列表提前初始化（网格首渲内联进 HTML，交互后再局部更新）。
     imgCellsHtml 必须是函数作用域（h 字符串构建时就要用），不能放进 if 块。 */
  var _editImgs=[], _delImgs=[];
  var imgCellsHtml=function(){
    return _editImgs.map(function(im,i){
      return '<div class="img-cell"><img src="'+imgUrl(im.id)+'" alt="">'
        +'<button type="button" class="img-del" data-imgdel="'+i+'" title="删除这张图">✕</button>'
        +'<div class="img-nm" title="'+esc(im.name||'')+'">'+esc(im.name||('图片 '+(i+1)))+'</div></div>';
    }).join('');
  };
  if(m.key==='notes'){
    _editImgs=((row&&row._imgs)||[]).map(function(im){ return {id:im.id,name:im.name||'',w:im.w||0,h:im.h||0}; });
  }
  var h='<div class="modal-h"><h3>'+(isEdit?'编辑':'新增')+' · '+m.title+'</h3><button class="icon-btn" id="mClose">✕</button></div><div class="modal-b"><form id="mForm"><div class="f-grid">';
  m.fields.forEach(function(f){
    var full=(f.t==='textarea')?' style="grid-column:1/-1"':'';
    h+='<div class="f-row"'+full+'><label>'+f.f+(f.req?' <span style="color:var(--red)">*</span>':'')+'</label>';
    var val=row?row[f.f]:'';
    var af=(!isEdit&&!focused&&f.t==='text')?' autofocus':'';  // 快捷新建后可直接打字
    if(af) focused=true;
    if(f.t==='select'){
      var cur=val||(row?'':f.def||'');           // 新增时用 def 作为默认值
      h+='<select name="'+f.f+'"><option value="">请选择</option>';
      (f.opts||[]).forEach(function(o){ h+='<option'+(cur===o?' selected':'')+'>'+o+'</option>'; });
      h+='</select>';
    }
    else if(f.t==='textarea'){
      if(m.key==='notes'){
        h+='<div style="display:flex;justify-content:flex-end;margin-bottom:6px"><span class="md-toggle"><button type="button" class="on" id="mdEditBtn">编辑</button><button type="button" id="mdPrevBtn">预览</button></span></div>'
          +'<div id="mdEditWrap"><textarea name="'+f.f+'" style="min-height:340px">'+esc(val||'')+'</textarea></div>'
          +'<div class="md-preview" id="mdPrevWrap" style="display:none"></div>';
      }else{
        h+='<textarea name="'+f.f+'">'+esc(val||'')+'</textarea>';
      }
    }
    else if(f.t==='number'){ h+='<input type="number" step="any" name="'+f.f+'" value="'+esc(val||'')+'"'+(f.req?' required':'')+'>'; }
    else if(f.t==='date'){ h+='<input type="date" name="'+f.f+'" value="'+esc(val||'')+'"'+(f.req?' required':'')+'>'; }
    else{ h+='<input type="text" name="'+f.f+'" value="'+esc(val||'')+'"'+(f.req?' required':'')+af+'>'; }
    h+='</div>';
  });
  if(m.key==='notes'){
    h+='<div class="img-sec"><div class="img-sec-h"><span>配图</span>'
      +'<span class="img-sec-tip">JPG / PNG / GIF · 单张≤5MB · 自动压缩后上传 · 需联网</span></div>'
      +'<div class="img-drop" id="imgDrop">点击选择图片，或拖拽到此处<input type="file" id="imgFile" accept="'+IMG_ACCEPT+'" multiple hidden></div>'
      +'<div class="img-grid" id="imgGrid">'+imgCellsHtml()+'</div></div>';
  }
  if(m.key==='tasks'||m.key==='notes') h+=HRV.fieldHtml(m.key, isEdit?row:null, HRV_PRESET_NODE||'');
  h+='</div></form></div><div class="modal-f"><button class="btn" id="mCancel">取消</button><button class="btn btn-pri" id="mSubmit">'+(isEdit?'保存':'新增')+'</button></div>';
  $('#modalBox').innerHTML=h; $('#modalBox').style.maxWidth=(m.key==='notes'?'760px':''); $('#mask').classList.add('show');
  $('#mClose').addEventListener('click',closeModal); $('#mCancel').addEventListener('click',closeModal);
  /* B6 笔记编辑区：编辑 / 预览切换（预览只读，不改动源码） */
  if(m.key==='notes'){
    var me=$('#mdEditBtn'), mp=$('#mdPrevBtn');
    if(me&&mp){
      me.addEventListener('click',function(){
        $('#mdEditWrap').style.display=''; $('#mdPrevWrap').style.display='none';
        me.classList.add('on'); mp.classList.remove('on');
      });
      mp.addEventListener('click',function(){
        var ta=document.querySelector('#mForm textarea[name="内容"]');
        var v=ta?ta.value:'';
        $('#mdEditWrap').style.display='none'; $('#mdPrevWrap').style.display='';
        $('#mdPrevWrap').innerHTML=v.trim()?mdRender(v):'<div style="color:var(--tx3)">（暂无内容）</div>';
        mp.classList.add('on'); me.classList.remove('on');
      });

    _editImgs.forEach(function(im){ _origImgIds[im.id]=1; });
    function renderImgGrid(){ var g=$('#imgGrid'); if(g) g.innerHTML=imgCellsHtml(); }
    function addImgFile(f){
      if(!remoteOk()||isLocalFile()){ toast('图片功能需要在线使用（本地副本已停用）',1); return; }
      if(!rToken()){ toast('请先在「备份与恢复」里设置同步密码',1); return; }

        _editImgs.push(im); renderImgGrid();

      })['catch'](function(e){
        if(cell.parentNode) cell.parentNode.removeChild(cell);
        toast(e.message||'上传失败',1);
      });
    }
    function cancelImgCleanup(){
      /* 取消/关闭时丢弃本次新上传的图（入待删队列，下次 PUT 成功后 flush）；
         原有图片不动——记录未保存，引用仍在。 */
      _editImgs.forEach(function(im){ if(!_origImgIds[im.id]) queueImgDel(im.id); });
    }
    var drop=$('#imgDrop'), file=$('#imgFile');
    drop.addEventListener('click',function(){ file.click(); });
    file.addEventListener('change',function(){
      Array.prototype.forEach.call(file.files||[],function(f){ addImgFile(f); });
      file.value='';
    });
    drop.addEventListener('dragover',function(e){ e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave',function(){ drop.classList.remove('over'); });
    drop.addEventListener('drop',function(e){
      e.preventDefault(); drop.classList.remove('over');
      var fs=e.dataTransfer&&e.dataTransfer.files;
      Array.prototype.forEach.call(fs||[],function(f){ addImgFile(f); });
    });
    $('#imgGrid').addEventListener('click',function(e){
      var btn=e.target&&e.target.closest?e.target.closest('[data-imgdel]'):null;
      if(!btn) return;
      var i=Number(btn.getAttribute('data-imgdel'));
      var im=_editImgs.splice(i,1)[0];
      if(im) _delImgs.push(im.id);                    // 保存成功后删文件（见 mSubmit）
      renderImgGrid();
    });
    $('#mClose').addEventListener('click',cancelImgCleanup);
    $('#mCancel').addEventListener('click',cancelImgCleanup);
  }
  $('#mSubmit').addEventListener('click',function(){
    var form=$('#mForm'); if(!form.reportValidity()) return;
    var obj={};
    m.fields.forEach(function(f){ var el=form.querySelector('[name="'+f.f+'"]'); obj[f.f]=el?el.value:''; });
    /* HRV：写前冲突比对 + 同 title/同节点/未完成 去重提示，绝不静默覆盖 */
    if(m.key==='tasks'||m.key==='notes'){
      if(isEdit && HRV.conflictFromForm(row, form)){
        if(!window.confirm('该记录已被其他页面修改（最后写入 '+(row._mtime||'')+'）。\n继续保存将以本次修改为准，原值会记入变更历史。是否继续？')) return;
      }
      if(!isEdit){
        var _nf=HRV.readField(form);
        var _dup=HRV.findDuplicate(state.data[m.key]||[], obj['标题']||'', _nf.id, null);
        if(_dup){
          if(window.confirm('发现重复：同标题 + 同一流程节点 + 未完成状态已存在「'+(_dup['标题']||'')+'」。\n是否改为编辑已有记录？（取消则放弃本次新增）')){
            closeModal(); openForm(m,_dup); return;
          }
          return;
        }
      }
    }
    if(m.key==='notes'){
      /* 从编辑列表里消失的图入待删队列：先 PUT 去引用、再删文件（flushImgDel） */
      var keep={};
      _editImgs.forEach(function(im){ keep[im.id]=1; });
      _delImgs.forEach(function(id){ if(!keep[id]) queueImgDel(id); });
      obj._imgs=_editImgs.map(function(im){ return {id:im.id,name:im.name||'',w:im.w||0,h:im.h||0}; });
    }
    if(isEdit){
      // 记录「哪些字段被本地改过」——次日同步只覆盖未改过的字段
      row._touched=row._touched||{};
      m.fields.forEach(function(f){
        if(String(row[f.f]===undefined?'':row[f.f])!==String(obj[f.f]===undefined?'':obj[f.f])) row._touched[f.f]=1;
      });
      Object.keys(obj).forEach(function(k){ row[k]=obj[k]; });
      row._mtime=nowIso();                             // 最后更新时间：驱动「最近更新」排序
    }
    else{ obj._id=genId(); obj._src='manual'; if(m.autoDate) obj[m.autoDate]=todayStr(); obj._ctime=nowIso(); obj._mtime=obj._ctime; if(row&&row._ref) obj._ref=row._ref; (state.data[m.key]=state.data[m.key]||[]).push(obj); }
    if(m.key==='tasks'||m.key==='notes') HRV.writeFields(isEdit?row:obj, form, {by:'pc'});
    saveData(m.key,state.data[m.key]); closeModal(); toast(row?'已保存':'已新增'); refreshAll();
  });
}

}
function validateBackup(obj){
  return !!(obj && typeof obj==='object' && obj.app==='hrd-workbench' && obj.data && typeof obj.data==='object');
}
/* 恢复策略：
   overwrite = 完全以备份为准（含墓碑）
   merge     = 本地为主：备份补齐本地没有的记录；本地 _touched 手改字段不被覆盖；
               备份里的删除墓碑合并进来（时间戳晚者胜） */
function applyBackup(obj, strategy){
  if(!validateBackup(obj)){ toast('备份文件格式不正确（缺少 hrd-workbench 标识）',1); return false; }
  if(strategy==='overwrite'){
    BK_KEYS.forEach(function(key){
      state.data[key]=(obj.data[key]||[]).slice();
      saveData(key, state.data[key]);
      try{ saveTombs(key, (obj.tombs&&obj.tombs[key])||{}); }catch(e){}
    });
  }else{
    BK_KEYS.forEach(function(key){
      var cur=state.data[key]||[], inc=obj.data[key]||[];
      var byId={}, byFp={};
      cur.forEach(function(r){ if(r&&r._id) byId[r._id]=r; if(r&&r._fp) byFp[r._fp]=r; });
      inc.forEach(function(r){
        if(!r) return;
        var hit=byId[r._id]||byFp[r._fp];
        if(hit){
          for(var f in r){
            if(f.indexOf('_')===0) continue;
            if(hit._touched && hit._touched[f]) continue;   // 本地手改字段：备份不覆盖
            hit[f]=r[f];
          }
          hit._touched=Object.assign({}, hit._touched||{}, r._touched||{});
          if(r._deleted){ hit._deleted=r._deleted; }
        }else{
          cur.push(r); if(r._id) byId[r._id]=r; if(r._fp) byFp[r._fp]=r;
        }
      });
      state.data[key]=cur; saveData(key, cur);
      try{
        var t=tombs(key), it=(obj.tombs&&obj.tombs[key])||{}, fp;
        for(fp in it){ if(!t[fp]||t[fp]<it[fp]) t[fp]=it[fp]; }
        saveTombs(key,t);
      }catch(e){}
    });
  }
  toast(strategy==='overwrite'?'已覆盖恢复（以备份为准）':'已合并恢复（本地修改优先保留）');
  refreshAll();
  return true;
}
function importBackupFile(file, strategy){
  var rd=new FileReader();
  rd.onload=function(){
    try{ applyBackup(JSON.parse(rd.result), strategy); }
    catch(e){ toast('备份文件解析失败：'+e.message,1); }
  };
  rd.readAsText(file);
}

function sha256Hex(str){
  var b=utf8Bytes(str), bitLen=b.length*8;
  var bitHi=Math.floor(bitLen/4294967296), bitLo=bitLen%4294967296;
  b.push(0x80);
  while(b.length%64!==56) b.push(0);
  b.push((bitHi>>>24)&0xFF,(bitHi>>>16)&0xFF,(bitHi>>>8)&0xFF,bitHi&0xFF,
         (bitLo>>>24)&0xFF,(bitLo>>>16)&0xFF,(bitLo>>>8)&0xFF,bitLo&0xFF);
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var w=new Array(64), off, i, a, bb, c, d, e, f, g, h, s0, s1, S0, S1, ch, maj, t1, t2;
  for(off=0; off<b.length; off+=64){
    for(i=0;i<16;i++) w[i]=((b[off+i*4]<<24)|(b[off+i*4+1]<<16)|(b[off+i*4+2]<<8)|b[off+i*4+3])>>>0;
    for(i=16;i<64;i++){
      s0=(_ror(w[i-15],7)^_ror(w[i-15],18)^(w[i-15]>>>3))>>>0;
      s1=(_ror(w[i-2],17)^_ror(w[i-2],19)^(w[i-2]>>>10))>>>0;
      w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0;
    }
    a=H[0]; bb=H[1]; c=H[2]; d=H[3]; e=H[4]; f=H[5]; g=H[6]; h=H[7];
    for(i=0;i<64;i++){
      S1=(_ror(e,6)^_ror(e,11)^_ror(e,25))>>>0;
      ch=((e&f)^((~e)&g))>>>0;
      t1=(h+S1+ch+_SHA_K[i]+w[i])>>>0;
      S0=(_ror(a,2)^_ror(a,13)^_ror(a,22))>>>0;
      maj=((a&bb)^(a&c)^(bb&c))>>>0;
      t2=(S0+maj)>>>0;
      h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=bb; bb=a; a=(t1+t2)>>>0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+bb)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  var hex='';
  for(i=0;i<8;i++) hex+=('0000000'+(H[i]>>>0).toString(16)).slice(-8);
  return hex;
}
function deriveToken(pw){ return sha256Hex(R_PW_PREFIX+String(pw==null?'':pw)); }
function pwValid(pw){ return String(pw==null?'':pw).length>=4; }
function onRemote401(){
  var had=!!rToken();
  try{ localStorage.removeItem(RTOK); }catch(e){}
  if(isLocalFile()) return;   // 停用的本地副本：不弹密码框，静默保持只读
  promptPassword(had?'401':'setup');
}

function remoteOk(){
  if(typeof fetch!=='function') return false;
  if(typeof location==='undefined'||!location||!location.protocol) return false;   // node 测试环境
  return location.protocol==='http:'||location.protocol==='https:'||location.protocol==='file:';
}
/* 本地副本护栏（2026-10-26 单版本决策）：放弃办公室离线副本，只保留在线版本。
   file:// 打开的旧本地文件 -> 顶部停用横幅 + 只读（GET 允许拉取云端数据，PUT 全禁）。 */
function isLocalFile(){
  return typeof location!=='undefined' && !!location && /^file:/i.test(location.protocol||'');
}
function rToken(){ try{ return localStorage.getItem(RTOK)||''; }catch(e){ return ''; } }
function rHeaders(){ var h={'Accept':'application/json'}; var t=rToken(); if(t) h['X-HRD-Token']=t; return h; }
function remoteGet(){
  if(!remoteOk()) return Promise.resolve(null);
  try{
    return fetch(RURL,{headers:rHeaders(),cache:'no-store'}).then(function(r){
      if(r.status===401){ onRemote401(); return null; }
      return r.ok?r.json():null;
    })['catch'](function(){ return null; });
  }catch(e){ return Promise.resolve(null); }
}
function remotePut(payload){
  if(!remoteOk()) return Promise.resolve(false);
  if(isLocalFile()) return Promise.resolve(false);   // 停用的本地副本：只读，永不上传
  try{
    var h=rHeaders(); h['Content-Type']='application/json';
    return fetch(RURL,{method:'PUT',headers:h,body:JSON.stringify(payload)}).then(function(r){
      if(r.status===401){ onRemote401(); return false; }
      return r.ok;
    })['catch'](function(){ return false; });
  }catch(e){ return Promise.resolve(false); }
}
function snapshotState(){
  var d={}, t={};
  BK_KEYS.forEach(function(k){ d[k]=state.data[k]||[]; t[k]=tombs(k); });
  return {app:'hrd-workbench', ver:1, data:d, tombs:t};
}
/* 规范化序列化：键按字典序输出，嵌套对象同样排序。
   直接 JSON.stringify 依赖键的插入顺序——同一份数据经服务端往返后键序可能变化，
   会被误判成"有变化"，进而引发每轮轮询都刷新+弹提示。 */
function canonRec(v){
  if(v===null||typeof v!=='object') return JSON.stringify(v);
  if(Object.prototype.toString.call(v)==='[object Array]'){
    var a=[]; for(var i=0;i<v.length;i++) a.push(canonRec(v[i]));
    return '['+a.join(',')+']';
  }
  var ks=Object.keys(v).sort(), out=[];
  for(var j=0;j<ks.length;j++) out.push(JSON.stringify(ks[j])+':'+canonRec(v[ks[j]]));
  return '{'+out.join(',')+'}';
}
/* 逐行比较新旧数组，返回"真正变了"的条数（新增 + 修改 + 消失）。
   用途：toast 只报真实变更，且 changed=0 时不弹提示、不重渲染。 */
function diffRows(oldRows, newRows){
  var map={}, seen={}, i, n=0;
  for(i=0;i<oldRows.length;i++){ var o=oldRows[i]; if(o&&o._id!=null) map[o._id]=o; }
  for(i=0;i<newRows.length;i++){
    var r=newRows[i]; if(!r) continue;
    if(r._id==null){ n++; continue; }
    seen[r._id]=1;
    if(!map[r._id]||canonRec(map[r._id])!==canonRec(r)) n++;
  }
  for(i=0;i<oldRows.length;i++){
    var g=oldRows[i];
    if(g&&g._id!=null&&!seen[g._id]) n++;          // 服务端已移除
  }
  return n;
}
/* 与服务器数据覆盖本地（含墓碑）。_remoteBusy 期间 saveData 不触发回传，避免回声。
   返回**真实变更条数**（不是总条数）：没变就是 0，调用方据此决定是否提示。 */
function applyRemote(d){
  if(!d||typeof d!=='object'||!d.data) return 0;
  _remoteBusy=true;
  var changed=0;
  BK_KEYS.forEach(function(k){
    var rows=d.data[k];
    /* 服务端没返回这个模块（旧版后端 _HRD_KEYS 少一个键）：保留本地，别清空 */
    if(!Array.isArray(rows)) return;
    changed+=diffRows(state.data[k]||[], rows);
    state.data[k]=rows;
    saveData(k,rows);
    var tm=d.tombs&&d.tombs[k];
    if(tm&&typeof tm==='object'){ try{ saveTombs(k,tm); }catch(e){} }
  });
  _remoteBusy=false;
  return changed;
}
function queueRemotePut(){
  if(!remoteOk()||_remoteBusy||isLocalFile()) return;
  if(_putTimer) clearTimeout(_putTimer);
  _putTimer=setTimeout(function(){
    _putTimer=null;
    remotePut(snapshotState()).then(function(ok){
      try{
        if(ok){ localStorage.setItem(RLAST, new Date().toISOString()); flushImgDel(); }
      }catch(e){}
      renderTopbar();
    });
  },600);
}
/* 模块首次纳入同步时的保护：服务端该模块"一条都没有 + 无墓碑"，而本机有数据，
   说明云端从未收到过这个模块（例如 prompts 因后端漏配键而一直没上传成功）。
   这种情况以本机为准上送，否则 applyRemote 会把本机数据清空。
   返回 {payload, keys} 或 null。 */
function firstSyncPayload(d){
  var keys=[], data={}, tmb={};
  BK_KEYS.forEach(function(k){
    var srv=(d.data&&d.data[k])||null;
    var tmS=d.tombs&&d.tombs[k];
    var local=state.data[k]||[];
    var srvEmpty=Array.isArray(srv)&&srv.length===0;
    var noTomb=!(tmS&&typeof tmS==='object'&&Object.keys(tmS).length);
    if(srvEmpty&&noTomb&&local.length){
      keys.push(k); data[k]=local; tmb[k]=tombs(k)||{};
    }else{
      data[k]=Array.isArray(srv)?srv:local;
      tmb[k]=(tmS&&typeof tmS==='object')?tmS:(tombs(k)||{});
    }
  });
  if(!keys.length) return null;
  return {payload:{app:'hrd-workbench',ver:1,data:data,tombs:tmb}, keys:keys};
}
/* 防丢护栏（2026-11-04）：本机新增（manual）但从未上传成功的记录，在服务端快照覆盖前找回。
   场景：新增时 PUT 静默失败（断网/代理拦截，RLAST 停在上次成功时间），下次 boot GET
   或 45s 轮询以服务器为准整量覆盖，本地独有记录被静默抹掉（当日「个人税务优化」
   提示词丢失事故）。规则：本地 manual 记录，服务端无同 _id / 同 _fp，且服务端墓碑
   不含其 _fp → 视为本地独有，并入远端快照先应用再 PUT 回传。
   种子（_src!=='manual'）与命中墓碑的一律不找回（跨设备删除语义保持一致）。 */
function localOnlyPayload(d){
  var keys=[], merged=null, n=0;
  BK_KEYS.forEach(function(k){
    var srv=(d.data&&d.data[k])||null;
    if(!Array.isArray(srv)) return;                       // 后端缺键：维持原状不合并
    var tmS=d.tombs&&d.tombs[k];
    var ids={}, fps={};
    srv.forEach(function(r){ if(r&&r._id!=null) ids[r._id]=1; if(r&&r._fp) fps[r._fp]=1; });
    var extra=(state.data[k]||[]).filter(function(r){
      if(!r||r._deleted) return false;
      if(r._src!=='manual') return false;                 // 种子/自动记录以服务端为准
      if(r._id!=null&&ids[r._id]) return false;
      if(r._fp&&fps[r._fp]) return false;
      if(tmS&&typeof tmS==='object'&&r._fp&&tmS[r._fp]) return false;  // 其他设备已删
      return true;
    });
    if(extra.length){
      if(!merged){
        merged={app:'hrd-workbench',ver:1,data:JSON.parse(JSON.stringify(d.data)),
                tombs:d.tombs?JSON.parse(JSON.stringify(d.tombs)):{}};
      }
      merged.data[k]=srv.concat(extra);
      keys.push(k); n+=extra.length;
    }
  });
  if(!n) return null;
  return {payload:merged, keys:keys, n:n};
}
function remoteBoot(){
  if(!remoteOk()) return;
  remoteGet().then(function(d){
    if(!d){ renderTopbar(); return; }                      // 断网或 401（401 已弹框）
    var hasServer=Object.keys(d.data||{}).some(function(k){ return (d.data[k]||[]).length; });
    if(hasServer){
      var up=firstSyncPayload(d);
      if(up){
        /* 先把本机数据补进快照再应用，避免被服务端的空数组覆盖 */
        var n0=applyRemote(up.payload);
        renderTopbar();
        remotePut(up.payload).then(function(ok){
          try{ if(ok) localStorage.setItem(RLAST, new Date().toISOString()); }catch(e){}
          renderTopbar();
          if(ok) toast('已将本机「'+up.keys.join('/')+'」上传为初始版本');
        });
        refreshAll();
        return;
      }
      /* 防丢护栏：覆盖前先合并本机独有（未上传成功）的 manual 记录 */
      var lo=localOnlyPayload(d);
      if(lo){
        applyRemote(lo.payload);
        renderTopbar();
        remotePut(lo.payload).then(function(ok){
          try{ if(ok) localStorage.setItem(RLAST, new Date().toISOString()); }catch(e){}
          renderTopbar();
          if(ok) toast('已找回本机新增的 '+lo.n+' 条记录并上传（'+lo.keys.join('/')+'）');
        });
        refreshAll();
        return;
      }
      var n=applyRemote(d);
      renderTopbar();
      if(n>0) toast('已从服务器同步 '+n+' 条变更');   // 无差异就不提示
      refreshAll();
    }else{
      var localHas=BK_KEYS.some(function(k){ return (state.data[k]||[]).length; });
      if(localHas && !isLocalFile()){   // 停用的本地副本：服务器为空也不上传陈旧数据
        /* 首次：服务器为空 -> 以本机（PC）数据为准上传 */
        remotePut(snapshotState()).then(function(ok){
          try{ if(ok) localStorage.setItem(RLAST, new Date().toISOString()); }catch(e){}
          renderTopbar();
          if(ok) toast('已将本机数据上传为初始版本（以本机为准）');
        });
      }else{
        renderTopbar();
      }
    }
  });
}
function remoteSuffix(){
  if(isLocalFile()) return ' · 本地副本已停用';
  if(!remoteOk()) return '';
  if(!rToken()) return ' · 云端未连接';
  var last=''; try{ last=localStorage.getItem(RLAST)||''; }catch(e){}
  if(last){
    var d=new Date(last);
    return ' · 云端同步 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  }
  return ' · 云端未同步';
}
/* 停用横幅：仅 file:// 打开时显示（在线版恒隐藏）。返回是否启用，便于测试断言。 */
function initLocalGuard(){
  if(!isLocalFile()) return false;
  var g=$('#localGuard'); if(g) g.hidden=false;
  return true;
}
/* ---- 轮询同步（2026-10-27）----
   修复：此前只在「启动 GET 一次 + 本地改动 PUT」，页面开着不刷新就永远看不到
   其他设备的新数据。现在在线版每 45s 拉一次；无变化不动（sameSnapshot 防回声），
   有变化才以服务器为准覆盖并刷新；页面切回可见时立即拉一次。 */
var _pollTimer=null;
function sameSnapshot(d){
  if(!d||typeof d!=='object'||!d.data) return false;
  for(var i=0;i<BK_KEYS.length;i++){
    var k=BK_KEYS[i], a=state.data[k]||[], b=d.data[k];
    /* 服务端没返回这个模块（后端 _HRD_KEYS 缺该键）：无从比较，跳过。
       2026-10-30 事故根因就在这里——旧代码遇到 undefined 直接 return false，
       prompts 后端不支持时每轮轮询都判为"有变化"，于是 45s 一次覆盖+提示+重渲染。 */
    if(!Array.isArray(b)) continue;
    if(a.length!==b.length) return false;
    for(var j=0;j<a.length;j++){
      if(canonRec(a[j])!==canonRec(b[j])) return false;
    }
    /* 墓碑同理：服务端未提供该模块的墓碑时不比较，否则本地有墓碑就会永远不等 */
    var tb=d.tombs&&d.tombs[k];
    if(!tb||typeof tb!=='object') continue;
    var ta=tombs(k), fp;
    var na=ta?Object.keys(ta).length:0;
    var nb=Object.keys(tb).length;
    if(na!==nb) return false;
    for(fp in tb){ if(!ta||ta[fp]!==tb[fp]) return false; }
  }
  return true;
}
function _modalOpen(){ var m=$('#mask'); return !!(m&&m.classList&&m.classList.contains('show')); }
function syncPoll(){
  if(!remoteOk()||isLocalFile()||_remoteBusy) return Promise.resolve(null);
  if(_modalOpen()) return Promise.resolve(null);      // 编辑中不应用，避免冲掉未保存输入
  return remoteGet().then(function(d){
    if(!d) return null;
    /* 防丢护栏：轮询覆盖前先合并本机独有（未上传成功）的 manual 记录，应用后回传 */
    var lo=localOnlyPayload(d);
    if(lo){
      var n0=applyRemote(lo.payload);
      renderTopbar();
      remotePut(lo.payload).then(function(ok){
        try{ if(ok) localStorage.setItem(RLAST, new Date().toISOString()); }catch(e){}
        renderTopbar();
        if(ok) toast('已找回本机新增的 '+lo.n+' 条记录并上传（'+lo.keys.join('/')+'）');
      });
      if(n0>0) refreshAll();
      return {applied:true, changed:n0};
    }
    if(sameSnapshot(d)){ renderTopbar(); return {applied:false, changed:0}; }
    var n=applyRemote(d);
    renderTopbar();
    /* 只有真发生变更才提示 + 重渲染；纯粹键序/空差异不打扰用户 */
    if(n>0){ toast('已从其他设备同步 '+n+' 条变更'); refreshAll(); }
    return {applied:true, changed:n};
  });
}
function startSyncPoll(){
  if(!remoteOk()||isLocalFile()) return;
  if(_pollTimer) return;
  _pollTimer=setInterval(syncPoll, 45000);
}
function stopSyncPoll(){ if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; } }
function promptPassword(reason){
  /* 防重入：密码框已在显示则不重复弹（closeModal 清空 innerHTML，任何关闭途径自然重置） */
  var box=$('#modalBox');
  if(box && typeof box.innerHTML==='string' && box.innerHTML.indexOf('id="tSave"')>-1) return;
  var retry=reason==='401', change=reason==='change';
  var note = retry
    ? '<p style="font-size:13px;color:#c0392b;line-height:1.7;margin:0 0 10px">密码不正确或已被更换，请重新输入。</p>'
    : (change ? '<p style="font-size:13px;color:var(--tx1);line-height:1.7;margin:0 0 10px">输入新的同步密码；其他设备下次同步时会提示重新登录。</p>' : '');
  var h='<div class="modal-h"><h3>云端同步密码</h3><button class="icon-btn" id="tClose">✕</button></div>'
    +'<div class="modal-b">'+note
    +'<p style="font-size:13px;color:var(--tx2);line-height:1.7;margin:0 0 10px">'
    +'设置一次同步密码即可：之后所有设备（电脑 / 手机 / 线上）输入同一密码自动加入同步，无需任何令牌。<br>'
    +'密码只保存在本机浏览器，服务端仅存派生的校验值。</p>'
    +'<div style="position:relative">'
    +'<input id="tInput" type="password" placeholder="同步密码（至少 4 位）" autocomplete="new-password" '
    +'style="width:100%;padding:10px 44px 10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;box-sizing:border-box">'
    +'<button type="button" id="tEye" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--tx2);font-size:12px;cursor:pointer;padding:8px">显示</button>'
    +'</div></div>'
    +'<div class="modal-f"><button class="btn" id="tCancel">暂不</button><button class="btn btn-pri" id="tSave">保存并同步</button></div>';
  $('#modalBox').innerHTML=h; $('#mask').classList.add('show');
  $('#tClose').addEventListener('click',closeModal);
  $('#tCancel').addEventListener('click',closeModal);
  var eye=$('#tEye');
  if(eye) eye.addEventListener('click',function(){
    var ti=$('#tInput'); if(!ti) return;
    var show=ti.type==='password';
    ti.type=show?'text':'password';
    eye.textContent=show?'隐藏':'显示';
  });
  $('#tSave').addEventListener('click',function(){
    var v=($('#tInput').value||'').trim();
    if(!pwValid(v)){ toast('密码至少 4 位',1); return; }
    try{ localStorage.setItem(RTOK,deriveToken(v)); }catch(e){}
    closeModal();
    toast('密码已保存，正在同步…');
    remoteBoot();
  });
  var ti=$('#tInput');
  if(ti&&ti.focus) ti.focus();
  if(ti&&ti.addEventListener) ti.addEventListener('keydown',function(ev){
    if(ev&&ev.key==='Enter'){ var b=$('#tSave'); if(b&&b.click) b.click(); }
  });
}

/* ---- B5 截止提醒与到期视图 ---- */
function computeOverdue(){
  var t=todayStr();
  return (state.data.tasks||[]).filter(function(r){
    return !r._deleted && r['状态']!=='已完成' && r['截止'] && String(r['截止']).slice(0,10)<t;
  }).sort(function(a,b){ return String(a['截止']).localeCompare(String(b['截止'])); });
}
function computeDueToday(){
  var t=todayStr();
  return (state.data.tasks||[]).filter(function(r){
    return !r._deleted && r['状态']!=='已完成' && String(r['截止']||'').slice(0,10)===t;
  });
}
function bellPanelHtml(){
  var od=computeOverdue(), td=computeDueToday();
  var h='<div class="bp-h"><span>到期提醒</span><span class="sub">逾期 '+od.length+' · 今日 '+td.length+'</span></div>';
  if(!od.length&&!td.length){ h+='<div class="bell-empty">暂无逾期与今日到期任务</div>'; }
  function item(r, cls, label){
    return '<div class="bell-item"><span class="tag '+cls+'">'+label+'</span>'
      +'<span class="tt" data-bell-goto="1" title="'+esc(r['标题'])+'">'+esc(r['标题'])+'</span>'
      +'<span class="dt">'+fmtDate(r['截止'])+'</span>'
      +'<button class="btn btn-sm btn-pri" data-bell-done="'+r._id+'">完成</button></div>';
  }
  od.forEach(function(r){ h+=item(r,'tag-red','逾期'); });

function icsEscape(s){ return String(s==null?'':s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function buildIcs(list){

/* ---- B1 撤销删除（删除栈，Ctrl/Cmd+Z）---- */
var undoStack=[];
function pushUndo(key, rec){
  undoStack.push({key:key, rec:rec});
  if(undoStack.length>20) undoStack.shift();
}
function undoDelete(){
  var u=undoStack.pop();
  if(!u){ toast('没有可撤销的删除'); return false; }
  var r=u.rec;
  delete r._deleted;
  try{ var t=tombs(u.key); delete t[r._fp]; saveTombs(u.key,t); }catch(e){}
  saveData(u.key, state.data[u.key]);
  toast('已撤销删除');
  refreshAll();
  return true;
}
/* B1 键盘导航辅助（计算层，纯函数可测） */
function currentModule(){ return MODULES.filter(function(x){return x.key===state.page;})[0]; }
function focusableRows(){
  var m=currentModule();
  if(!m||m.key==='overview'||m.special||m.key==='stats') return {m:null, rows:[]};
  var rows=(state.data[m.key]||[]).filter(matchSearch).filter(function(r){return !r._deleted;});
  rows=filterRows(m, rows);
  if(m.key==='tasks'&&state.repOnly) rows=rows.filter(function(r){ return r['重复']&&r['重复']!=='不重复'; });
  return {m:m, rows:sortRows(m.key, rows)};
}
function moveFocus(delta){
  var fr=focusableRows();
  if(!fr.m||!fr.rows.length){ toast('当前页面没有可导航的列表'); return false; }
  var i=state.focusIndex+delta;
  if(i<0) i=0;
  if(i>=fr.rows.length) i=fr.rows.length-1;
  state.focusIndex=i;
  renderContent();
  var row=document.querySelector('tr.row-focus');
  if(row&&row.scrollIntoView) row.scrollIntoView({block:'nearest'});
  return true;
}
function editFocused(){
  var fr=focusableRows();
  if(!fr.m||state.focusIndex<0||state.focusIndex>=fr.rows.length){ toast('先用 J / K 选中一行'); return false; }
  openForm(fr.m, fr.rows[state.focusIndex]);
  return true;
}
function doneFocused(){
  var fr=focusableRows();
  if(!fr.m||state.focusIndex<0||state.focusIndex>=fr.rows.length){ toast('先用 J / K 选中一行'); return false; }
  var r=fr.rows[state.focusIndex];
  if(fr.m.key!=='tasks'){ openForm(fr.m, r); return true; }
  var nxt;
  if(r['状态']==='已完成'){ markDone(r,false); toast('已撤销完成'); }
  else{ nxt=markDone(r,true); toast('已完成'+(nxt?'，并生成下期重复任务':'')); }
  saveData(fr.m.key, state.data[fr.m.key]);
  refreshAll();
  return true;
}

/* B1 快捷键：N 新建 / / 搜索 / Esc 关闭 / J K 移动 / E 编辑 / D 完成 / Ctrl+Z 撤销删除 */
document.addEventListener('keydown',function(e){
  var tag=String(e.target&&e.target.tagName||'').toLowerCase();
  var typing=tag==='input'||tag==='textarea'||tag==='select';
  var mask=$('#mask');
  var modalOpen=mask&&mask.classList&&mask.classList.contains('show');
  if(e.key==='Escape'){
    if(modalOpen) closeModal();
    var bp=$('#bellPop'); if(bp) bp.classList.remove('show');
    if(state.filterOpen){ state.filterOpen=false; renderContent(); }
    return;
  }
  if(typing||modalOpen) return;
  var k=String(e.key||'').toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); undoDelete(); return; }
  if(k==='n'){ e.preventDefault(); quickCreate(state.page==='overview'?'tasks':state.page); }
  else if(e.key==='/'){ e.preventDefault(); var si=$('#searchInput'); if(si&&si.focus) si.focus(); else toast('当前页面没有搜索框'); }
  else if(k==='j'){ e.preventDefault(); moveFocus(1); }
  else if(k==='k'){ e.preventDefault(); moveFocus(-1); }
  else if(k==='e'){ e.preventDefault(); editFocused(); }
  else if(k==='d'){ e.preventDefault(); doneFocused(); }
});

/* === HR工作视图 · PC 页面层 ===

   依赖 IIFE 内：state / saveData / refreshAll / renderContent / esc / toast /
                openForm / closeModal / mdRender / markDone / markDeleted / MODULES / nowIso
   依赖全局：HRV（共用核心层）。 */
var HRV_PRESET_NODE = '';
/* auto=true：由默认展开策略托管；用户手动折叠任一节点/分组后置 false，完全尊重用户选择 */
var hrvState = {kw:'', only:false, open:{}, nodeOpen:{}, ai:[], aiBusy:false, aiMsg:'',
                _init:false, auto:true};

/* 默认展开：首次进入页面时展开全部 11 个分组与 47 个可挂节点。
   搜索 / 「只显示有内容」状态下自动模式仅展开有内容的节点，避免空块刷屏与无谓渲染。 */
function hrvInitExpand(){
  if(hrvState._init) return;
  hrvState._init=true;
  HRV.groups.forEach(function(g){ hrvState.open[g.id]=true; });
  HRV.attachable.forEach(function(n){ hrvState.nodeOpen[n.id]=true; });
}
function hrvNodeIsOpen(nd,st){
  if(hrvState.auto && (hrvState.kw || hrvState.only)) return st.total>0;
  return !!hrvState.nodeOpen[nd.id];
}
/* 一键切到「仅展开有内容」：分组仍全部展开，空节点收起，骨架标题依旧可见 */
function hrvExpandOnlyData(){
  hrvState.auto=false;
  var A=HRV.activeRows(state.data.tasks,state.data.notes),T=A.tasks,N=A.notes;
  HRV.groups.forEach(function(g){
    hrvState.open[g.id]=true;
    g.nodes.forEach(function(n){ hrvState.nodeOpen[n.id]=hrvNodeStats(n,T,N).total>0; });
  });
}
/* 用户首次手动折叠前，把「自动模式」下实际显示的展开态固化到 nodeOpen，避免取反错乱 */
function hrvSyncAutoToManual(){
  if(!hrvState.auto) return;
  var A=HRV.activeRows(state.data.tasks,state.data.notes),T=A.tasks,N=A.notes,snap={};
  HRV.attachable.forEach(function(n){
    var st=hrvNodeStats(n,T,N);
    snap[n.id]=(hrvState.kw||hrvState.only)?(st.total>0):!!hrvState.nodeOpen[n.id];
  });
  hrvState.nodeOpen=snap;
  hrvState.auto=false;
}

function hrvMod(k){ return MODULES.filter(function(x){ return x.key===k; })[0]; }
function hrvFind(k,id){
  var rows=state.data[k]||[];
  for(var i=0;i<rows.length;i++) if(rows[i]&&rows[i]._id===id) return rows[i];
  return null;
}
function hrvSave(k){ saveData(k, state.data[k]||[]); refreshAll(); }
function hrvStamp(r){ if(r) r._mtime=nowIso(); }

/* 单节点统计：徽标数与展开列表严格同源，保证验收标准 3 */
function hrvNodeStats(nd, T, N){
  var rs=HRV.rowsOf(T,N,nd.id), ts=rs.tasks.filter(HRV.isActive), ns=rs.notes.filter(HRV.isActive), kw=hrvState.kw;
  if(kw){
    ts=ts.filter(function(r){ return HRV.matchKeyword(r,kw); });
    ns=ns.filter(function(r){ return HRV.matchKeyword(r,kw); });
  }
  var open=0; ts.forEach(function(r){ if(!HRV.isDone(r)) open++; });
  return {tasks:ts, notes:ns, open:open, notesN:ns.length, total:open+ns.length};
}
function hrvVisibleNodes(g,T,N){
  var kw=String(hrvState.kw||'').toLowerCase();
  return g.nodes.filter(function(nd){
    var s=hrvNodeStats(nd,T,N);
    if(hrvState.only && s.total===0) return false;
    if(kw && s.total===0 && nd.id.toLowerCase().indexOf(kw)<0) return false;
    return true;
  });
}

  h+='<div class="hrv-stat">'
    +'<span class="hrv-chip todo">待办 <b>'+liveT+'</b></span>'
    +'<span class="hrv-chip note">笔记 <b>'+liveN+'</b></span>'
    +'<span class="hrv-chip quiet">总量校验 <b>'+((t.tasks.ok&&t.notes.ok)?'PASS':'FAIL')+'</b></span>'
    +'</div>';
  h+='<div class="hrv-tools">'
    +'<input type="text" id="hrvKw" placeholder="搜索节点 / 待办 / 笔记…" value="'+esc(hrvState.kw)+'">'
    +'<label><input type="checkbox" id="hrvOnly"'+(hrvState.only?' checked':'')+'>只看有内容</label>'
    +'<button class="hrv-btn" data-act="hrv-expand">展开</button>'
    +'<button class="hrv-btn" data-act="hrv-expand-data">仅有内容</button>'
    +'<button class="hrv-btn" data-act="hrv-collapse">收起</button>'
    +'<button class="hrv-btn pri" data-act="hrv-ai"'+(hrvState.aiBusy?' disabled':'')+'>'
      +(hrvState.aiBusy?'分析中…':'AI 归类')+'</button>'
    +(hrvState.ai.length?'<button class="hrv-btn" data-act="hrv-ai-clear">清除建议</button>':'')
    +'</div>';
  if(hrvState.aiMsg||hrvState.ai.length) h+=hrvAiHtml();
  HRV.sections.forEach(function(s){
    h+='<div class="hrv-branch">'+esc(s.title)+'</div>';
    h+='<div class="hrv-grid">';
    s.groups.forEach(function(g){ h+=hrvGroupHtml(g,T,N); });
    h+='</div>';
  });
  h+='<div class="hrv-note" title="'+esc((typeof MHR_NODES!=='undefined'&&MHR_NODES.source_file)||'MHR 2026 版总索引')+'">'
    +'与「待办 / 笔记」同一份数据 · 源：MHR 2026 版总索引</div>';
  return h+'</div>';
}

/* ---------- 事件：全局委托，只绑定一次，避免 refreshAll 重建 DOM 后失效 ---------- */
function hrvAiApply(i){
  var x=hrvState.ai[i]; if(!x) return;
  var r=null, rows=state.data.tasks||[];
  for(var j=0;j<rows.length;j++){
    var c=rows[j];
    if(HRV.isActive(c)&&HRV.isUnassigned(c)&&HRV.normTitle(c['标题'])===HRV.normTitle(x.title)){ r=c; break; }
  }
  if(!r){ toast('未找到对应的未归类待办（可能已被修改）',1); return; }
  if(!window.confirm('把待办「'+r['标题']+'」归入\n'+x.node_id+'\n（置信度 '+Math.round(x.confidence*100)+'%）？')) return;
  r._pnode_hist=r._pnode_hist||[];
  r._pnode_hist.push({at:new Date().toISOString(),from:'',to:x.node_id,by:'ai-suggest-confirmed'});
  r.process_node_id=x.node_id; r.process_path=HRV.pathOf(x.node_id);
  hrvStamp(r); hrvSave('tasks'); toast('已归类到 '+x.node_id);
  hrvState.ai.splice(i,1); renderContent();
}
function hrvRunAi(){
  if(hrvState.aiBusy) return;
  var items=(state.data.tasks||[]).filter(function(r){ return HRV.isActive(r)&&HRV.isUnassigned(r); })
    .map(function(r){ return {'标题':r['标题']||''}; }).slice(0,20);
  if(!items.length){ hrvState.aiMsg='没有未归类待办，无需建议。'; renderContent(); return; }
  hrvState.aiBusy=true; hrvState.aiMsg=''; renderContent();
  HRV.suggest(items,function(err,list){
    hrvState.aiBusy=false;
    if(err){ hrvState.aiMsg='AI 建议失败：'+err.message; renderContent(); return; }
    hrvState.ai=list||[];
    hrvState.aiMsg=list&&list.length?('已返回 '+list.length+' 条建议，请逐条确认后才会写入。'):'模型未返回可用建议。';
    renderContent();
  });
}
function hrvOpenForm(key,row,preset){
  HRV_PRESET_NODE=preset||'';
  try{ openForm(hrvMod(key), row); } finally { HRV_PRESET_NODE=''; }
}
function bindHrView(){
  if(bindHrView._bound) return;
  bindHrView._bound=true;
  document.addEventListener('click',function(e){
    var t=e&&e.target; if(!t||!t.closest) return;
    var el=t.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act')||'';
    if(act.indexOf('hrv-')!==0) return;
    var g=el.getAttribute('data-g'), nid=el.getAttribute('data-n'), id=el.getAttribute('data-id');
    if(act==='hrv-g-toggle'){ hrvSyncAutoToManual(); hrvState.open[g]=!hrvState.open[g]; renderContent(); }
    else if(act==='hrv-n-toggle'){ hrvSyncAutoToManual(); hrvState.nodeOpen[nid]=!hrvState.nodeOpen[nid]; renderContent(); }
    else if(act==='hrv-expand'||act==='hrv-collapse'){
      var on=act==='hrv-expand';
      hrvState.auto=on;
      HRV.groups.forEach(function(x){
        hrvState.open[x.id]=on;
        x.nodes.forEach(function(n){ hrvState.nodeOpen[n.id]=on; });
      });
      renderContent();
    }
    else if(act==='hrv-expand-data'){ hrvExpandOnlyData(); renderContent(); }
    else if(act==='hrv-t-add'||act==='hrv-n-add'){
      hrvOpenForm(act==='hrv-t-add'?'tasks':'notes',null,nid);
    }
    else if(act==='hrv-t-edit'){ var r=hrvFind('tasks',id); if(r) hrvOpenForm('tasks',r,''); }
    else if(act==='hrv-n-edit'){ var n=hrvFind('notes',id); if(n) hrvOpenForm('notes',n,''); }
    else if(act==='hrv-n2t'){
      var src=hrvFind('notes',id);
      if(src&&typeof prefillTaskFromNote==='function'){
        HRV_PRESET_NODE=nid||'';
        try{ openForm(hrvMod('tasks'), prefillTaskFromNote(src), true); }
        finally{ HRV_PRESET_NODE=''; }
      }
    }
    else if(act==='hrv-t-del'){
      var td=hrvFind('tasks',id);
      if(td&&window.confirm('确认删除待办「'+(td['标题']||'')+'」？')){
        markDeleted('tasks',td); hrvSave('tasks'); toast('已删除');
      }
    }
    else if(act==='hrv-n-del'){
      var nd=hrvFind('notes',id);
      if(nd&&window.confirm('确认删除笔记「'+(nd['标题']||'')+'」？')){
        markDeleted('notes',nd); hrvSave('notes'); toast('已删除');
      }
    }
    else if(act==='hrv-ai'){ hrvRunAi(); }
    else if(act==='hrv-ai-clear'){ hrvState.ai=[]; hrvState.aiMsg=''; renderContent(); }
    else if(act==='hrv-ai-apply'){ hrvAiApply(Number(el.getAttribute('data-i'))); }
    else if(act==='hrv-filter'){ /* 保留：由 select 的 change 处理 */ }
  });
  document.addEventListener('change',function(e){
    var t=e&&e.target; if(!t) return;
    if(t.id==='hrvOnly'){ hrvState.only=!!t.checked; renderContent(); return; }
    if(t.getAttribute&&t.getAttribute('data-act')==='hrv-t-done'){
      var r=hrvFind('tasks',t.getAttribute('data-id'));
      if(r){ markDone(r,!!t.checked); hrvSave('tasks'); }
      return;
    }
    if(t.id==='hrvFilter'){ state.hrvFilter=t.value; renderContent(); }
  });
  document.addEventListener('input',function(e){
    if(e.target&&e.target.id==='hrvKw'){
      hrvState.kw=e.target.value||''; renderContent();
      var el=document.getElementById('hrvKw');
      if(el){ el.focus(); try{ el.setSelectionRange(el.value.length,el.value.length); }catch(_){} }
    }
  });
}

/* ---------- 系统待办页 / 笔记页融合入口 ---------- */
function hrvInlineFilterHtml(cur){
  cur=cur||'';
  var h='<span class="hrv-inline-filter">MHR 节点 '
    +'<select id="hrvFilter" title="按 MHR 节点筛选"><option value="">全部</option>'
    +'<option value="__unassigned"'+(cur==='__unassigned'?' selected':'')+'>未归类</option>';
  HRV.groups.forEach(function(g){
    if(g.virtual) return;
    h+='<optgroup label="'+HRV.esc(g.title)+'">';
    g.nodes.forEach(function(n){
      h+='<option value="'+HRV.esc(n.id)+'"'+(cur===n.id?' selected':'')+'>'+HRV.esc(n.id)+'</option>';
    });
    h+='</optgroup>';
  });
  return h+'</select></span>';
}
function hrvApplyModuleFilter(rows,key){
  if(key!=='tasks'&&key!=='notes') return rows;
  var f=state.hrvFilter;
  if(!f) return rows;
  if(f==='__unassigned') return rows.filter(function(r){ return HRV.isUnassigned(r); });
  return rows.filter(function(r){ return HRV.nodeId(r)===f; });
}

/* === 工作台 UI 增强层 · 共用核心（P1/P2）=================================
   注入位置：两端主 IIFE 的 APP 块内（与 hrview_pc.js / hrview_mobile.js 同作用域）。
   职责：纯 UI 增强——空态 CTA、同步状态语义、失败重试、sticky 表头的 DOM 标记、
        上下文常显条、语义标题与 aria-live、平板多栏的运行时标记、高频入口重排。
   铁律：不读写 state.data、不改 cols/fields、不新增业务能力、不覆盖业务数据。
   所有宿主函数通过「保存原引用 + 赋值包装」接入，原逻辑完整保留。
   ==================================================================== */
var UIENH = (function () {
  'use strict';

  function E(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------- 可独立单测的纯函数 ---------- */

  // P1-2：从同步文案判定语义状态（颜色不再单独承载状态）
  function syncState(txt) {
    var t = String(txt || '');
    if (t.indexOf('云端同步') >= 0 || t.indexOf('已同步') >= 0) return 'ok';
    if (t.indexOf('未连接') >= 0 || t.indexOf('失败') >= 0 || t.indexOf('冲突') >= 0) return 'warn';
    if (t.indexOf('本地副本') >= 0 || t.indexOf('本地模式') >= 0 || t.indexOf('未同步') >= 0) return 'off';
    return 'off';
  }

  // P1-2：最后成功同步时间（HH:MM），无记录返回空串
  function lastSync(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // P1-1：空态 CTA。filtered=true 时优先给「清除筛选」，避免用户误以为数据丢了
  function emptyCtaHtml(isMobile, filtered) {
    if (filtered) {
      return '<span class="ui-empty-lead">当前筛选条件下没有匹配的记录，可清除筛选查看全部。</span>'
        + '<div class="ui-empty-acts">'
        + '<button type="button" class="ui-empty-cta ghost" data-uiact="ui-clear-filter">清除筛选</button>'
        + '<button type="button" class="ui-empty-cta" data-uiact="ui-add">'
        + (isMobile ? '+ 仍然新建' : '+ 新建记录') + '</button></div>';
    }
    return '<span class="ui-empty-lead">这里还没有记录，先创建第一条'
      + (isMobile ? '，或点右下角 + 新建。' : '，之后可在此编辑、筛选与导出。') + '</span>'
      + '<div class="ui-empty-acts">'
      + '<button type="button" class="ui-empty-cta" data-uiact="ui-add">+ 新建第一条</button></div>';
  }

  // P1-3：错误面板的重试入口（复用已有 AI 建议函数，不新增加载逻辑）
  function retryHtml(label) {
    return '<button type="button" class="ui-retry" data-uiact="ui-retry-ai">↻ '
      + E(label || '重试') + '</button>';
  }

  // P1-5：上下文常显条内容
  function contextHtml(title, chips) {
    var h = '<span class="ui-ctx-title">' + E(title || '工作台') + '</span>'
          + '<span class="ui-ctx-sep">│</span><span class="ui-ctx-chips">';
    var list = chips || [];
    if (!list.length) h += '<span class="ui-ctx-none">当前无筛选条件</span>';
    else for (var i = 0; i < list.length; i++) h += '<span class="ui-chip">' + E(list[i]) + '</span>';
    return h + '</span><button type="button" class="ui-ctx-top" data-uiact="ui-ctx-top" aria-label="回到顶部">↑ 顶部</button>';
  }

  // P2-3：高频入口面板。recent / actions 均为 [{key,label,sub,icon}]
  function quickHtml(recent, actions) {
    var h = '<div class="ui-quick-cap">最近访问</div>';
    var r = recent || [];
    if (!r.length) h += '<button type="button" class="ui-quick-item" data-uiact="ui-quick-go" data-key="overview">'
                     + '<span class="ui-q-ic">◷</span>工作总览</button>';
    for (var i = 0; i < r.length; i++) {
      h += '<button type="button" class="ui-quick-item" data-uiact="ui-quick-go" data-key="' + E(r[i].key) + '">'
         + '<span class="ui-q-ic">' + E(r[i].icon || '·') + '</span>' + E(r[i].label)
         + (r[i].sub ? '<span class="ui-q-sub">' + E(r[i].sub) + '</span>' : '') + '</button>';
    }
    h += '<div class="ui-quick-sep"></div><div class="ui-quick-cap">快捷新建</div>';
    var a = actions || [];
    for (var j = 0; j < a.length; j++) {
      h += '<button type="button" class="ui-quick-item" data-uiact="ui-quick-add" data-key="' + E(a[j].key) + '">'
         + '<span class="ui-q-ic">＋</span>' + E(a[j].label) + '</button>';
    }
    return h;
  }

  function readRecent(win) {
    try {
      var s = (win.localStorage && win.localStorage.getItem('wb_ui_recent')) || '[]';
      var v = JSON.parse(s);
      return Object.prototype.toString.call(v) === '[object Array]' ? v.slice(0, 4) : [];
    } catch (e) { return []; }
  }

  function pushRecent(win, page, label) {
    if (!page) return readRecent(win);
    var list = readRecent(win).filter(function (x) { return x && x.key !== page; });
    list.unshift({key: page, label: label || page, icon: '◷'});
    list = list.slice(0, 4);
    try { if (win.localStorage) win.localStorage.setItem('wb_ui_recent', JSON.stringify(list)); } catch (e) {}
    return list;
  }

  /* ---------- DOM 增强（全部带守卫，缺 DOM 时静默跳过） ---------- */
  function init(cfg) {
    var d = cfg.doc || (typeof document !== 'undefined' ? document : null);
    var win = cfg.win || (typeof window !== 'undefined' ? window : {});
    if (!d || !d.querySelectorAll) return null;
    var S = {cfg: cfg, doc: d, win: win, ctx: null, quick: null, ctxShown: false};

    function $(sel) { return d.querySelector ? d.querySelector(sel) : null; }
    function all(sel) { try { return d.querySelectorAll(sel) || []; } catch (e) { return []; } }
    function attr(el, k, v) { if (el && el.setAttribute) el.setAttribute(k, v); }

    // P1-5 / P2-1：常显上下文条 + 页面语义标题容器
    function buildChrome() {
      if (!d.body || !d.createElement) return;
      if (!d.getElementById || !d.getElementById('uiContext')) {
        var bar = d.createElement('div');
        bar.id = 'uiContext';
        bar.className = 'ui-context' + (cfg.isMobile ? ' m' : '');
        bar.setAttribute('role', 'navigation');
        bar.setAttribute('aria-label', '当前位置与筛选');
        d.body.appendChild(bar);
        S.ctx = bar;
      } else S.ctx = d.getElementById('uiContext');
      // 手机端顶栏高度不固定，运行时测量，避免硬编码遮挡
      var hd = cfg.header ? $(cfg.header) : null;
      var top = hd && hd.getBoundingClientRect ? Math.round(hd.getBoundingClientRect().bottom) : (cfg.isMobile ? 56 : 62);
      if (S.ctx && S.ctx.style) S.ctx.style.top = top + 'px';

      var host = cfg.quickHost ? cfg.quickHost() : null;
      if (host && host.appendChild && (!d.getElementById || !d.getElementById('uiQuickBtn'))) {
        var wrap = d.createElement('div');
        wrap.className = 'ui-quick';
        wrap.id = 'uiQuickWrap';
        wrap.innerHTML = '<button type="button" class="ui-quick-btn" id="uiQuickBtn" '
          + 'aria-haspopup="true" aria-expanded="false" aria-controls="uiQuickPop">'
          + '<span aria-hidden="true">⚡</span><span>快捷</span></button>'
          + '<div class="ui-quick-pop" id="uiQuickPop" hidden></div>';
        host.appendChild(wrap);
        S.quick = wrap;
      }
    }

    function syncQuick() {
      var pop = d.getElementById ? d.getElementById('uiQuickPop') : null;
      if (!pop) return;
      pop.innerHTML = quickHtml(readRecent(win), cfg.quickActions ? cfg.quickActions() : []);
    }

    // P1-2：同步徽章语义化 + 最后同步时间
    function enhanceSync() {
      var txt = cfg.syncText ? cfg.syncText() : '';
      var st = syncState(txt);
      var badge = $('.sync-badge') || (cfg.isMobile ? $('#syncTxt') : null);
      if (badge) {
        attr(badge, 'data-sync', st);
        attr(badge, 'role', 'status');
        attr(badge, 'aria-live', 'polite');
        attr(badge, 'aria-label', '同步状态：' + txt);
      }
      var label = cfg.isMobile ? $('#syncTxt') : $('#syncTxt');
      if (label) attr(label, 'data-sync', st);
      // 仅在线状态已含时间时不再重复；离线/未连接时补偿「最后同步」信息
      var needLast = (st !== 'ok') && cfg.lastSyncIso;
      var hostEl = badge || label;
      if (hostEl && hostEl.parentNode && needLast) {
        var t = lastSync(cfg.lastSyncIso());
        var old = d.getElementById ? d.getElementById('uiSyncLast') : null;
        if (t && !old && d.createElement) {
          var sp = d.createElement('span');
          sp.id = 'uiSyncLast';
          sp.className = 'sync-last';
          sp.textContent = '最后同步 ' + t;
          hostEl.parentNode.appendChild(sp);
        } else if (old && t) old.textContent = '最后同步 ' + t;
      }
    }

    // P2-1：每页恰好一个 h1；原生表格 th 补 scope；当前导航项补 aria-current
    function enhanceSemantics() {
      var h2 = $('.page-head h2');
      if (h2 && h2.parentNode && h2.parentNode.replaceChild && d.createElement) {
        var h1 = d.createElement('h1');
        h1.textContent = h2.textContent || '';
        if (h2.getAttribute) attr(h1, 'class', h2.getAttribute('class') || '');
        h2.parentNode.replaceChild(h1, h2);
      } else if (d.body && d.createElement) {
        var only = d.getElementById ? d.getElementById('uiPageTitle') : null;
        if (!only) {
          only = d.createElement('h1');
          only.id = 'uiPageTitle';
          only.className = 'ui-sr-only';
          d.body.appendChild(only);
        }
        only.textContent = cfg.getTitle ? cfg.getTitle() : '工作台';
      }
      var toast = d.getElementById ? d.getElementById('toast') : null;
      if (toast) { attr(toast, 'role', 'status'); attr(toast, 'aria-live', 'polite'); }

      var ths = all('th');
      for (var i = 0; i < ths.length; i++) attr(ths[i], 'scope', 'col');
      var navs = all('.sb-item.active, .tab.on');
      for (var j = 0; j < navs.length; j++) attr(navs[j], 'aria-current', 'page');
      // HR 视图的折叠行：可键盘聚焦 + 展开态播报
      var rows = all('.hrv-group-h, .hrv-node-row');
      for (var k = 0; k < rows.length; k++) {
        attr(rows[k], 'role', 'button');
        attr(rows[k], 'tabindex', '0');
        var p = rows[k].parentNode;
        var open = p && p.className && String(p.className).indexOf('open') >= 0;
        attr(rows[k], 'aria-expanded', open ? 'true' : 'false');
      }
      var main = $(cfg.isMobile ? '#view' : '#content');
      if (main) attr(main, 'aria-label', cfg.getTitle ? cfg.getTitle() : '内容区');
    }

    // P1-1：空态主 CTA（只作用于能新增记录的模块页）
    function enhanceEmpty() {
      if (!cfg.canAdd || !cfg.canAdd()) return;
      var list = all('.empty');
      var html = emptyCtaHtml(!!cfg.isMobile, cfg.filtered ? !!cfg.filtered() : false);
      for (var i = 0; i < list.length; i++) {
        var el = list[i];
        if (!el || !el.appendChild || !d.createElement) continue;
        var cur = el.innerHTML || '';
        // 显式标记 + innerHTML 双重幂等：renderContent 重建 DOM 后标记自然消失，会重新注入
        if ((el.getAttribute && el.getAttribute('data-ui-empty') === '1')
            || cur.indexOf('ui-empty-cta') >= 0) continue;
        if (el.setAttribute) el.setAttribute('data-ui-empty', '1');
        var box = d.createElement('div');
        box.className = 'ui-empty-acts-box';
        box.innerHTML = html;
        el.appendChild(box);
      }
    }

    // P1-3：AI 建议失败面板补重试按钮（错误态不再是终点）
    function enhanceErrors() {
      var msgs = all('.hrv-ai-msg');
      for (var i = 0; i < msgs.length; i++) {
        var el = msgs[i];
        if (!el || !el.appendChild) continue;
        var t = el.textContent || '';
        if (t.indexOf('失败') < 0 && t.indexOf('未返回可用建议') < 0) continue;
        if ((el.getAttribute && el.getAttribute('data-ui-retry') === '1')
            || (el.innerHTML || '').indexOf('ui-retry') >= 0) continue;
        if (el.setAttribute) el.setAttribute('data-ui-retry', '1');
        var box = d.createElement('span');
        box.innerHTML = retryHtml('重新获取建议');
        el.appendChild(box);
      }
    }

    // P1-5：滚动超过阈值才显示，不占静态高度；chips 随筛选实时更新
    function updateContext(force) {
      var bar = S.ctx;
      if (!bar) return;
      var y = Number(win.scrollY || win.pageYOffset || 0);
      var show = y > (cfg.ctxThreshold || 140);
      if (show || force) bar.innerHTML = contextHtml(cfg.getTitle ? cfg.getTitle() : '', cfg.getChips ? cfg.getChips() : []);
      if (bar.classList) {
        if (show) bar.classList.add('show'); else bar.classList.remove('show');
      } else if (bar.className !== undefined) {

/* MC-APP-START */
/* 元认知最小版 · PC / 手机版共用核心
   口径：靠自己的任务做「有把握 → 是否按期」校准；靠别人的任务只观察等待、不算分。
   字段一律 _mc_ 前缀，不进 MODULES.fields / cols，存量记录零改动（缺失 = 未参与）。
   依赖宿主 IIFE 内的 state / saveData / refreshAll / todayStr / nowIso。 */
var MC = (function () {
  var PRED = {
    self: [{ v: 'sure', t: '有把握' }, { v: 'unsure', t: '没把握' }],
    other: [{ v: 'week', t: '这周能到' }, { v: 'chase', t: '要催' }, { v: 'unsure', t: '没底' }]
  };
  var REASONS = ['没想到这么复杂', '关键信息没到', '依赖方延误', '自己拖了'];

  function e(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function ds(s) { return String(s == null ? '' : s).slice(0, 10); }
  function rows() { return state.data.tasks || []; }
  function dayDiff(a, b) {
    var x = Date.parse(ds(a) + 'T00:00:00Z'), y = Date.parse(ds(b) + 'T00:00:00Z');
    if (isNaN(x) || isNaN(y)) return null;
    return Math.round((y - x) / 86400000);
  }
  function shiftDay(s, n) {
    var d = new Date(ds(s) + 'T00:00:00Z');
    if (isNaN(d.getTime())) return s;
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function opts(list, cur) {
    var s = '<option value="">选填</option>';
    (list || []).forEach(function (x) {
      s += '<option value="' + x.v + '"' + (cur === x.v ? ' selected' : '') + '>' + x.t + '</option>';
    });
    return s;
  }

  /* 表单：靠谁 + 把握两个点选，第二项随第一项联动；完成后锁定 */
  function fieldHtml(row) {
    var who = (row && row._mc_who) || '';
    var pred = (row && row._mc_pred) || '';
    var locked = !!(row && row._mc_at && row['状态'] === '已完成');
    var dis = locked ? ' disabled' : '';
    /* 两个点选合并占满一整行，避免与「所属流程节点」下拉在两列网格里错位 */
    var h = '<div class="f-row" style="grid-column:1/-1"><label>靠谁完成 · 你的把握'
      + ' <span style="font-weight:400;color:var(--tx3)">（选填）</span></label>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap">'
      + '<select name="__mc_who" onchange="MC.onWho(this)" style="flex:1;min-width:130px"' + dis + '>'
      + '<option value="">选填</option>'
      + '<option value="self"' + (who === 'self' ? ' selected' : '') + '>靠自己完成</option>'
      + '<option value="other"' + (who === 'other' ? ' selected' : '') + '>靠别人完成</option>'
      + '</select>'
      + '<select name="__mc_pred" style="flex:1;min-width:130px"' + dis + '>'
      + opts(PRED[who || 'self'], pred) + '</select>'
      + '</div></div>';
    if (locked) {
      h += '<div style="grid-column:1/-1;font-size:11.5px;color:var(--tx3);padding:2px 0 4px">'
        + '预测已锁定，完成后不可修改</div>';
    }
    return h;
  }
  function onWho(sel) {
    var form = sel && (sel.form || document.getElementById('mForm') || document.getElementById('shForm'));
    var p = form && form.querySelector ? form.querySelector('[name="__mc_pred"]') : null;
    if (!p) return;
    p.innerHTML = opts(PRED[sel.value] || PRED.self, '');
  }

  /* 首次写入并锁定；未选「靠谁」= 未参与，不写任何字段 */
  function writeFields(rec, form) {
    if (!rec || !form || rec._mc_at) return;
    var w = form.querySelector ? form.querySelector('[name="__mc_who"]') : null;
    var p = form.querySelector ? form.querySelector('[name="__mc_pred"]') : null;
    var who = w ? w.value : '', pred = p ? p.value : '';
    if (!who || !pred) return;
    var ok = (PRED[who] || []).some(function (x) { return x.v === pred; });
    if (!ok) return;
    rec._mc_who = who; rec._mc_pred = pred; rec._mc_at = nowIso();
  }

  /* 完成时自动对账：靠自己且有把握 → 按期=hit / 逾期=miss；其余 skip，不算分 */
  function settle(rec) {
    if (!rec || !rec._mc_at) return;
    var due = ds(rec['截止']), fin = ds(rec['完成日']);
    if (rec._mc_who === 'self') {
      if (!due || !fin || rec._mc_pred !== 'sure') { rec._mc_result = 'skip'; return; }
      rec._mc_result = (fin <= due) ? 'hit' : 'miss';
    } else {
      rec._mc_result = 'skip';
      rec._mc_late = (due && fin && fin > due) ? 1 : 0;
      rec._mc_wait = (due && fin) ? Math.max(0, dayDiff(due, fin) || 0) : null;
    }
  }

  function reviewedToday() {
    var t = todayStr();
    return rows().filter(function (r) { return ds(r._mc_reviewed_at) === t; }).length;
  }
  function needsReview(rec) {
    if (!rec || !rec._mc_at || rec._mc_reviewed_at) return false;
    if (reviewedToday() >= 1) return false;
    if (rec._mc_who === 'self') return rec._mc_result === 'miss';
    return rec._mc_late === 1;
  }

  /* 一句话复盘：每天最多 1 条；自绘轻量浮层，不改动现有 modal / sheet */
  function maybeReview(rec) {
    if (!needsReview(rec) || typeof document === 'undefined' || !document.body) return;
    if (document.getElementById('mcReview')) return;
    var box = document.createElement('div');
    box.id = 'mcReview';
    box.setAttribute('style', 'position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px');
    box.innerHTML = '<div style="width:100%;max-width:380px;background:#fff;border-radius:12px;padding:18px 18px 14px;box-shadow:0 8px 24px rgba(16,24,40,.18)">'
      + '<div style="font-size:15px;font-weight:500;margin-bottom:4px">一句话复盘</div>'
      + '<div style="font-size:12px;color:#64707e;margin-bottom:14px">' + e(rec['标题'] || '')
      + ' · ' + (rec._mc_who === 'self' ? '这次判断没中' : '等超时了') + '</div>'
      + '<label style="display:block;font-size:12px;color:#344054;margin-bottom:5px">最可能的原因</label>'
      + '<select id="mcReason" style="width:100%;padding:8px;margin-bottom:12px;border:1px solid #e3e7ee;border-radius:8px;font-size:13px">'
      + REASONS.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select>'
      + '<label style="display:block;font-size:12px;color:#344054;margin-bottom:5px">下次怎么办（一句话）</label>'
      + '<input id="mcAction" maxlength="60" placeholder="例如：提前两天催一次" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid #e3e7ee;border-radius:8px;font-size:13px">'
      + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">'
      + '<button type="button" id="mcSkip" style="padding:7px 14px;border:1px solid #e3e7ee;background:#fff;border-radius:8px;font-size:13px;cursor:pointer">跳过</button>'
      + '<button type="button" id="mcSave" style="padding:7px 14px;border:1px solid #cddcf7;background:#eaf1fd;color:#185FA5;border-radius:8px;font-size:13px;cursor:pointer">保存</button>'
      + '</div></div>';
    document.body.appendChild(box);
    function close() { if (box.parentNode) box.parentNode.removeChild(box); }
    function finish(skip) {
      rec._mc_reviewed_at = nowIso();
      if (!skip) {
        var rs = box.querySelector('#mcReason'), ac = box.querySelector('#mcAction');
        rec._mc_reason = rs ? rs.value : '';
        rec._mc_action = ac ? String(ac.value || '').slice(0, 60) : '';
        rec._mc_action_done = false;
      }
      close();
      saveData('tasks', rows());
      if (typeof refreshAll === 'function') refreshAll();
      try { toast('已记下'); } catch (err) { }
    }
    box.querySelector('#mcSkip').addEventListener('click', function () { finish(true); });
    box.querySelector('#mcSave').addEventListener('click', function () { finish(false); });
  }

  /* 三行周卡：估对率 / 等超时 / 上周改进动作；样本少只描述不下结论 */
  function card() {
    var all = rows().filter(function (r) { return !r._deleted; });
    var t = todayStr(), win = shiftDay(t, -6);
    var week = all.filter(function (r) { return r._mc_at && ds(r['完成日'] || r._mc_at) >= win; });
    var sure = week.filter(function (r) {
      return r._mc_who === 'self' && r._mc_pred === 'sure'
        && (r._mc_result === 'hit' || r._mc_result === 'miss');
    });
    var hit = sure.filter(function (r) { return r._mc_result === 'hit'; }).length;
    var l1 = sure.length ? ('说有把握的 ' + sure.length + ' 条，成了 ' + hit + ' 条')
      : '这周还没有「靠自己 · 有把握」的记录';
    if (sure.length < 5) l1 += ' · 数据少，先不下结论';

    var others = week.filter(function (r) { return r._mc_who === 'other'; });
    var late = others.filter(function (r) { return r._mc_late === 1; }).length;
    var l2 = others.length ? ('等别人的 ' + others.length + ' 条，等超时 ' + late + ' 条')
      : '这周没有依赖别人的记录';
    if (late) {
      var by = {};
      others.filter(function (r) { return r._mc_late === 1; }).forEach(function (r) {
        var c = r['分类'] || '未分类'; by[c] = (by[c] || 0) + 1;
      });
      var top = Object.keys(by).sort(function (a, b) { return by[b] - by[a]; })[0];

    }

    var acts = all.filter(function (r) { return r._mc_action; }).sort(function (a, b) {
      return String(b._mc_reviewed_at || '').localeCompare(String(a._mc_reviewed_at || ''));
    });
    var act = acts[0];
    var l3 = !act ? '还没有写下一句改进'

        : '上次改进：' + e(act._mc_action)
          + ' <button type="button" data-mc-done="' + e(act._id) + '" style="margin-left:8px;padding:2px 8px;border:1px solid #e3e7ee;background:#f7f8fa;border-radius:6px;font-size:12px;cursor:pointer">已做到</button>');

    return '<div class="mc-card" style="border:1px solid #e3e7ee;border-radius:12px;background:#fff;padding:14px 16px;margin:0 0 16px;box-shadow:0 1px 3px rgba(16,24,40,.06)">'
      + '<div style="font-size:13px;font-weight:500;margin-bottom:6px">本周回看 <span style="font-weight:400;color:#64707e">· ' + t + '</span></div>'
      + '<div style="font-size:13px;line-height:1.9;color:#344054">' + l1 + '</div>'
      + '<div style="font-size:13px;line-height:1.9;color:#344054">' + l2 + '</div>'
      + '<div style="font-size:13px;line-height:1.9;color:#344054">' + l3 + '</div>'
      + '</div>';
  }

  /* 周卡「已做到」勾选：全局委托，两端无需各自绑定 */
  if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('click', function (ev) {
      var b = ev.target && ev.target.closest ? ev.target.closest('[data-mc-done]') : null;

  var api = {
    fieldHtml: fieldHtml, onWho: onWho, writeFields: writeFields,

  if (typeof window !== 'undefined') window.MC = api;   // 供表单 onchange 调用
  return api;
})();

/* ---- 与现有页面对接：包装既有函数，不改动源码
