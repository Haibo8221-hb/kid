<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f6fed'/%3E%3Cstop offset='1' stop-color='%237ba3f2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M20 16v32M44 16v32M20 32h24' stroke='%23fff' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --sb-bg:#1c2430; --sb-bg2:#232e3d; --sb-tx:#c7d0dc; --sb-tx-dim:#7d8a9c;
  --sb-active:#2f6fed; --main-bg:#f2f4f8; --card:#ffffff; --line:#e6e9f0;
  --tx:#1f2733; --tx2:#5b6675; --tx3:#9aa5b3;
  --blue:#2f6fed; --blue-d:#1f56c9; --red:#e5484d; --green:#18a058; --amber:#f0a020;
  --radius:12px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--main-bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx)}
svg{display:block}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--sb-bg);color:var(--sb-tx);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .28s ease}
.sb-logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2f6fed,#5b8def);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sb-logo .t1{color:#fff;font-size:15px;font-weight:600;letter-spacing:.3px}
.sb-logo .t2{font-size:11px;color:var(--sb-tx-dim);margin-top:1px}
.sb-group{padding:14px 12px 4px;font-size:11px;color:var(--sb-tx-dim);letter-spacing:1px}
.sb-nav{flex:1;overflow-y:auto;padding-bottom:16px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 14px 10px 18px;color:var(--sb-tx);font-size:13.5px;text-align:left;border-left:3px solid transparent;transition:background .15s,color .15s}
.sb-item svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.sb-item:hover{background:var(--sb-bg2);color:#fff}
.sb-item.active{background:var(--sb-bg2);color:#fff;border-left-color:var(--sb-active)}
.sb-item .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);border-radius:9px;padding:1px 7px;color:#cfd8e3}
.sb-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:var(--sb-tx-dim)}
.main{flex:1;margin-left:232px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-title{font-size:16px;font-weight:600}
.tb-crumb{color:var(--tx3);font-size:12.5px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.sync-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);background:#f0f3f8;border:1px solid var(--line);border-radius:20px;padding:5px 12px}
.sync-btn{border:none;background:transparent;color:#2f6fed;font-size:12px;font-weight:600;cursor:pointer;padding:0 2px;line-height:1;font-family:inherit}
.sync-btn:hover{text-decoration:underline}
.sync-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2f6fed,#7ba3f2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;cursor:pointer;overflow:hidden;border:2px solid #fff;box-shadow:var(--shadow);position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .edit{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.avatar:hover .edit{opacity:1}
.hamb{display:none;width:42px;height:42px;align-items:center;justify-content:center;border-radius:8px}
.hamb:hover{background:#eef1f6}
.content{padding:22px 24px 60px;max-width:1180px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:19px;font-weight:600}
.page-head .sub{color:var(--tx3);font-size:12.5px;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:8px 15px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--tx);transition:all .15s;min-height:36px}
.btn:hover{border-color:#cdd5e0;background:#f7f9fc}
.btn-pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-pri:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-danger{color:var(--red);border-color:#f3c2c4}
.btn-sm{padding:5px 11px;font-size:12.5px;min-height:30px}
.btn svg{width:14px;height:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:18px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.stat{display:flex;gap:13px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.stat .ic svg{width:22px;height:22px}
.stat .v{font-size:23px;font-weight:700;line-height:1.1}
.stat .l{font-size:12px;color:var(--tx3);margin-top:3px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
th{ text-align:left;padding:11px 14px;background:#f7f8fb;color:var(--tx2);font-weight:500;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f8fafd}
/* 长文本列折叠（2026-11-04）：wide 列（笔记/提示词「内容」、知识库「备注」等）
   默认限 4 行，保留换行结构；点击单元格展开/收起全文 */
td .clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;max-width:560px;cursor:zoom-in;line-height:1.6}
td .clamp.open{display:block;-webkit-line-clamp:unset;max-width:none;max-height:420px;overflow-y:auto;cursor:zoom-out}
.tag{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag-blue{background:#e8effd;color:var(--blue)} .tag-green{background:#e3f6ec;color:var(--green)}
.tag-red{background:#fdeaea;color:var(--red)} .tag-amber{background:#fdf3e2;color:#c07a10}
.tag-gray{background:#eef1f5;color:var(--tx2)}
.tag-purple{background:#f0eafd;color:#6b4fd8} .tag-cyan{background:#e3f4f7;color:#0f7d94} .tag-orange{background:#fdf0e6;color:#c2621a}
.row-acts{display:flex;gap:6px;opacity:0;transition:opacity .15s}
tr:hover .row-acts{opacity:1}
.icon-btn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.icon-btn:hover{background:#eef1f6;color:var(--tx)}
.icon-btn.del:hover{background:#fdeaea;color:var(--red)}
.icon-btn.done{color:var(--green)}
.icon-btn.done:hover{background:#e3f6ec;color:var(--green)}
.icon-btn svg{width:15px;height:15px}
.empty{padding:46px 20px;text-align:center;color:var(--tx3);font-size:13px}
.empty svg{width:40px;height:40px;margin:0 auto 10px;opacity:.4}
.pbar{width:90px;height:6px;background:#edf0f5;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
tr.row-done td{opacity:.55}
tr.row-done td:first-child{text-decoration:line-through;text-decoration-color:var(--tx3)}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.18);animation:pop .2s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15.5px;font-weight:600}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.f-row{margin-bottom:14px}
.f-row label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.f-row input,.f-row select,.f-row textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;outline:none;transition:border .15s;font-size:14px}
.f-row input:focus,.f-row select:focus,.f-row textarea:focus{border-color:var(--blue);background:#fff}
.f-row textarea{min-height:120px;resize:vertical}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-16px);background:#1f2733;color:#fff;padding:10px 20px;border-radius:9px;font-size:13px;z-index:500;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ov-list{display:flex;flex-direction:column;gap:2px}
.ov-item{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:8px;font-size:13px}
.ov-item[draggable="true"]{cursor:move}
.ov-item.dragging{opacity:.35}
.ov-item.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.ov-item.drop-after{box-shadow:inset 0 -2px 0 var(--blue)}
.ov-item:hover{background:#f7f9fc}
.ov-item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.ov-item .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-item .dt{color:var(--tx3);font-size:12px;flex:0 0 auto}
.ov-item.ov-link{cursor:pointer;transition:background .15s}
.ov-item.ov-link:hover{background:#eef3fd}
.ov-item.ov-link:hover .tt{color:var(--blue)}
.ov-open{font-size:11.5px;color:var(--blue);opacity:0;flex:0 0 auto;transition:opacity .15s}
.ov-item.ov-link:hover .ov-open{opacity:1}
@media (hover:none){.ov-open{opacity:1}}
.sec-t{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-weight:600;font-size:14px}
.sec-t .more{font-size:12px;color:var(--blue);font-weight:400;cursor:pointer}
.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:#fff;min-height:36px}
.search input{border:none;outline:none;background:none;font-size:13px;width:150px}
.search svg{width:14px;height:14px;color:var(--tx3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sort-sel{max-width:230px;text-overflow:ellipsis;padding-right:26px;appearance:auto}
.confirm-b{text-align:center;padding:26px 20px 8px}
.confirm-b .ic{width:52px;height:52px;border-radius:50%;background:#fdeaea;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.confirm-b .ic svg{width:24px;height:24px;color:var(--red)}
.sb-mask{display:none}
@media (max-width:900px){ .f-grid{grid-template-columns:1fr} .ov-grid{grid-template-columns:1fr} }
@media (max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sb-mask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}
  .main{margin-left:0}
  .hamb{display:flex}
  .content{padding:16px 14px 60px}
  .row-acts{opacity:1}
  .search input{width:100px}
  .topbar{padding:10px 14px}
}
body{padding-bottom:env(safe-area-inset-bottom)}

/* ---- B1 键盘焦点行 ---- */
tr.row-focus td{background:#eef3fd!important;box-shadow:inset 0 0 0 1px var(--blue)}
.kbd-hint{font-size:11px;color:var(--tx3);background:#f0f3f8;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-family:inherit}
/* ---- B2 筛选 ---- */
.fbtn{position:relative}
.fpop{position:absolute;top:calc(100% + 6px);left:0;z-index:120;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);width:280px;max-height:70vh;overflow-y:auto;padding:14px}
.fpop h4{font-size:12.5px;color:var(--tx2);margin:0 0 8px;font-weight:600}
.fpop h4:not(:first-child){margin-top:14px}
.fchk{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:7px;font-size:13px;cursor:pointer}
.fchk:hover{background:#f7f9fc}
.fchk input{accent-color:var(--blue)}
.fpop-f{display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:#e8effd;color:var(--blue);border-radius:11px;padding:2px 4px 2px 9px;font-weight:500}
.fchip button{border:none;background:none;color:inherit;cursor:pointer;font-size:12px;line-height:1;padding:0 2px;border-radius:50%}
.fchip button:hover{background:rgba(47,111,237,.18)}
.fchip.clear{background:#eef1f5;color:var(--tx2)}
/* ---- B3 看板 ---- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.bcol{background:#f4f6fa;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px}
.bcol.dragover{background:#e8effd;border-color:var(--blue)}
.bcol-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--tx2);padding:2px 4px 10px}
.bcol-h .n{background:#e6eaf2;border-radius:9px;padding:1px 8px;font-size:11px;color:var(--tx2)}
.bcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);transition:border-color .15s}
.bcard:hover{border-color:#c9d4e4}
.bcard:active{cursor:grabbing}
.bcard .t{font-size:13px;font-weight:500;line-height:1.45;margin-bottom:7px;word-break:break-all}
.bcard .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bcard .pbar{width:100%;margin-top:7px}
.bcard.dragging{opacity:.45}
.bempty{font-size:12px;color:var(--tx3);text-align:center;padding:14px 4px;border:1px dashed #d5dce6;border-radius:9px}
/* ---- B4 备份横幅 ---- */
.bk-banner{display:flex;align-items:center;gap:12px;background:#fff8ec;border:1px solid #f3dfba;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#8a5a10}
.bk-banner .ic{flex:0 0 auto;color:#f0a020}
.bk-banner .grow{flex:1;min-width:0}
/* ---- B5 铃铛 ---- */
.tb-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--tx2);position:relative}
.tb-icon:hover{background:#eef1f6;color:var(--tx)}
.tb-icon svg{width:17px;height:17px}
.bell-badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bell-badge:empty{display:none}
.bell-wrap{position:relative}
.bell-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:150;width:330px;max-height:72vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 38px rgba(16,24,40,.16);display:none}
.bell-pop.show{display:block}
.bell-pop .bp-h{padding:12px 14px 8px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.bell-pop .bp-h .sub{font-size:11.5px;color:var(--tx3);font-weight:400}
.bell-item{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:12.5px;border-bottom:1px solid #f0f2f6}
.bell-item:last-child{border-bottom:none}
.bell-item .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bell-item .dt{flex:0 0 auto;font-size:11px;color:var(--tx3)}
.bell-empty{padding:22px 14px;text-align:center;color:var(--tx3);font-size:12.5px}
.bell-pop .bp-f{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap}
.ov-overdue{background:#fdf0f0!important;border-radius:8px}
.ov-warn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--red);background:#fdeaea;border-radius:8px;padding:8px 12px;margin:0 10px 10px}
.ov-warn svg{width:15px;height:15px;flex:0 0 auto}
/* ---- B6 Markdown ---- */
.md-body{font-size:13.5px;line-height:1.8;color:var(--tx);word-break:break-word}
.md-body h1,.md-body h2,.md-body h3{font-weight:600;margin:14px 0 8px;line-height:1.4}
.md-body h1{font-size:17px}.md-body h2{font-size:15.5px}.md-body h3{font-size:14px}
.md-body h1:first-child,.md-body h2:first-child,.md-body h3:first-child{margin-top:0}
.md-body p{margin:7px 0}
.md-body ul,.md-body ol{margin:7px 0 7px 20px}
.md-body li{margin:3px 0}
.md-body code{background:#f0f3f8;border-radius:4px;padding:1px 5px;font-size:12px;font-family:Consolas,Monaco,monospace}
.md-body pre{background:#f7f8fb;border:1px solid var(--line);border-radius:9px;padding:11px 13px;overflow-x:auto;margin:9px 0}
.md-body pre code{background:none;padding:0;font-size:12px;line-height:1.65}
.md-body blockquote{border-left:3px solid #cdd5e0;margin:8px 0;padding:2px 12px;color:var(--tx2);background:#f8fafd;border-radius:0 8px 8px 0}
.md-body table{border-collapse:collapse;margin:9px 0;font-size:12.5px}
.md-body th,.md-body td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.md-body th{background:#f7f8fb;font-weight:600}
.md-body hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.md-body a{color:var(--blue)}
.md-preview{min-height:120px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;padding:10px 12px;max-height:320px;overflow-y:auto}
.md-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.md-toggle button{border:none;background:#fff;color:var(--tx2);font-size:12px;padding:4px 11px;cursor:pointer}
.md-toggle button.on{background:var(--blue);color:#fff}
/* ---- B7 统计 ---- */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.st-grid{grid-template-columns:1fr}}
.st-legend{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.st-lg{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 7px;border-radius:7px;cursor:pointer;border:none;background:none;text-align:left;width:100%}
.st-lg:hover{background:#f2f6fd}
.st-lg .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.st-lg .v{margin-left:auto;color:var(--tx2);font-weight:600}
.st-note{font-size:10.5px;color:var(--tx3);margin-top:8px}
/* ---- B11 分类管理 ---- */
.cat-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}

/* === HR工作视图 · 共用核心层（PC / 手机版共用）===
   由 inject_hrview.py 注入两个 HTML 的 </head> 前，位于主 IIFE 之外。
   依赖同块内先定义的全局变量 MHR_NODES。
   只提供纯函数 / 数据访问 / 网络调用，不触碰任何页面的 state、saveData、refreshAll。
   与页面交互所需的 state 读写全部由 hrview_pc.js / hrview_mobile.js 在各自 IIFE 内完成。
   ES5 语法，与现有工作台代码风格一致。 */
var HRV = (function(){
  'use strict';
  var N = (typeof MHR_NODES !== 'undefined') ? MHR_NODES : {nodes:[],other:{items:[]},counts:{}};
  var nodes = N.nodes || [];
  var other = N.other || {id:'OTHER 其他',name:'Other',items:[]};
  var otherItems = other.items || [];
  var UNASSIGNED = 'UNASSIGNED';
  var IDX = {}, ATTACH = [], GROUPS = [], ROOTS = [], SECTIONS = [];

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  /* 与 HRD管理工作台.html:520 normTitle 完全同口径，保证去重行为一致 */
  function normTitle(s){
    return String(s==null?'':s)
      .replace(/^(\s*(re|fw|fwd|回复|转发|答复)\s*[:：\-]\s*)+/i,'')
      .replace(/[\[\]【】（）()「」《》<>]/g,' ')
      .replace(/[！!？?。，、；;：:…—\-~～·|/\\]/g,' ')
      .replace(/[\s\u3000]+/g,'')
      .replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);})
      .toLowerCase();
  }
  function isLive(r){ return !!r && !r._deleted; }
  function isDone(r){
    if(!r) return true;
    if(r['状态']==='已完成' || r['状态']==='已取消') return true;
    if(r.completed===true || r.done===true) return true;
    return false;
  }
  /* HR 工作视图只承载「有效」记录：未删除 + 未完成。
     这是视图层过滤，不写回 state.data，系统待办 / 笔记页仍展示全量。 */
  function isActive(r){ return isLive(r) && !isDone(r); }
  function activeRows(tasks, notes){
    return {tasks:(tasks||[]).filter(isActive), notes:(notes||[]).filter(isActive)};
  }
  function nodeId(r){ return (r && r.process_node_id) ? String(r.process_node_id) : ''; }
  /* 节点被删除 / 改名后，历史记录仍带着旧 process_node_id（本次删除 10.15）。
     这类「孤儿记录」按未归类处理，保证 HR 视图不静默丢数据；纯视图层判定，不写回记录。 */
  function isOrphan(r){ var id=nodeId(r); return !!id && !byId(id); }
  function isUnassigned(r){ return !nodeId(r) || isOrphan(r); }
  function shallowCopy(o){
    var x={},k; for(k in o){ if(Object.prototype.hasOwnProperty.call(o,k)) x[k]=o[k]; }
    return x;
  }
  function byId(id){
    if(!id || id===UNASSIGNED) return null;
    return IDX[id] || null;
  }
  function pathOf(id){ var n=byId(id); return n ? (n.path||'') : ''; }
  function nodeLabel(id){ var n=byId(id); return n ? n.id : (id||'未归类'); }

  function init(){
    nodes.forEach(function(n){ IDX[n.id]=n; });
    otherItems.forEach(function(n){ IDX[n.id]=n; });
    nodes.forEach(function(n){ if(n.leaf) ATTACH.push(n); });
    otherItems.forEach(function(n){ if(n.leaf) ATTACH.push(n); });
    ROOTS = nodes.filter(function(n){ return n.level===1; });
    ROOTS.forEach(function(root){
      nodes.filter(function(n){ return n.level===2 && n.parent_id===root.id; })
        .forEach(function(l2){
          var kids=nodes.filter(function(n){ return n.level===3 && n.parent_id===l2.id; });
          var selfLeaf=!kids.length, shown=kids;
          if(selfLeaf){
            /* 无 L3 的 L2（10.11-10.14）：分组标题已是完整流程名，
               节点行改显「本流程」，避免同一张卡片里文字重复。 */
            shown=[shallowCopy(l2)]; shown[0].viewLabel='本流程';
          }
          GROUPS.push({
            id:l2.id, title:l2.id, root:root.id, rootTitle:root.id,
            branch:root.branch||'', nodes:shown,
            count:(kids.length||1), selfLeaf:selfLeaf
          });
        });
    });
    GROUPS.push({id:other.id,title:'Other（边界流程）',root:'OTHER',rootTitle:'Other',
                 branch:'OTHER',nodes:otherItems,count:otherItems.length});
    GROUPS.push({id:UNASSIGNED,title:'未归类',root:UNASSIGNED,rootTitle:'未归类',
                 branch:'UNASSIGNED',nodes:[],count:0,virtual:true});
    buildSections();
  }
  /* 视图分区（只影响网格编排，不动字典 / 分组 id / 展开状态 key）：
     单一网格 = 10.0 下 12 个 L2（10.1-10.8 + 10.11-10.14）+ 16.0 下 1 个 L2
                + Other（边界流程），共 14 张卡片；
     非主干 L1（16.0）固定占第 9 位，保持与 10.7 / 10.8 同一行并列；
     Other 紧随 10.14 之后，与其同处第 5 行；
     虚拟「未归类」分组不再进入视图：个人 / 非 HR 内容不在本视图呈现（数据本身不删）。 */
  function buildSections(){
    var boundary=[], trunk=[], offTrunk=[], mainTitle = ROOTS[0] ? ROOTS[0].id : '';
    GROUPS.forEach(function(g){
      if(g.virtual) return;                      /* 未归类栏下线 */
      if(g.root==='OTHER'){ boundary.push(g); return; }
      if(g.root!==mainTitle){
        /* 非主干 L1 下只有 1 个 L2：卡片显示 L1 名称（用户口径的「16.0」），
           L2 原名与完整路径保留在 title 悬浮，层级信息不丢。 */
        g.viewTitle = g.root;
        g.viewPath = g.root+' > '+g.title;
        offTrunk.push(g);
      } else { trunk.push(g); }
    });
    /* 三栏第 3 行末位（第 9 格）留给非主干 L1，其余主干 L2 相对顺序不变。 */
    var slot = Math.max(0, 9 - offTrunk.length);
    var main = trunk.slice(0, slot).concat(offTrunk, trunk.slice(slot), boundary);
    SECTIONS = [
      {id:'MAIN', title:'MHR 2026 流程视图', groups:main}
    ];
  }
  init();

  /* ---------- 表单：所属流程节点（不在 m.fields 中，故不进 cols / mergeMd） ---------- */
  function optionsHtml(sel){
    sel=sel||'';
    var h='<option value="">未归类（不指定节点）</option>';
    GROUPS.forEach(function(g){
      if(g.virtual) return;
      h+='<optgroup label="'+esc(g.title)+'">';
      g.nodes.forEach(function(n){
        h+='<option value="'+esc(n.id)+'"'+(sel===n.id?' selected':'')+'>'+esc(n.id)+'</option>';
      });
      h+='</optgroup>';
    });
    return h;
  }
  function fieldHtml(modKey, row, preset){
    if(modKey!=='tasks' && modKey!=='notes') return '';
    var cur = row ? nodeId(row) : (preset||'');
    var snap = row ? (row._mtime||'') : '';
    return '<div class="hrv-node-row">'
      +'<label>所属流程节点</label>'
      +'<select name="__pnode" id="hrvPnode">'+optionsHtml(cur)+'</select>'
      +'<input type="hidden" name="__pmtime" value="'+esc(snap)+'">'
      +'<div class="hrv-hint">与系统待办 / 笔记是同一份数据；不选即为「未归类」</div>'
      +'</div>';
  }
  function readField(form){
    var el=form?form.querySelector('[name="__pnode"]'):null;
    var id=el?String(el.value||''):'';
    return {id:id,path:id?pathOf(id):''};
  }
  function conflictFromForm(row, form){
    if(!row) return false;
    var el=form?form.querySelector('[name="__pmtime"]'):null;
    var snap=el?String(el.value||''):'';
    if(!snap) return false;
    return String(row._mtime||'')!==snap;
  }
  /* 写入节点字段；字段缺失 = 未归类（不回填空串）；节点变更留痕 */
  function writeFields(row, form, meta){
    if(!row) return null;
    var f=readField(form);
    var from=nodeId(row), to=f.id;
    if(from!==to){
      row._pnode_hist=row._pnode_hist||[];
      row._pnode_hist.push({at:new Date().toISOString(),from:from,to:to,
                            by:(meta&&meta.by)||'unknown'});
      if(row._pnode_hist.length>50) row._pnode_hist=row._pnode_hist.slice(-50);
    }
    if(to){ row.process_node_id=to; row.process_path=f.path; }
    else { delete row.process_node_id; delete row.process_path; }
    return f;
  }

  /* ---------- 去重 / 徽标 / 分组 ---------- */
  function dedupKey(title, nid){ return normTitle(title)+'|'+(nid||'')+'|open'; }
  function findDuplicate(rows, title, nid, excludeId){
    var k=dedupKey(title,nid);
    for(var i=0;i<(rows||[]).length;i++){
      var r=rows[i];
      if(!isLive(r)||isDone(r)) continue;
      if(excludeId && r._id===excludeId) continue;
      if(dedupKey(r['标题']||'', nodeId(r))===k) return r;
    }
    return null;
  }
  function rowsOf(tasks, notes, nid){
    var t=[],n=[];
    (tasks||[]).forEach(function(r){ if(isLive(r)&&nodeId(r)===nid) t.push(r); });
    (notes||[]).forEach(function(r){ if(isLive(r)&&nodeId(r)===nid) n.push(r); });
    t.sort(function(a,b){ return (isDone(a)?1:0)-(isDone(b)?1:0); });
    return {tasks:t,notes:n};
  }
  function stats(tasks, notes, nid){
    var r=rowsOf(tasks,notes,nid), open=0;
    r.tasks.forEach(function(x){ if(!isDone(x)) open++; });
    return {open:open,notes:r.notes.length,total:r.tasks.length};
  }
  function groupStats(tasks, notes, g){
    if(g.virtual){
      var t=0,n=0;
      (tasks||[]).forEach(function(r){ if(isLive(r)&&isUnassigned(r)) t++; });
      (notes||[]).forEach(function(r){ if(isLive(r)&&isUnassigned(r)) n++; });
      return {open:t,notes:n,total:t+n};
    }
    var open=0,cnt=0;
    g.nodes.forEach(function(nd){ var s=stats(tasks,notes,nd.id); open+=s.open; cnt+=s.notes; });
    return {open:open,notes:cnt,total:open+cnt};
  }
  /* 验收标准 2：未归类 + 已归类 = 系统待办总数（对 tasks / notes 分别成立） */
  function totals(tasks, notes){
    var out={};
    [['tasks',tasks],['notes',notes]].forEach(function(p){
      var live=(p[1]||[]).filter(isLive);
      var cls=live.filter(function(r){ return !isUnassigned(r); }).length;
      out[p[0]]={total:live.length,classified:cls,unclassified:live.length-cls,
                 ok:(cls+(live.length-cls)===live.length)};
    });
    return out;
  }
  function matchKeyword(r, kw){
    if(!kw) return true;
    var s=[r['标题'],r['备注'],r['内容'],r['分类'],nodeId(r)].join(' ').toLowerCase();
    return s.indexOf(String(kw).toLowerCase())>=0;
  }

  /* ---------- AI 归类建议：复用部署站同源 /llm/ 代理（Key 在服务端） ---------- */
  function llmModel(){
    return fetch('/llm/model',{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('模型查询 HTTP '+r.status);
      return r.text();
    }).then(function(t){
      t=String(t||'').trim();
      if(!t||t==='UNKNOWN') throw new Error('后台未配置模型（/etc/claim.env CLAIM_LLM_MODEL）');
      return t;
    });
  }
  function parseSuggest(txt){
    var s=String(txt||'').replace(/<think>[\s\S]*?<\/think>/gi,'')
      .replace(/```json|```/g,'').trim();
    var m=s.match(/\[[\s\S]*\]/);
    if(!m) throw new Error('未解析到 JSON 数组（模型输出前 60 字：'+s.slice(0,60).replace(/\s+/g,' ')+'）');
    var arr=JSON.parse(m[0]);
    if(!Array.isArray(arr)) throw new Error('模型输出不是数组');
    var out=[],seen={};
    arr.forEach(function(x){
      if(!x) return;
      var id=String(x.node_id||x.node||'').trim();
      if(!byId(id)) return;                       // 非法节点一律丢弃，绝不写入
      var key=String(x.title||'');
      if(seen[key]) return; seen[key]=1;
      var c=parseFloat(x.confidence);
      if(isNaN(c)) c=0.5;
      c=Math.max(0,Math.min(1,c));
      out.push({title:key,node_id:id,confidence:c,
                reason:String(x.reason||'AI 建议').slice(0,80)});
    });
    if(!out.length) throw new Error('模型未给出任何合法节点建议');
    return out;
  }
  /* items: [{_id, 标题}]；cb(err, list)；仅返回建议，不写任何数据 */
  function suggest(items, cb){
    if(!/^http/.test(location.protocol)){
      cb(new Error('AI 建议需在部署站点使用（同源 /llm/ 代理）；本地 file:// 打开不可用'));
      return;
    }
    var batch=(items||[]).slice(0,20);
    if(!batch.length){ cb(new Error('没有需要归类的待办')); return; }
    var cand=ATTACH.map(function(n){ return n.id; });
    llmModel().then(function(model){
      var sys='你是华为 MHR 流程架构专家。请把待办归入最匹配的 L3 流程节点，'
        +'只能从给定节点清单中选择，不得编造编号或名称。置信度 0~1，仅对明显匹配给 0.8 以上。';
      var usr='【可选节点（编号+名称）】\n'+cand.join('\n')
        +'\n\n【待归类待办】\n'+batch.map(function(r,i){
            return (i+1)+'. '+String(r['标题']||'').slice(0,120);
          }).join('\n')
        +'\n\n只输出 JSON 数组，不要任何其他文字，元素格式：'
        +'{"title":"待办标题原文","node_id":"清单中某个节点 id 原文","confidence":0.0,"reason":"20字内理由"}';
      return fetch('/llm/chat/completions',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:model,
          messages:[{role:'system',content:sys},{role:'user',content:usr}],
          temperature:0.2,max_tokens:2000,thinking:{type:'disabled'}})
      });
    }).then(function(r){
      if(!r.ok) throw new Error('模型调用 HTTP '+r.status+(r.status===401?'（凭据无效）':''));
      return r.json();
    }).then(function(j){
      var msg=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
      var txt=msg.content||'';
      if(msg.reasoning_content && txt.indexOf('[')<0) txt+='\n'+msg.reasoning_content;
      cb(null,parseSuggest(txt));
    })['catch'](function(e){ cb(e); });
  }

  return {
    version:'hrv-core/1.0', nodes:nodes, other:other, otherItems:otherItems,
    groups:GROUPS, sections:SECTIONS, roots:ROOTS, attachable:ATTACH, unassigned:UNASSIGNED,
    esc:esc, normTitle:normTitle, isLive:isLive, isDone:isDone, nodeId:nodeId,
    isActive:isActive, activeRows:activeRows,
    isOrphan:isOrphan, isUnassigned:isUnassigned,
    byId:byId, pathOf:pathOf, nodeLabel:nodeLabel,
    optionsHtml:optionsHtml, fieldHtml:fieldHtml, readField:readField,
    conflictFromForm:conflictFromForm, writeFields:writeFields,
    dedupKey:dedupKey, findDuplicate:findDuplicate, rowsOf:rowsOf,
    stats:stats, groupStats:groupStats, totals:totals, matchKeyword:matchKeyword,
    llmModel:llmModel, parseSuggest:parseSuggest, suggest:suggest
  };
})();

</script>

/* ---------- 本地存储层（localStorage） ---------- */
var LS='wb_hrd_';

/* ---- 标题归一化 + 稳定指纹：解决「跨天 _id 漂移」与「同名变体重复」 ---- */
function normTitle(s){
  return String(s==null?'':s)
    .replace(/^(\s*(re|fw|fwd|回复|转发|答复)\s*[:：\-]\s*)+/i,'')  // 去 Re:/Fwd:/回复:/转发: 前缀(可连续)
    .replace(/[\[\]【】（）()「」《》<>]/g,' ')                        // 去成对括号
    .replace(/[！!？?。，、；;：:…—\-~～·|/\\]/g,' ')                // 去标点
    .replace(/[\s\u3000]+/g,'')                                     // 去所有空白
    .replace(/[！-～]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}) // 全角转半角
    .toLowerCase();
}
function hash32(s){
  var h=2166136261>>>0;
  s=String(s);
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return ('00000000'+h.toString(16)).slice(-8);
}
function fingerprint(title){ return hash32(normTitle(title)); }

/* ---- 删除墓碑：解决「删除后被 md 重新导入」 ----
   删除不物理移除记录，而是打 _deleted 时间戳；即使刷新/重启/重新同步，
   mergeMd 也会因为命中墓碑而跳过。墓碑另存 wb_hrd_tomb_<key> 做双保险
   （数组被清空、换浏览器时可凭此文件恢复）。 */
function tombs(key){ try{ return JSON.parse(localStorage.getItem(LS+'tomb_'+key)||'{}'); }catch(e){ return {}; } }
function saveTombs(key, map){ try{ localStorage.setItem(LS+'tomb_'+key, JSON.stringify(map)); }catch(e){} queueRemotePut(); }
function markDeleted(key, rec){
  rec._deleted=Date.now();
  var t=tombs(key); t[rec._fp||fingerprint(rec.__name||'')]=rec._deleted; saveTombs(key,t);
}

/* ---- 知识库种子版本 + 增量合并 ----
   问题：loadData 只在 localStorage 为空时播种，后续扩种子（如新增近一周邮件）
   对已有浏览器数据不生效，导致「近7 天入库 = 0」。
   方案：给 SEED_KNOW 打版本号，版本变化时做**增量合并**：
     · 已有记录 -> 保留不动（含用户手工登记的）
     · 新种子   -> 追加
     · 墓碑命中 -> 跳过（用户删过的不会被种子复活）
     · _fp 相同 -> 视为同一条，跳过 */
var SEED_KNOW_VER='v4-20261028';
function mergeKnowSeed(){
  try{
    var ver=localStorage.getItem(LS+'know_seed_ver');
    if(ver===SEED_KNOW_VER) return 0;
    var cols=['文件名','来源','分类','chunk数','入库时间','备注'];
    var cur=state.data.knowledge||[], t=tombs('knowledge');
    var seen={}, i;
    for(i=0;i<cur.length;i++){ if(cur[i]) seen[cur[i]._fp||fingerprint(cur[i]['文件名'])]=1; }
    var added=0;
    SEED_KNOW.forEach(function(arr,idx){
      var fp=fingerprint(arr[0]);
      if(seen[fp]) return;               // 已存在（含用户手工登记的同名项）
      if(t[fp]) return;                   // 墓碑：用户删过，不复活
      var o={_id:'auto_'+fp, _fp:fp, _src:'auto'};
      cols.forEach(function(c,j){ o[c]=resolveSeedDate(arr[j]); });
      cur.push(o); seen[fp]=1; added++;
    });
    state.data.knowledge=cur;
    saveData('knowledge',cur);
    localStorage.setItem(LS+'know_seed_ver',SEED_KNOW_VER);
    return added;
  }catch(e){ return 0; }
}

/* ---- 相对入库日期自愈（修复「近一周入库监控」全 0 时间炸弹）----
   resolveSeedDate 只在播种/合并时解析一次并写死为绝对日期；存量设备已在
   v4 版本播种，其 D(-n) 条目会随真实时间推移跌出滚动 7 天窗口，导致监控全 0。
   本函数在每次启动重新按「今天」解析种子相对日期，使 D(-n) 始终表示「n 天前」，
   监控窗口内恒有数据。仅作用于 _src=auto 且种子日期为 D(...) 的条目；
   手工登记与绝对日期条目（含历史种子）不受影响。 */
function refreshKnowRelative(){
  try{
    var seedExpr={};
    SEED_KNOW.forEach(function(arr){ seedExpr[fingerprint(arr[0])]=arr[4]; }); // arr[4]=入库时间
    var cur=state.data.knowledge||[], changed=false;
    cur.forEach(function(r){
      if(r._deleted || r._src!=='auto') return;
      var fp=r._fp||fingerprint(r['文件名']||'');
      var expr=seedExpr[fp]; if(expr==null) return;
      if(!/^D\([+-]?\d{1,3}\)$/.test(String(expr))) return;   // 仅相对日期需重算
      var nd=resolveSeedDate(expr);
      if(nd!==r['入库时间']){ r['入库时间']=nd; changed=true; }
    });
    if(changed){ state.data.knowledge=cur; saveData('knowledge',cur); }
  }catch(e){}
}

/* ---- AI Skill 种子版本 + 名册对齐（manifest 为唯一事实源）----
   与 knowledge 的差异：knowledge 登记表只增不减；skills 名册可删减——
   manifest 里删掉的技能，下次打开页面自动移除（只清 _src=auto 的名册记录，
   用户手工登记的 manual 记录永远保留）。
   合并规则：
     · 版本相同            -> 什么都不做
     · 名册内已有记录      -> 缺字段补齐（如老数据没有「备注」），不覆盖已有值
     · 名册新增条目        -> 追加（_id=auto_<指纹>）；命中墓碑则跳过（不复活）
     · 名册删掉的 auto 记录 -> 移除（manifest 删了它，不打墓碑，日后可加回） */
var SKILL_COLS=['技能ID','归属','来源','敏感度','版本','更新日','健康状态','备注'];
/* 提示词库种子合并：语义与知识库一致（纯增量追加），与 skills 名册不同——
   提示词是用户可编辑内容，永不自动删除/覆盖；fp=名称，命中墓碑跳过 */
var PROMPT_COLS=['名称','场景','内容','更新日','备注'];
function mergePromptsSeed(){
  try{
    var ver=localStorage.getItem(LS+'prompt_seed_ver');
    if(ver===SEED_PROMPTS_VER) return 0;
    var cur=state.data.prompts||[], t=tombs('prompts'), seen={}, added=0;
    cur.forEach(function(r){ if(r&&!r._deleted) seen[r._fp||fingerprint(r['名称'])]=1; });
    SEED_PROMPTS.forEach(function(arr){
      var fp=fingerprint(arr[0]);
      if(seen[fp]||t[fp]) return;                        // 已有/墓碑：跳过（不复活）
      var o={_id:'auto_'+fp, _fp:fp, _src:'auto'};
      PROMPT_COLS.forEach(function(c,j){ o[c]=resolveSeedDate(arr[j]); });
      cur.push(o); seen[fp]=1; added++;
    });
    if(added){ state.data.prompts=cur; saveData('prompts',cur); }
    localStorage.setItem(LS+'prompt_seed_ver',SEED_PROMPTS_VER);
    return added;
  }catch(e){ return 0; }
}
function mergeSkillsSeed(){
  try{
    var ver=localStorage.getItem(LS+'skill_seed_ver');
    if(ver===SEED_SKILLS_VER) return 0;
    var cur=state.data.skills||[], t=tombs('skills');
    var seedFps={}, i, j;
    for(i=0;i<SEED_SKILLS.length;i++){ seedFps[fingerprint(SEED_SKILLS[i][0])]=SEED_SKILLS[i]; }
    var next=[], seen={}, added=0;
    for(i=0;i<cur.length;i++){
      var r=cur[i]; if(!r) continue;
      if(!r._fp) r._fp=fingerprint(r['技能ID']);
      seen[r._fp]=1;
      if(r['模板']!==undefined){ delete r['模板']; }   // 提示词已独立成库，清理遗留模板列
      if(r._deleted||r._src==='manual'){ next.push(r); continue; }   // 墓碑行/手工登记保留
      if(seedFps[r._fp]){
        var arr=seedFps[r._fp];
        for(j=0;j<SKILL_COLS.length;j++){
          var c=SKILL_COLS[j];
          if((r[c]===undefined||r[c]===null||r[c]==='')&&arr[j]) r[c]=arr[j];  // 只补缺，不覆盖
        }
        next.push(r);
      }
      // else: auto 记录不在新名册 -> 移除（manifest 删掉了它）
    }
    for(var fp in seedFps){
      if(!seedFps.hasOwnProperty(fp)||seen[fp]||t[fp]) continue;
      var a2=seedFps[fp], o={_id:'auto_'+fp, _fp:fp, _src:'auto'};
      for(j=0;j<SKILL_COLS.length;j++){ o[SKILL_COLS[j]]=a2[j]; }
      next.push(o); seen[fp]=1; added++;
    }
    state.data.skills=next;
    saveData('skills',next);
    localStorage.setItem(LS+'skill_seed_ver',SEED_SKILLS_VER);
    return added;
  }catch(e){ return 0; }
}

/* ---- P1-5 种子日期相对化 ----
   种子日期字段支持 D(n)/D(-n) 语法（相对今天偏移天数，仅整格匹配）。
   解决「新设备播种后滚动窗口随真实时间衰减」（近 7 天入库 = 0 时间炸弹）。
   只在播种 / 增量合并【追加新条目】时解析；已有记录永不重算
   （mergeKnowSeed 纯追加，存量设备真实数据不受影响）。
   _fp 以标题/文件名为基准、不含日期 -> 同一条目多次 boot 不会重复。 */
function resolveSeedDate(v, base){
  var m=/^D\(([+-]?\d{1,3})\)$/.exec(String(v==null?'':v));
  if(!m) return v;
  var d=base?new Date(base.getTime()):new Date();
  d.setDate(d.getDate()+parseInt(m[1],10));
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

function loadData(key, seedRows, cols){
  var nameField=cols[0];
  try{ var raw=localStorage.getItem(LS+key); if(raw){ var arr=JSON.parse(raw); if(arr&&arr.length) return arr; } }catch(e){}
  var t=tombs(key), rows=[];
  seedRows.forEach(function(arr,i){
    var fp=fingerprint(arr[0]);
    if(t[fp]) return;                                  // 墓碑：首次播种也不复活
    var o={_id:'auto_'+fp, _fp:fp, _src:'auto'};
    cols.forEach(function(c,j){ o[c]=resolveSeedDate(arr[j]); });
    rows.push(o);
  });
  saveData(key, rows); return rows;
}
function saveData(key, rows){ try{ localStorage.setItem(LS+key, JSON.stringify(rows)); }catch(e){} queueRemotePut(); }

/* ---------- 每日数据刷新（refresh_workbench.py 回写 SEED_* 后） ----------
   合并规则（以 localStorage 为基线，md 只做增量）：
     1. md 条目命中墓碑            -> 跳过（删除状态优先，永不复活）
     2. md 条目命中已有记录        -> 只覆盖「用户没改过的字段」（_touched 保护），
                                      _id / _fp 保持稳定，不随 md 顺序漂移
     3. md 中的新条目              -> 新增，_id = 'auto_<指纹>'
     4. 用户手工新增的记录         -> 原样保留
------------------------------------------------------------------------- */
function mdSeed(key){ return key==='tasks'?SEED_TASKS:(key==='notes'?SEED_NOTES:[]); }
function mergeMd(key, cols, nameField){
  var cur=state.data[key]||[], seed=mdSeed(key), t=tombs(key), next=[], i, j, k;
  var byFp={}, keep=[];
  for(i=0;i<cur.length;i++){
    var r=cur[i]; if(!r) continue;
    if(!r._fp) r._fp=fingerprint(r[nameField]);
    if(r._deleted){ t[r._fp]=r._deleted; keep.push(r); continue; }  // 墓碑随行保留
    byFp[r._fp]=r;
  }
  for(i=0;i<seed.length;i++){
    var arr=seed[i], title=String(arr[0]||'').trim();
    if(!title) continue;
    var fp=fingerprint(title);
    if(t[fp]){ keep.push({_id:'gone_'+fp, _fp:fp, _src:'auto', _deleted:t[fp]}); continue; }
    var hit=byFp[fp];
    if(hit){
      var touched=hit._touched||{};
      for(j=0;j<cols.length;j++){ if(!touched[cols[j]] && cols[j]!==nameField) hit[cols[j]]=resolveSeedDate(arr[j]); }
      hit[nameField]=title; hit._fp=fp; next.push(hit); delete byFp[fp];
    }else{
      var o={_id:'auto_'+fp, _fp:fp, _src:'auto'};
      for(j=0;j<cols.length;j++){ o[cols[j]]=resolveSeedDate(arr[j]); }
      next.push(o);
    }
  }
  for(k in byFp){ if(byFp.hasOwnProperty(k)) next.push(byFp[k]); }   // 手工新增 / 本地独有
  for(i=0;i<keep.length;i++){ if(!byFp[keep[i]._fp]) next.push(keep[i]); }
  state.data[key]=next; saveData(key,next); saveTombs(key,t);
  return next.filter(function(r){return !r._deleted;}).length;
}
function syncFromMd(){
  var t=mergeMd('tasks', ['标题','分类','负责人','部门','优先级','状态','截止','进度','完成日','备注'], '标题');
  var n=mergeMd('notes', ['标题','日期','内容','待办'], '标题');
  return {tasks:t, notes:n};
}
function applySync(){
  var r=syncFromMd();
  refreshAll();
  toast('已同步 · 待办 '+r.tasks+' 条 / 笔记 '+r.notes+' 条');
}

   注意：关键词需足够specific —— 早期版本用裸字符「表」导致「白皮书/代表处」被误判为附件 */
var KNOW_SRC=['文件','邮件','附件'];
function inferKnowSrc(r){
  var probe=String((r['文件名']||'')+' '+(r['备注']||'')+' '+(r['分类']||''));
  var low=probe.toLowerCase();
  if(/邮件|mail|提醒|通知|审批结果|沟通|纪要/.test(low)) return '邮件';
  if(/附件|attachment|汇总表|清单|模板|评分标准|复盘材料|汇总材料/.test(low)) return '附件';
  return '文件';
}

/* ---------- B11 分类可配置 ----------
   原 4 类写死在 MODULES.tasks.fields，现改为 localStorage 持久化的可配置列表：
     · getCats() 读配置（无配置回退默认 4 类）
     · syncCatOptions() 把配置同步进 MODULES 定义（openForm/筛选用）
     · 重命名/删除会级联更新已有任务的「分类」值，并写 _touched 防止被 md 同步覆盖
     · 删除被引用的分类时，任务迁移到「其他」（若无「其他」则迁移到第一个分类）
   自动推断规则（filters.json 的 categories 段）以只读方式内嵌为 CAT_RULES，
   页面与 refresh_workbench.py 共用同一套规则口径；改规则请改 filters.json。 */
var TASK_CATS_DEFAULT=['个人','日常工作','上级沟通','其他'];
var CAT_RULES={default:'日常工作', source:'filters.json', rules:[
 {name:'上级沟通', priority:1, keywords:['汇报','呈报','请示','签批','向总','向上汇报','领导要求','领导指示','1:1','one-on-one','面谈','绩效沟通','谈心','答复上级','上级要求']},
 {name:'个人', priority:2, keywords:['个人','私人','证件','签证','护照','体检','请假','休假','年假','病假','婚假','产假','社保','公积金','生日','读书','健身','餐补','报销个人','个人事务','证明开具','背调个人','离职个人']},
 {name:'日常工作', priority:3, keywords:['招聘','背调','背景调查','离职','入职','转正','绩效','PBC','培训','会议','纪要','合规','授权','流程','材料','数据','分析','报告','评议','任命','岗位','编制','HC','候选人','面试','薪酬','考勤','名单','系统','问卷','表格','提醒','公示','校对','汇总','整理','跟进']}
]};
var CAT_PALETTE=['tag-purple','tag-cyan','tag-orange','tag-gray','tag-blue','tag-green','tag-red','tag-amber'];
var CAT_DEFAULT_CLS={'个人':'tag-purple','日常工作':'tag-cyan','上级沟通':'tag-orange','其他':'tag-gray'};
function getCats(){
  try{ var a=JSON.parse(localStorage.getItem(LS+'task_cats')||'null'); if(a&&a.length) return a; }catch(e){}
  return TASK_CATS_DEFAULT.slice();
}
function setCats(a){ try{ localStorage.setItem(LS+'task_cats', JSON.stringify(a)); }catch(e){} }
function syncCatOptions(){
  var f=MODULES.filter(function(x){return x.key==='tasks';})[0].fields.filter(function(x){return x.f==='分类';})[0];
  if(f) f.opts=getCats();
}
/* 重命名：级联更新任务分类值 + _touched 字段级保护 */
function renameCat(oldName, newName){
  newName=String(newName||'').trim();
  if(!newName||newName===oldName) return false;
  var cats=getCats();
  if(cats.indexOf(newName)>-1) return false;                 // 与现有分类重名
  var i=cats.indexOf(oldName); if(i<0) return false;
  cats[i]=newName; setCats(cats); syncCatOptions();
  (state.data.tasks||[]).forEach(function(r){
    if(r['分类']===oldName){ r['分类']=newName; r._touched=r._touched||{}; r._touched['分类']=1; }
  });
  saveData('tasks', state.data.tasks);
  return true;
}
/* 删除：被引用的任务迁移到「其他」（或第一个分类），同样走 _touched 保护 */
function deleteCat(name){
  var cats=getCats();
  if(cats.length<=1) return false;                            // 至少保留一个分类
  var fallback=cats.indexOf('其他')>-1&&name!=='其他'?'其他':cats.filter(function(c){return c!==name;})[0];
  var i=cats.indexOf(name); if(i<0) return false;
  cats.splice(i,1); setCats(cats); syncCatOptions();
  (state.data.tasks||[]).forEach(function(r){
    if(r['分类']===name){ r['分类']=fallback; r._touched=r._touched||{}; r._touched['分类']=1; }
  });
  saveData('tasks', state.data.tasks);
  return fallback;
}
function addCat(name){
  name=String(name||'').trim();
  if(!name) return false;
  var cats=getCats();
  if(cats.indexOf(name)>-1) return false;
  cats.push(name); setCats(cats); syncCatOptions();
  return true;
}

/* ---------- 计算层 ---------- */
function fmtDate(v){ if(!v) return '-'; return String(v).slice(0,10); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function esc(s){ return String(s===null||s===undefined?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tagCls(v){ v=String(v||'');
  if(/正常|已完成|general|P0/.test(v)) return 'tag-green';
  if(/缺版本|断链|陈旧|重名|company_sensitive|P1|进行中/.test(v)) return 'tag-amber';
  if(/逾期|暂停/.test(v)) return 'tag-red';
  return 'tag-blue';
}
/* 分类专属配色（与状态/优先级标签区分）。
   默认 4 类固定配色（兼容既有测试），自定义分类按配置序号走色板循环 */
function catCls(v){ v=String(v||'');
  if(CAT_DEFAULT_CLS[v]) return CAT_DEFAULT_CLS[v];
  var cats=getCats(), i=cats.indexOf(v);
  return i>=0?CAT_PALETTE[i%CAT_PALETTE.length]:'tag-gray';
}
function genId(){ return 'r'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
/* computeToday：仅取「已逾期或今天到期」的任务。
   注：工作总览的「全部待办」区块已改用 computeOpen()（所有未完成任务）；
   此函数保留备用（如需"今日到期"专项视图）。 */
function computeToday(){
  var t=todayStr();
  return (state.data.tasks||[]).filter(function(r){
    return !r._deleted && r['状态']!=='已完成' && r['截止'] && String(r['截止']).slice(0,10)<=t;
  }).sort(function(a,b){return String(a['截止']).localeCompare(String(b['截止']));});
}
/* 全部待办：所有未完成任务（含无截止日），复用统一排序规则
   （状态分组 -> 优先级 -> 截止日），与待办任务页签保持同一顺序 */
function computeOpen(){
  var rows=(state.data.tasks||[]).filter(function(r){ return !r._deleted && r['状态']!=='已完成'; });
  return sortRows('tasks', rows);
}
/* 拖拽重排（总览「全部待办」）：把 dragId 移到 targetId 之前（after=false）
   或之后（after=true；targetId 为空 -> 移到末尾）。未完成组整组重编 _ord（1..n），
   记录对象为 state.data.tasks 引用，写 _ord 即落库；返回新顺序条数，找不到返回 0。
   保存由调用方 saveData('tasks',...) 完成（自带 queueRemotePut 同步）。 */
function reorderOpen(dragId, targetId, after){
  var rows=(state.data.tasks||[]).filter(function(r){ return !r._deleted && r['状态']!=='已完成'; });
  rows=sortRows('tasks', rows);                        // 必须按当前显示顺序（_ord 优先）取基准，不能按物理顺序
  var from=-1, to=-1, i;
  for(i=0;i<rows.length;i++){ if(rows[i]._id===dragId){ from=i; break; } }
  if(from<0) return 0;
  var rec=rows.splice(from,1)[0];
  if(targetId){
    for(i=0;i<rows.length;i++){ if(rows[i]._id===targetId){ to=after?i+1:i; break; } }
    if(to<0) to=rows.length;                           // 目标已被移除/不存在 -> 末尾
  }else{ to=rows.length; }
  rows.splice(to,0,rec);
  rows.forEach(function(r,idx){ r._ord=idx+1; });
  return rows.length;
}
/* B2 查询语法解析：`分类:日常工作 状态:进行中 关键字`
   -> {conds:[{f:'分类',v:'日常工作'},...], text:'关键字'}
   字段:值 命中「该字段包含该值」；字段不存在时退化为全文包含 */
function parseQuery(q){
  var out={conds:[], text:''};
  String(q||'').split(/\s+/).forEach(function(tok){
    if(!tok) return;
    var m=tok.match(/^([^:：]+)[:：](.+)$/);
    if(m){ out.conds.push({f:m[1].trim(), v:m[2].trim()}); }
    else out.text+=(out.text?' ':'')+tok;
  });
  return out;
}
function matchSearch(row){
  var pq=parseQuery(state.search), i, k;
  for(i=0;i<pq.conds.length;i++){
    var c=pq.conds[i], v=c.v.toLowerCase(), hit=false;
    if(row[c.f]!==undefined){ hit=String(row[c.f]).toLowerCase().indexOf(v)>-1; }
    else{ for(k in row){ if(String(row[k]).toLowerCase().indexOf(v)>-1){ hit=true; break; } } }
    if(!hit) return false;
  }
  if(!pq.text) return true;
  var q=pq.text.toLowerCase();
  for(k in row){ if(String(row[k]).toLowerCase().indexOf(q)>-1) return true; }
  return false;
}

/* ---- B2 结构化筛选（按模块持久化）---- */
function loadFilters(){ try{ state.filters=JSON.parse(localStorage.getItem(LS+'filters')||'{}')||{}; }catch(e){ state.filters={}; } }
function saveFilters(){ try{ localStorage.setItem(LS+'filters', JSON.stringify(state.filters||{})); }catch(e){} }
function moduleFilters(m){ return (state.filters&&state.filters[m.key])||{}; }
/* 筛选项：select 类字段多选 + tasks 的截止区间（逾期/今日/本周/无截止） */
function filterSpecs(m){
  var specs=[];
  (m.fields||[]).forEach(function(f){
    if(f.t==='select'&&f.opts&&f.opts.length&&f.f!=='重复') specs.push({f:f.f, opts:f.opts.slice()});
  });
  if(m.key==='tasks') specs.push({f:'截止', due:1, opts:['逾期','今日','本周','无截止']});
  return specs;
}
function dueMatch(row, opt){
  var d=String(row['截止']||'').slice(0,10);
  if(opt==='无截止') return !d;
  if(!d) return false;
  var t=todayStr();
  if(opt==='逾期') return d<t;
  if(opt==='今日') return d===t;
  if(opt==='本周'){ var w=weekKey(d), cw=weekKey(t); return !!w&&!!cw&&w.key===cw.key&&d>=t; }
  return false;
}
function filterRows(m, rows){
  var fl=moduleFilters(m);
  return rows.filter(function(r){
    for(var k in fl){
      if(!fl.hasOwnProperty(k)) continue;
      var arr=fl[k]; if(!arr||!arr.length) continue;
      var ok;
      if(k==='截止'){ ok=arr.some(function(o){ return dueMatch(r,o); }); }
      else{ ok=arr.some(function(v){ return String(r[k]||'')===v; }); }
      if(!ok) return false;
    }
    return true;
  });
}
function filterPanelHtml(m){
  var specs=filterSpecs(m), fl=moduleFilters(m);
  if(!specs.length) return '';
  var h='<div class="fpop" id="filterPop"><h4 style="margin-top:0">筛选条件</h4>';
  specs.forEach(function(s){
    h+='<h4>'+s.f+(s.due?'（截止区间）':'')+'</h4>';
    s.opts.forEach(function(o){
      var on=(fl[s.f]||[]).indexOf(o)>-1;
      h+='<label class="fchk"><input type="checkbox" data-fkey="'+esc(s.f)+'" data-fval="'+esc(o)+'"'+(on?' checked':'')+'><span>'+esc(o)+'</span></label>';
    });
  });
  h+='<div class="fpop-f"><button class="btn btn-sm" id="fClear">清空筛选</button><button class="btn btn-sm btn-pri" id="fDone">完成</button></div></div>';
  return h;
}
function activeFilterChips(m){
  var fl=moduleFilters(m), chips=[];
  for(var k in fl){ if(!fl.hasOwnProperty(k)) continue; (fl[k]||[]).forEach(function(v){ chips.push({k:k,v:v}); }); }
  if(!chips.length) return '';
  var h='<span class="fchips">';
  chips.forEach(function(c){
    h+='<span class="fchip">'+esc(c.k)+'：'+esc(c.v)+'<button data-fdel="'+esc(c.k+'|'+c.v)+'" title="移除该条件">✕</button></span>';
  });
  h+='<button class="fchip clear" id="fClearAll">清除筛选</button></span>';
  return h;
}
/* 下钻（B7 图表点击 / 筛选项）：设置某模块某字段的单值筛选并跳转 */
function drillFilter(moduleKey, field, value){
  state.filters=state.filters||{};
  var f=state.filters[moduleKey]||{};
  f[field]=[value];
  state.filters[moduleKey]=f;
  saveFilters();
  state.page=moduleKey; state.search=''; state.focusIndex=-1;
  refreshAll();
  toast('已筛选：'+field+' = '+value);
}

/* ---- 列表排序（计算层，纯函数，不碰 DOM）----
   待办任务页签：未完成排在最上面
     ① 状态分组：进行中 → 暂停 → 其他未完成 → 已完成（沉底）
     ② 同组按优先级 P0 → P1 → P2
     ③ 未完成组按截止日期升序（越早越靠前，无截止排最后）
     ④ 已完成组按完成日倒序（刚完成的靠前）
   Array.sort 自 ES2019 起保证稳定，同级保持原有顺序。 */
var STATUS_RANK={'进行中':0,'暂停':1};
var PRIO_RANK={'P0':0,'P1':1,'P2':2};
function statusRank(r){
  var raw=r['状态'];
  var s=String(raw===null||raw===undefined?'':raw).trim();
  if(!s) return 0;                                   // 未填状态 -> 视为未完成，且排最前
  if(s==='已完成') return 9;                          // 已完成 -> 沉底
  return STATUS_RANK[s]!==undefined?STATUS_RANK[s]:2; // 进行中 0 / 暂停 1 / 其他 2
}
/* _ord：总览拖拽排序字段（内部字段，不进 cols/fields，不影响表单与表格列）。
   无 _ord 的记录 ordVal=1e9（排在有 _ord 之后），保持原 sortRows 规则零感知兼容。 */
function ordVal(r){ var v=r&&r._ord; return (typeof v==='number'&&isFinite(v))?v:1e9; }

/* ---------- 笔记配图（2026-10-28，与手机版同构）----------
   存储方案：图片文件走独立端点 /api/hrd/img（sha256 内容寻址，服务端
   data/hrd_imgs/），笔记只存引用 _imgs:[{id,name,w,h}]（内部字段，同 _ord
   性质，不进 cols/fields）——快照不被 base64 撑爆，8MB 载荷上限 / 45s 轮询
   全量下载 / localStorage 配额全部保住；同内容重复上传天然去重。
   上传前压缩：JPEG/PNG 走 canvas 压到 1600px；GIF 保动画原样传。 */
var RIMG='/api/hrd/img';
var IMG_ACCEPT='image/jpeg,image/png,image/gif';
var IMG_MAX_BYTES=5*1024*1024;      // 单图上限（与后端一致）
var IMG_GIF_MAX=2*1024*1024;        // GIF 不重编码（保动画），原样上传上限
var IMG_MAX_EDGE=1600;              // 压缩后最大边长
var IMG_Q=0.85;                     // JPEG 压缩质量
function imgPlan(type,bytes){
  if(type!=='image/jpeg'&&type!=='image/png'&&type!=='image/gif')
    return {mode:'reject',reason:'仅支持 JPG / PNG / GIF 格式'};
  if(type==='image/gif'){
    if(bytes>IMG_GIF_MAX) return {mode:'reject',reason:'GIF 超过 2MB（为保留动画不重编码，请换小图）'};
    return {mode:'origin'};
  }
  if(bytes>IMG_MAX_BYTES) return {mode:'reject',reason:'图片超过 5MB 上限'};
  return {mode:'compress'};
}
function fitSize(w,h,max){
  w=Number(w)||0; h=Number(h)||0;
  if(w<=0||h<=0) return {w:0,h:0};
  if(w<=max&&h<=max) return {w:w,h:h};
  if(w>=h) return {w:max,h:Math.max(1,Math.round(h*max/w))};
  return {w:Math.max(1,Math.round(w*max/h)),h:max};
}
function fmtBytes(n){
  n=Number(n)||0;
  if(n<1024) return n+' B';
  if(n<1048576) return Math.round(n/1024)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}
function collectImgIds(rows){
  var out={};
  (rows||[]).forEach(function(r){
    if(!r||r._deleted) return;
    (r._imgs||[]).forEach(function(im){ if(im&&im.id) out[im.id]=1; });
  });
  return Object.keys(out);
}
function imgUrl(id){
  var u=RIMG+'/'+encodeURIComponent(id);
  var t=rToken();                                  // img 标签发不出自定义头，令牌走 query
  return t?u+'?t='+encodeURIComponent(t):u;
}
/* 待删图片队列：必须先让「去引用的快照」PUT 成功，再删文件——否则服务端
   refcheck 会 409（旧快照仍引用）。PUT 成功回调里 flush（见 queueRemotePut）。 */
var _pendingImgDel=[];
function queueImgDel(id){ if(id) _pendingImgDel.push(id); }
function flushImgDel(){
  if(!_pendingImgDel.length) return;
  if(!remoteOk()||isLocalFile()) return;           // 离线/停用副本：留在队列，下次 PUT 成功再删
  var h=rHeaders();
  _pendingImgDel.forEach(function(id){
    fetch(RIMG+'/'+encodeURIComponent(id),{method:'DELETE',headers:h})
      .then(function(r){ if(r.status===401) onRemote401(); })
      ['catch'](function(){});
  });
  _pendingImgDel=[];
}
function blobToBase64(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result||'')); };
    fr.onerror=function(){ rej(new Error('读取失败')); };
    fr.readAsDataURL(blob);
  });
}
function compressFile(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      try{
        var d=fitSize(img.naturalWidth,img.naturalHeight,IMG_MAX_EDGE);
        var cv=document.createElement('canvas'); cv.width=d.w; cv.height=d.h;
        cv.getContext('2d').drawImage(img,0,0,d.w,d.h);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){ b?res({blob:b,w:d.w,h:d.h}):rej(new Error('压缩失败')); },'image/jpeg',IMG_Q);
      }catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('图片解析失败')); };
    img.src=url;
  });
}
function uploadImg(file){
  return Promise.resolve().then(function(){
    var plan=imgPlan(file.type,file.size);
    if(plan.mode==='reject') throw new Error(plan.reason);
    return plan.mode==='compress'?compressFile(file):Promise.resolve({blob:file,w:0,h:0});
  }).then(function(p){
    return blobToBase64(p.blob).then(function(durl){
      var h=rHeaders(); h['Content-Type']='application/json';
      return fetch(RIMG,{method:'POST',headers:h,body:JSON.stringify({name:file.name||'image',data:durl})})
        .then(function(r){
          if(r.status===401){ onRemote401(); throw new Error('同步密码校验失败，请重新设置密码'); }
          return r.json().then(function(j){
            if(!r.ok||!j||!j.ok) throw new Error((j&&j.error)||('上传失败（HTTP '+r.status+'）'));
            return {id:j.id,name:file.name||'image',w:p.w||0,h:p.h||0,bytes:j.bytes||0};
          });
        });
    });
  });
}
/* 灯箱：查看笔记配图大图（左右切换 / ESC / 点背景关闭） */
var _lbIds=[], _lbIdx=0, _lbKey=null;
function openLightbox(ids,idx){
  _lbIds=(ids||[]).slice(); _lbIdx=idx||0;
  if(!_lbIds.length) return;
  lbShow();
  $('#lightbox').classList.add('show');
  if(_lbKey) document.removeEventListener('keydown',_lbKey);
  _lbKey=function(e){
    if(e.key==='Escape') closeLightbox();
    else if(e.key==='ArrowLeft') lbStep(-1);
    else if(e.key==='ArrowRight') lbStep(1);
  };
  document.addEventListener('keydown',_lbKey);
}
function lbShow(){
  var id=_lbIds[_lbIdx]; if(!id) return;
  $('#lbImg').src=imgUrl(id);
  $('#lbCount').textContent=(_lbIds.length>1)?(_lbIdx+1+' / '+_lbIds.length):'';
  $('#lbPrev').style.display=_lbIds.length>1?'':'none';
  $('#lbNext').style.display=_lbIds.length>1?'':'none';
}
function lbStep(d){
  if(_lbIds.length<2) return;
  _lbIdx=(_lbIdx+d+_lbIds.length)%_lbIds.length;
  lbShow();
}
function closeLightbox(){
  var lb=$('#lightbox');
  if(lb) lb.classList.remove('show');
  var im=$('#lbImg'); if(im) im.src='';
  if(_lbKey){ document.removeEventListener('keydown',_lbKey); _lbKey=null; }
}
/* 排序选项（前端唯一排序事实源）。
   服务端 /api/hrd/state 只透传 JSON 快照、不做任何排序，各设备拉取后由本函数
   同一套规则渲染 -> 多端排序结果天然一致。 */
var SORT_OPTS={
  tasks:[
    {k:'smart',  label:'智能排序（未完成→优先级→截止）', def:true},
    {k:'due',    label:'截止日期（近→远）'},
    {k:'dueDesc',label:'截止日期（远→近）'},
    {k:'prio',   label:'优先级（P0→P2）'},
    {k:'created',label:'创建时间（新→旧）'},
    {k:'title',  label:'标题（A→Z）'}
  ],
  notes:[
    {k:'updated',label:'最近更新（新→旧）', def:true},
    {k:'created',label:'录入时间（新→旧）'},
    {k:'title',  label:'标题（A→Z）'}
  ],
  prompts:[
    {k:'updated',label:'更新日（新→旧）', def:true},
    {k:'scene',  label:'场景（A→Z）'},
    {k:'title',  label:'名称（A→Z）'}
  ]
};
function sortPref(key){
  var list=SORT_OPTS[key]; if(!list) return '';
  var v=state.sort&&state.sort[key];
  if(v&&list.some(function(o){return o.k===v;})) return v;
  var d=list.filter(function(o){return o.def;})[0];
  return d?d.k:list[0].k;
}
function nowIso(){ return new Date().toISOString(); }
/* 笔记排序键：_mtime（ISO 串，字典序=时间序）-> 「日期」字段 -> _id 兜底 */
function noteUpdated(r){
  if(r&&r._mtime) return String(r._mtime);
  var d=String((r&&r['日期'])||'').slice(0,10);
  if(d) return d;
  return String((r&&r._id)||'');
}
function cmpNum(a,b){ return a<b?-1:(a>b?1:0); }
function cmpStr(a,b){ a=String(a==null?'':a); b=String(b==null?'':b); return a<b?-1:(a>b?1:0); }
function cmpPrio(a,b){
  var pa=PRIO_RANK[a['优先级']], pb=PRIO_RANK[b['优先级']];
  if(pa===undefined) pa=9; if(pb===undefined) pb=9;
  return pa-pb;
}
function cmpDue(a,b,desc){
  var ka=String(a['截止']||''), kb=String(b['截止']||'');
  if(ka===kb) return 0;
  if(!ka) return desc?-1:1;                            // 无截止：近→远沉底 / 远→近浮头
  if(!kb) return desc?1:-1;
  var c=ka<kb?-1:1;
  return desc?-c:c;
}
function cmpCreated(a,b){ return -cmpStr(a._ctime||a._mtime||a._id||'', b._ctime||b._mtime||b._id||''); }
function notesCmp(pref){
  return function(a,b){
    if(pref==='title') return cmpStr(a['标题'],b['标题']);
    if(pref==='created') return -cmpStr(a['日期']||a._id||'', b['日期']||b._id||'');
    return -cmpStr(noteUpdated(a),noteUpdated(b));      // updated（默认）：_mtime→日期→_id 降序
  };
}
function sortRows(key, rows){
  var arr=rows.slice();
  if(key==='prompts'){
    var pf=sortPref('prompts');
    return arr.sort(function(a,b){
      if(pf==='title') return cmpStr(a['名称'],b['名称']);
      if(pf==='scene') return cmpStr(a['场景'],b['场景'])||-cmpStr(a['更新日']||'',b['更新日']||'');
      return -cmpStr(a['更新日']||a._mtime||a._id||'', b['更新日']||b._mtime||b._id||'');  // updated 默认：更新日新→旧
    });
  }
  if(key!=='tasks'&&key!=='notes') return arr;
  if(key==='notes') return arr.sort(notesCmp(sortPref('notes')));
  var pref=sortPref('tasks');
  return arr.sort(function(a,b){
    var sa=statusRank(a), sb=statusRank(b);
    if(sa!==sb) return sa-sb;                          // ① 未完成在上（所有 tasks 排序保持）
    var c=0;
    if(sa<9){                                          // ② 未完成组：主键按排序偏好
      if(pref==='smart') c=cmpNum(ordVal(a),ordVal(b));          // 拖拽 _ord 优先
      else if(pref==='due') c=cmpDue(a,b,false);
      else if(pref==='dueDesc') c=cmpDue(a,b,true);
      else if(pref==='prio') c=cmpPrio(a,b);
      else if(pref==='created') c=cmpCreated(a,b);
      else if(pref==='title') c=cmpStr(a['标题'],b['标题']);
      if(c) return c;
      c=cmpPrio(a,b); if(c) return c;                  // ③ 次级键：优先级 -> 截止（smart 的 _ord 之后同样兜底，还原默认规则）
      c=cmpDue(a,b,false); if(c) return c;
    }else{                                             // ④ 已完成组：完成日新→旧（排序维度不跨状态组）
      var da=String(a['完成日']||''), db=String(b['完成日']||'');
      if(da!==db) return da<db?1:-1;
    }
    return 0;
  });
}

/* ---------- 近一周入库监控（计算层，纯函数） ----------
   统计维度：**滚动 7 天窗口**（[今天-6, 今天]，与「自然周」不同口径）
   数据来源：入库监控登记表（可维护）；入库物 = 文件 / 邮件 / 附件
   用途：作为 RAG 入库质量的监控指标（新增量、来源结构、分类覆盖）          */
function daysAgo(n){
  var t=new Date();
  t.setDate(t.getDate()-n);
  return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
}
function recentIngest(rows, days){
  var to=todayStr(), from=daysAgo((days||7)-1);
  var out=[];
  (rows||[]).forEach(function(r){
    if(r._deleted) return;
    var d=String(r['入库时间']||'').slice(0,10);
    if(!d) return;                       // 无日期不计入
    if(d>=from && d<=to) out.push(r);    // 滚动窗口 [from, to]，两端闭合 = 恰好 days 天
  });
  out.sort(function(a,b){ return String(b['入库时间']).localeCompare(String(a['入库时间'])); });
  return out;
}
/* 入库结构统计：按来源与分类聚合 */
function ingestProfile(rows){
  var bySrc={}, byCat={}, files=0, chunks=0, mails=0, atts=0;
  (rows||[]).forEach(function(r){
    if(r._deleted) return;
    var s=KNOW_SRC.indexOf(r['来源'])>-1?r['来源']:'文件';
    bySrc[s]=(bySrc[s]||0)+1;
    if(s==='文件') files++; else if(s==='邮件') mails++; else atts++;
    var c=r['分类']||'未分类';
    byCat[c]=(byCat[c]||0)+1;
    chunks+=Number(r['chunk数'])||0;
  });
  return {bySrc:bySrc, byCat:byCat, files:files, mails:mails, atts:atts,
          total:(rows||[]).filter(function(r){return !r._deleted;}).length, chunks:chunks};
}

/* ---------- 知识库周变化趋势（计算层，纯函数） ----------
   统计维度：自然周（周一 ~ 周日），按入库文件的「入库时间」字段归周
   数据来源：工作台「入库文件登记」表（可维护）+ myai_knowledge 索引总量快照（RAG_STATS）
   口径：本周新增 = 该周入库文件数；本周 chunks = 该周入库文件 chunk 数之和；
        累计 chunks = RAG_STATS.chunks（快照值，仅作总量参照）              */
function weekKey(dateStr){
  var d=new Date(String(dateStr||'').slice(0,10));
  if(isNaN(d.getTime())) return null;          // 无效日期 -> null
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  var dow=(t.getDay()+6)%7;                 // 周一=0
  t.setDate(t.getDate()-dow);               // 回到本周一
  var y=t.getFullYear(), m=t.getMonth()+1, dd=t.getDate();
  var end=new Date(t); end.setDate(end.getDate()+6);
  return {
    key:y+'-W'+pad2(isoWeek(t)),
    start:t.getFullYear()+'-'+pad2(m)+'-'+pad2(dd),
    end:end.getFullYear()+'-'+pad2(end.getMonth()+1)+'-'+pad2(end.getDate()),
    label:pad2(m)+'/'+pad2(dd)+'-'+pad2(end.getMonth()+1)+'/'+pad2(end.getDate())
  };
}
function pad2(n){ return ('0'+n).slice(-2); }
function isoWeek(d){
  var t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));         // 移到本周四
  var w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7);
}
function weeklyKnowTrend(rows){
  var map={}, order=[];
  (rows||[]).forEach(function(r){
    if(r._deleted) return;
    var w=weekKey(r['入库时间']); if(!w) return;
    if(!map[w.key]){ map[w.key]={key:w.key,start:w.start,end:w.end,label:w.label,files:0,chunks:0}; order.push(w.key); }
    map[w.key].files+=1;
    map[w.key].chunks+=Number(r['chunk数'])||0;
  });
  order.sort();
  var out=order.map(function(k){ return map[k]; });
  var cum=0;
  out.forEach(function(w){ cum+=w.chunks; w.cumChunks=cum; });
  return out;
}
/* 内联 SVG 折线图（零外部依赖）：data=[{label,value}] */
function svgLineChart(data, opt){
  opt=opt||{};
  var w=opt.width||560, h=opt.height||150, pl=44, pr=14, pt=14, pb=28;
  var iw=w-pl-pr, ih=h-pt-pb;
  if(!data.length) return '';
  var vals=data.map(function(d){ return Number(d.value)||0; });
  var max=Math.max.apply(null, vals), min=Math.min.apply(null, vals);
  if(max===min){ max=min+1; }
  var pad=(max-min)*0.18; max+=pad; min=Math.max(0,min-pad);
  var x=function(i){ return pl+(data.length===1?iw/2:iw*i/(data.length-1)); };
  var y=function(v){ return pt+ih-(v-min)/(max-min)*ih; };
  var pts=data.map(function(d,i){ return x(i)+','+y(Number(d.value)||0); });
  var area=pts.length?('M'+pl+','+(pt+ih)+' L'+pts.join(' L')+' L'+x(data.length-1)+','+(pt+ih)+' Z'):'';
  var grid='';
  for(var g=0;g<=3;g++){
    var gy=pt+ih*g/3, gv=Math.round(max-(max-min)*g/3);
    grid+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+gy.toFixed(1)+'" stroke="#e8ecf2" stroke-width="1"/>'
      +'<text x="'+(pl-6)+'" y="'+(gy+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="#8b95a5">'+gv.toLocaleString()+'</text>';
  }
  var dots=pts.map(function(p,i){
    return '<circle cx="'+p.split(',')[0]+'" cy="'+p.split(',')[1]+'" r="3.2" fill="#fff" stroke="#2f6fed" stroke-width="2"><title>'+esc(data[i].label)+'：'+data[i].value+'</title></circle>';
  }).join('');
  var labels=data.map(function(d,i){
    if(data.length>8 && i%2!==0) return '';
    return '<text x="'+x(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="9.5" fill="#8b95a5">'+esc(d.label)+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet" style="display:block">'
    +grid
    +'<path d="'+area+'" fill="rgba(47,111,237,.08)"/>'
    +'<polyline points="'+pts.join(' ')+'" fill="none" stroke="#2f6fed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +dots+labels+'</svg>';
}

/* ---- B6 手写 Markdown 渲染器（零外部依赖）----
   安全策略：先对全文做 HTML 转义，再做 Markdown 变换 —— 源码里的
   <script> 等标签只会以文本形式呈现，不会被注入执行。
   支持：标题 / 列表 / 有序列表 / 表格 / 代码块 / 行内代码 / 粗体 / 斜体 /
        链接 / 引用 / 分割线；源码视图始终可回退。 */
function mdInline(s){
  s=s.replace(/`([^`\n]+)`/g, function(m,c){ return '<code>'+c+'</code>'; });
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*/g,'$1<i>$2</i>');
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdRender(raw){
  var text=String(raw==null?'':raw);
  if(!text.replace(/\s/g,'')) return '';
  text=esc(text);                                        // ① 整体转义（防注入）
  var codes=[];
  text=text.replace(/```([\s\S]*?)```/g,function(m,c){ codes.push(c); return '\u0000C'+(codes.length-1)+'\u0000'; });
  var lines=text.split('\n'), html='', i=0, n=lines.length;
  function flushCode(idx){ return '<pre><code>'+codes[idx].replace(/^\n/,'').replace(/\n$/,'')+'</code></pre>'; }
  while(i<n){
    var ln=lines[i];
    var ph=ln.match(/^\u0000C(\d+)\u0000$/);
    if(ph){ html+=flushCode(Number(ph[1])); i++; continue; }
    if(/^\s*$/.test(ln)){ i++; continue; }
    var hm=ln.match(/^(#{1,4})\s+(.*)$/);
    if(hm){ var lv=hm[1].length; html+='<h'+lv+'>'+mdInline(hm[2])+'</h'+lv+'>'; i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(ln)){ html+='<hr>'; i++; continue; }
    if(/^\s*&gt;\s?/.test(ln)){
      var q=[];
      while(i<n&&/^\s*&gt;\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*&gt;\s?/,'')); i++; }
      html+='<blockquote>'+mdInline(q.join('<br>'))+'</blockquote>'; continue;
    }
    if(/^\s*\|/.test(ln)&&i+1<n&&/^\s*\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      var head=ln.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();});
      i+=2; var body=[];
      while(i<n&&/^\s*\|/.test(lines[i])){ body.push(lines[i].replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(function(c){return c.trim();})); i++; }
      html+='<table><thead><tr>'+head.map(function(c){return '<th>'+mdInline(c)+'</th>';}).join('')+'</tr></thead><tbody>'
        +body.map(function(row){return '<tr>'+row.map(function(c){return '<td>'+mdInline(c)+'</td>';}).join('')+'</tr>';}).join('')
        +'</tbody></table>'; continue;
    }
    if(/^\s*[-*+]\s+/.test(ln)){
      var items=[];
      while(i<n&&/^\s*[-*+]\s+/.test(lines[i])){ items.push('<li>'+mdInline(lines[i].replace(/^\s*[-*+]\s+/,''))+'</li>'); i++; }
      html+='<ul>'+items.join('')+'</ul>'; continue;
    }
    if(/^\s*\d+[.、]\s*/.test(ln)){
      var oitems=[];
      while(i<n&&/^\s*\d+[.、]\s*/.test(lines[i])){ oitems.push('<li>'+mdInline(lines[i].replace(/^\s*\d+[.、]\s*/,''))+'</li>'); i++; }
      html+='<ol>'+oitems.join('')+'</ol>'; continue;
    }
    var para=[];
    while(i<n&&!/^\s*$/.test(lines[i])&&!/^\u0000C\d+\u0000$/.test(lines[i])
      &&!/^(#{1,4}\s|\s*[-*+]\s|\s*\d+[.、]\s*|\s*&gt;|\s*\|)/.test(lines[i])
      &&!/^\s*(-{3,}|\*{3,})\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    if(para.length){ html+='<p>'+mdInline(para.join('<br>'))+'</p>'; } else { i++; }
  }
  html=html.replace(/\u0000C(\d+)\u0000/g,function(m,c){ return flushCode(Number(c)); });
  return '<div class="md-body">'+html+'</div>';
}

function svgPieChart(data, opt){
  opt=opt||{};
  var w=opt.width||300, h=opt.height||210, cx=w/2, cy=h/2, r=Math.min(w,h)/2-8;
  var total=0; data.forEach(function(d){ total+=Number(d.value)||0; });
  if(!total) return '<div class="empty" style="padding:18px">暂无数据</div>';
  var ang=-Math.PI/2, paths='';
  data.forEach(function(d,i){
    var v=Number(d.value)||0; if(!v) return;
    var a2=ang+v/total*Math.PI*2;
    var color=d.color||PIE_COLORS[i%PIE_COLORS.length];
    var da=' data-drill="'+esc(d.drill||'')+'" data-drill-f="'+esc(opt.drillField||'')+'" style="cursor:pointer"';
    if(v===total){
      paths+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"'+da+'><title>'+esc(d.label)+'：'+v+'</title></circle>';
    }else{
      var large=(a2-ang)>Math.PI?1:0;
      var x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang), x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
      paths+='<path d="M'+cx+','+cy+' L'+x1.toFixed(1)+','+y1.toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(1)+','+y2.toFixed(1)+' Z" fill="'+color+'" stroke="#fff" stroke-width="1.5"'+da+'><title>'+esc(d.label)+'：'+v+'</title></path>';
    }
    ang=a2;
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="display:block">'+paths
    +'<text x="'+cx+'" y="'+(cy-1)+'" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2733">'+total+'</text>'
    +'<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10" fill="#8b95a5">'+esc(opt.centerLabel||'总数')+'</text></svg>';
}
function svgBarChart(data, opt){
  opt=opt||{};
  var w=opt.width||300, h=opt.height||200, pl=28, pr=8, pt=18, pb=24;
  var iw=w-pl-pr, ih=h-pt-pb;
  var total=0, max=1;
  data.forEach(function(d){ total+=Number(d.value)||0; max=Math.max(max, Number(d.value)||0); });
  if(!total) return '<div class="empty" style="padding:18px">暂无数据</div>';
  var gap=iw/data.length, bw=Math.min(46, gap*0.62), bars='';
  data.forEach(function(d,i){
    var v=Number(d.value)||0, bh=Math.max(v/max*ih, v?3:0);
    var x=pl+gap*i+(gap-bw)/2, y=pt+ih-bh;
    var color=d.color||PIE_COLORS[i%PIE_COLORS.length];
    bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+color+'" data-drill="'+esc(d.drill||'')+'" data-drill-f="'+esc(opt.drillField||'')+'" style="cursor:pointer"><title>'+esc(d.label)+'：'+v+'</title></rect>'
      +'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6675">'+v+'</text>'
      +'<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-7)+'" text-anchor="middle" font-size="10.5" fill="#8b95a5">'+esc(d.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="display:block">'
    +'<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'" stroke="#e8ecf2"/>'+bars+'</svg>';
}
function svgDonut(pct, opt){

function tbLoad(){
  var today=new Date(); var ds=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);

    tbState.boxes=j.boxes; tbState.stats=j.stats;

/* ---- B9 任务重复规则 ----
   设计约束（不冲击既有指纹/墓碑/同步机制）：
     · 「重复」只进 MODULES.fields，**不进 cols / loadData / mergeMd 列序**
       -> SEED_TASKS 数组、三处列序零改动，md 同步不会覆盖它（天然字段级保护）
     · 完成重复任务时生成「下期实例」：新记录 _src='manual'、_id=genId()，
       _fp = fingerprint(标题#截止) 与模板区分（防 mergeMd 撞码、防删除误伤）
     · 幂等：已存在同标题同截止的未删除实例则不重复生成 */
function advanceDue(dateStr, rule){
  var d=new Date(String(dateStr||'').slice(0,10));
  if(isNaN(d.getTime())) return '';
  if(rule==='每天') d.setDate(d.getDate()+1);
  else if(rule==='每周') d.setDate(d.getDate()+7);
  else if(rule==='每月'){
    var day=d.getDate();
    d.setDate(1); d.setMonth(d.getMonth()+1);
    var last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day,last));                       // 31 号 -> 月末兜底
  }
  else return '';
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function spawnNextRepeat(rec){
  var rule=rec['重复'];
  if(!rule||rule==='不重复') return null;
  var next=advanceDue(rec['截止'], rule);
  if(!next) return null;                                  // 无截止日无法推算下期
  var dup=(state.data.tasks||[]).some(function(r){
    return !r._deleted && r['标题']===rec['标题'] && String(r['截止']||'').slice(0,10)===next;
  });
  if(dup) return null;                                    // 幂等：不重复生成
  var o={};
  for(var k in rec){ if(k.indexOf('_')!==0) o[k]=rec[k]; }
  o['状态']=''; o['完成日']=''; o['进度']=0; o['截止']=next;
  o._id=genId(); o._src='manual'; o._rep=1; o._root=rec._id;
  o._fp=fingerprint(rec['标题']+'#'+next);                // 与模板 _fp 区分
  (state.data.tasks=state.data.tasks||[]).push(o);
  return o;
}
function markDone(rec, done){
  /* 标记完成/撤销完成。
     关键：必须写 _touched，否则下次同步 md 会把状态覆盖回「进行中」，
     表现为「刷新后完成的待办又出现了」。 */
  rec._touched=rec._touched||{};
  rec._touched['状态']=1;
  rec._mtime=nowIso();                                 // 状态变更即更新（驱动「最近更新/创建时间」排序）
  if(done){
    rec['状态']='已完成'; rec['完成日']=todayStr(); rec['进度']=100;
    rec._touched['完成日']=1; rec._touched['进度']=1;
    MC.settle(rec); MC.maybeReview(rec);
    return spawnNextRepeat(rec);      // 重复任务 -> 自动生成下期实例（返回新实例或 null）
  }else{
    rec['状态']='进行中'; rec['完成日']=''; rec['进度']=0;
    rec._touched['完成日']=1; rec._touched['进度']=1;
    return null;
  }
}
/* 看板拖拽等场景的直接状态设置：非「已完成」同样写 _touched 防覆盖；
   离开已完成时清掉完成日。设置为已完成时委托 markDone（保证 _touched + 重复逻辑一致） */
function setTaskStatus(rec, s){
  if(s==='已完成'){ markDone(rec, true); return; }
  rec._touched=rec._touched||{};
  rec._touched['状态']=1;
  rec['状态']=s;
  if(rec['完成日']){ rec['完成日']=''; rec._touched['完成日']=1; }
}

      });

      it.classList.add('dragging');

    list.addEventListener('dragover',function(e){

      var it=e.target&&e.target.closest?e.target.closest('[data-tid]'):null;
      clearMarks();
      if(!it) return;
      var r=it.getBoundingClientRect();
      it.classList.add(e.clientY>r.top+r.height/2?'drop-after':'drop-before');
    });
    list.addEventListener('drop',function(e){
      if(!dragId) return;
      e.preventDefault();
      var it=e.target&&e.target.closest?e.target.closest('[data-tid]'):null;
      var targetId=it?it.getAttribute('data-tid'):null, after=false;
      if(it){ var r=it.getBoundingClientRect(); after=e.clientY>r.top+r.height/2; }

    });
  })();
}

/* ---- P1-4 Skills 提示词模板：纯函数与复制面板 ----
   模板支持 {{变量}} 占位；tplVars 提取（去重保序），fillTemplate 替换
   （缺省变量替换为空串）。数据来源：SEED_SKILLS 第 9 列 / 表单「模板」字段。 */
function tplVars(tpl){
  var out=[], s=String(tpl||''), m, re=/\{\{([^{}]+)\}\}/g;
  while((m=re.exec(s))){ var v=m[1].trim(); if(v&&out.indexOf(v)<0) out.push(v); }
  return out;
}
function fillTemplate(tpl, vars){
  return String(tpl||'').replace(/\{\{([^{}]+)\}\}/g, function(m0,k){
    var v=vars?vars[k.trim()]:undefined;
    return v===undefined?'':String(v);
  });
}
function copyText(s, okMsg){
  /* 剪贴板：clipboard API 优先，textarea+execCommand 兜底（file://） */
  var done=function(){ toast(okMsg||'已复制到剪贴板'); };
  var fail=function(){ toast('复制失败，请手动选择文本复制',1); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(s).then(done)['catch'](function(){ legacyCopy(s)?done():fail(); });
      return;
    }
  }catch(e){}
  legacyCopy(s)?done():fail();
}
function legacyCopy(s){
  try{
    var ta=document.createElement('textarea');
    ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok=document.execCommand&&document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}

function bindKnowledge(){
  var m=MODULES.filter(function(x){return x.key==='knowledge';})[0];
  $('#btnAdd').addEventListener('click',function(){ openForm(m,null); });
  $('#btnExport').addEventListener('click',function(){ exportCsv(m); });
  var si=$('#searchInput'); si.addEventListener('input',function(){ state.search=si.value; renderContent(); var e=$('#searchInput'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); });
  bindFilterPanel(m);
  var bf=$('#btnFilter'); if(bf) bf.addEventListener('click',function(){ state.filterOpen=!state.filterOpen; renderContent(); });
  Array.prototype.forEach.call($('#content').querySelectorAll('[data-edit]'),function(b){
    b.addEventListener('click',function(){ openForm(m,(state.data.knowledge||[]).filter(function(r){return r._id===b.getAttribute('data-edit');})[0]); });
  });
  Array.prototype.forEach.call($('#content').querySelectorAll('[data-del]'),function(b){
    b.addEventListener('click',function(){
      var id=b.getAttribute('data-del');
      openConfirm('确认删除该入库记录？','删除后不会被下次同步重新导入（已记入删除墓碑）。Ctrl+Z 可撤销本次删除。',function(){
        state.data.knowledge.forEach(function(r){ if(r._id===id){ r.__name=r['文件名']; pushUndo('knowledge', r); markDeleted('knowledge', r); } });
        saveData('knowledge',state.data.knowledge); toast('已删除（Ctrl+Z 可撤销）'); refreshAll();
      });
    });
  });
}
