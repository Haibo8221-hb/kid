var V2_TIPS_POOL = [
  {id:'dm01',title:'The Feynman Technique',icon:'📝',cat:'general',
   concept:'If you cannot explain it simply, you do not understand it well enough. — Richard Feynman',
   why:'Teaching forces your brain to organise information logically. When you stumble, you have found a knowledge gap. Studies show that explaining a concept to someone else improves retention by 50–70% compared to re-reading.',
   steps:['Pick a concept you are studying','Explain it out loud as if teaching a 12-year-old — no jargon, no skipping','When you get stuck, go back to the textbook/notes and fill the gap','Simplify further — use analogies, drawings, plain English'],

  {id:'dm02',title:'Active Recall + Spaced Repetition',icon:'🧠',cat:'general',
   concept:'The most effective study method is testing yourself — not re-reading. Space your review sessions: 1 day → 3 days → 1 week → 1 month.',
   why:'The forgetting curve shows you lose 50% of new information in 24 hours without review. Each active recall session resets the curve. Spacing reviews doubles long-term retention compared to cramming (Ebbinghaus, 1885; confirmed by 200+ studies).',
   steps:['After learning something new, close the book immediately','Write down everything you remember — no peeking','Check what you missed — THAT is what needs review','Schedule reviews: tomorrow, 3 days, 1 week, 1 month'],
   practice:'Right now: pick one GCSE topic. Close everything. Write a one-page summary from memory. Mark what you forgot in red. This is your review list.',
   apply:['Chemistry: Memorise the reactivity series — test yourself tomorrow','Physics: Recall all equations from the Forces topic — no formula sheet','English: Recall 5 key Macbeth quotes with analysis points']},
  
  {id:'dm03',title:'The PEEL Paragraph Method',icon:'✍️',cat:'english',
   concept:'PEEL = Point → Evidence → Explain → Link. Every analytical paragraph needs all four. This is the single most important structure for GCSE English.',
   why:'Examiners use PEEL as their marking framework. If your paragraph has all four elements clearly, you automatically hit AO1, AO2, and AO3. Without it, even brilliant ideas lose marks because the structure is unclear.',
   steps:['POINT: Your argument in one sentence — answer the question directly','EVIDENCE: A short quote that supports your point — embed it in your sentence','EXPLAIN: Zoom in on specific words. Name the technique. Say what effect it creates and WHY. This is 60% of your marks.','LINK: Connect back to the question AND forward to your next point'],
   practice:'Take any past paper question. Write ONE full PEEL paragraph. Time yourself: 12 minutes. Then check: did you zoom in on a WORD? Did you name the TECHNIQUE? Did you explain the EFFECT on the READER?',
   apply:['Macbeth: "How does Shakespeare present Macbeth\'s guilt?" — PEEL on the dagger soliloquy','Poetry: Compare how two poets present power — PEEL on Ozymandias','Inspector Calls: "How does Priestley use the Inspector?" — PEEL on his final speech']},
  
  {id:'dm04',title:'Interleaving — Mix Your Subjects',icon:'🔀',cat:'general',
   concept:'Instead of studying one topic for 2 hours (blocking), mix 3–4 topics in shorter bursts. Maths → Physics → English → Maths again. Counter-intuitive but proven superior.',
   why:'Blocking feels productive because it is easy — your brain stays in one mode. Interleaving feels harder because you must constantly switch contexts, but this struggle strengthens long-term memory. A landmark study (Rohrer & Taylor, 2007) showed interleaving improved test scores by 43%.',
   steps:['Plan a 2-hour study block','Divide into 4 x 30-minute segments','Assign different subjects to each segment — never two of the same in a row','After 30 minutes, switch COMPLETELY — new desk setup, new mindset'],

  {id:'dm05',title:'Deliberate Practice — Target Your Weaknesses',icon:'🎯',cat:'general',
   concept:'Not all practice is equal. Deliberate practice means: identify a specific weakness → design a focused exercise → get immediate feedback → repeat until mastered.',
   why:'Anders Ericsson\'s research on expert performance found that top performers do not just practice more — they practice differently. They spend 4x more time on their weaknesses than average performers. Comfort-zone practice does not improve skills.',
   steps:['Identify ONE specific weakness (not "maths" — "quadratic factorisation when a>1")','Design a 20-minute focused drill on just that skill','Do it. Check answers immediately — the faster the feedback, the faster the learning','Repeat tomorrow with harder variations'],
   practice:'What is your number one weakness right now? Not the subject — the specific skill. Write it down. Design a 20-minute drill for tomorrow. Do not study anything else in that slot.',
   apply:['English: Weakness = using "this shows" instead of analytical verbs. Drill: rewrite 10 sentences using "suggests / implies / conveys / reveals / emphasises"','Physics: Weakness = confusing describe vs explain. Drill: answer 5 past paper Qs, each with exactly 2 sentences (describe THEN explain)','Maths: Weakness = algebraic fractions. Drill: 10 Corbettmaths Grade 8–9 questions, timed 20 minutes']},
  
  {id:'dm06',title:'The Pomodoro Method + Deep Work',icon:'⏱️',cat:'general',
   concept:'25 minutes of intense, distraction-free focus → 5-minute break → repeat. After 4 cycles, take a 15–30 minute break. Deep work = single-tasking at full cognitive capacity.',
   why:'Cal Newport\'s research shows that the average knowledge worker gets only 1–2 hours of deep work per day. The Pomodoro technique forces deep work by creating artificial deadlines. Multitasking reduces effective IQ by 10–15 points (University of London study).',
   steps:['Set a timer for 25 minutes — NOT your phone, use a physical timer or app','Remove ALL distractions: phone in another room, notifications off, one tab open','Work on ONE thing only — if another thought pops up, write it down and continue','When the timer rings: stand up, stretch, drink water. 5 minutes only. Then repeat.'],

   why:'Research consistently shows that practice testing is the #1 most effective revision technique (Dunlosky et al., 2013). Past papers reveal exactly what examiners want. Each mistake is free tuition — it shows you the gap between what you know and what they ask.',
   steps:['Week 1–2: Open book. Focus on understanding question types, not speed.','Week 3–4: Closed book, untimed. Focus on recall + structure.','Week 5–6: Timed, exam conditions. Full papers.','After EVERY paper: spend 20 minutes analysing mistakes. Categorise: knowledge gap? misunderstood question? silly error? time pressure?'],
   practice:'Print one past paper for your weakest subject. Do it open book this week. Mark it yourself using the mark scheme. Create an error log: what did you get wrong and WHY?',
   apply:['Maths: SMC/UKMT past papers — note which topics appear most frequently','Physics: GCSE past papers — the "describe" vs "explain" pattern','English: Practice writing full essays against the clock — timing is half the battle']},
  
  {id:'dm08',title:'The Cornell Note-Taking System',icon:'📒',cat:'general',
   concept:'Divide your page into 3 sections: Notes (right), Cues (left), Summary (bottom). After class, fill the Cues column with questions. Cover the Notes and answer from Cues.',

   steps:['During class/reading: write key points in the right (Notes) column — be concise','Within 24 hours: write questions/prompts in the left (Cues) column','Cover the Notes column. Answer each Cue question from memory.','Write a 2–3 sentence summary at the bottom — what was the main point?'],
   practice:'Take one topic from today\'s lessons. Rewrite your notes using the Cornell format. Generate at least 5 Cue questions. Tomorrow morning: answer them without looking.',

const AVATARS = ['\uD83D\uDC67','\uD83D\uDC69\u200D\uD83D\uDD2C','\uD83D\uDC69\u200D\uD83D\uDCBB','\uD83D\uDC69\u200D\uD83C\uDFA8','\uD83D\uDC69\u200D\uD83D\uDD27','\uD83D\uDC69\u200D\uD83D\uDE80','\uD83C\uDF1F','\uD83C\uDFAF','\uD83D\uDD2C','\uD83D\uDCA1','\uD83E\uDDE0','\uD83D\uDCD0','\uD83D\uDC31','\uD83E\uDD8A','\uD83C\uDF38','\uD83C\uDF0D','\uD83C\uDF0A','\uD83C\uDF08','\u2601\uFE0F','\u2728','\uD83D\uDD25','\uD83D\uDCA5','\uD83C\uDFB5','\uD83C\uDFAE','\uD83D\uDCDA','\uD83D\uDC8E','\uD83D\uDD2E','\uD83D\uDD2D','\uD83E\uDDD0','\uD83C\uDF0C','\u2699\uFE0F','\u26A1'];

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  const panel = document.getElementById('tab-' + tab);
  if (panel) panel.classList.add('active');
  const link = document.querySelector(`.sidebar-nav a[onclick*="${tab}"]`);
  if (link) link.classList.add('active');

  // Lazy-render tab content
  if (tab === 'tasks') W.Tasks.load('widget-tasks');
  if (tab === 'errors') W.ErrorBook.load('widget-errors');
  if (tab === 'planner') W.Planner.load('widget-planner');
  if (tab === 'wiki') W.Wiki.load('widget-wiki');
  if (tab === 'chat') W.Chat.load('widget-chat');
}

function setTheme(theme) {
  const themes = {
    blue:   { accent: '#4f8cff', accent2: '#10b981' },
    purple: { accent: '#a855f7', accent2: '#c084fc' },
    pink:   { accent: '#f472b6', accent2: '#f9a8d4' },
    green:  { accent: '#10b981', accent2: '#34d399' },
    orange: { accent: '#f59e0b', accent2: '#fbbf24' }
  };
  const t = themes[theme] || themes.blue;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent2', t.accent2);
  localStorage.setItem('theme_diya', theme);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
  document.querySelector(`.theme-dot[data-theme="${theme}"]`)?.classList.add('active');
}

function showAvatarPicker() {
  const grid = document.getElementById('avatar-picker-grid');
  const cur = document.getElementById('profile-avatar').textContent;
  grid.innerHTML = AVATARS.map(a => `<div class="avatar-option${a===cur?' selected':''}" onclick="selectAvatar('${a}')">${a}</div>`).join('');
  const modal = document.getElementById('avatar-modal');
  modal.style.display = 'flex'; modal.classList.add('open');
}

function selectAvatar(emoji) {
  document.getElementById('profile-avatar').textContent = emoji;
  W.Profile.save();
  const modal = document.getElementById('avatar-modal');
  modal.style.display = 'none'; modal.classList.remove('open');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.style.display = 'none', 300); }, 2000);
}

function logout() { localStorage.clear(); location.reload(); }

(function init() {
  const savedTheme = localStorage.getItem('theme_diya') || 'blue';
  setTheme(savedTheme);
  W.Profile.load();
  W.Streak.load();
  W.config.init();
  W.renderAll();
  // Countdown live update every minute
  setInterval(W.updateCountdown, 60000);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') W.closeConfig();
  });
})();
</script>
