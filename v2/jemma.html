var V2_TIPS_POOL = [
  {id:'jm01',title:'The Feynman Technique',icon:'📝',cat:'science',
   concept:'If you cannot explain it simply, you do not understand it well enough. — Richard Feynman',
   why:'When you try to teach something, your brain has to organise it logically. The moment you get stuck is the exact moment you discover a gap in your understanding. This is the fastest way to find out what you actually know vs what you THINK you know.',
   steps:['Pick something cool you learned today — a chemistry reaction, a maths trick, a science fact','Explain it to your mum, your sister, or even your teddy bear — no big words allowed!','If you get stuck, go look it up. Then try explaining again.','Make it even simpler — draw a picture, use a story, compare it to something everyday'],
   practice:'Pick one thing: why does baking soda + vinegar fizz? Explain it in 3 sentences to someone. Use the word "reaction" and "carbon dioxide". Can you do it without saying "because it just does"?',

  {id:'jm03',title:'The 5 Whys — Think Like a Scientist',icon:'🔍',cat:'science',
   concept:'Ask "Why?" five times in a row. Each answer becomes the basis for the next "Why?" This simple technique, developed at Toyota, uncovers the ROOT CAUSE of anything — in science AND in life.',

  {id:'jm04',title:'Spaced Repetition — Build the Habit Early',icon:'🔄',cat:'general',

  {id:'jm05',title:'Elaborative Interrogation — Ask "How?" and "Why?"',icon:'❓',cat:'general',

   apply:['"Mitochondria are the powerhouse of the cell" → Why? Because they produce ATP through cellular respiration. How? Like a battery converting fuel into electricity.','"Henry VIII had six wives" → Why? Because he needed a male heir. How does this connect to the Reformation? He broke from the Catholic Church to divorce his first wife.']},
  
  {id:'jm06',title:'Growth Mindset — "I Cannot Do This... YET"',icon:'🌱',cat:'general',
   concept:'Your abilities are not fixed — they grow with effort. The word "yet" changes everything. "I am not good at maths" → "I am not good at maths YET." This is the single most powerful belief for long-term success.',

   steps:['Notice when you say "I can\'t do this" or "I\'m bad at X"','Add the word "YET" to the end. Say it out loud.','Think of ONE small thing you can do to improve — just 5 minutes','Celebrate effort, not just results. "I worked hard on this" is more important than "I got it right"'],

   steps:['During class: write key points on the RIGHT side — use bullet points, not sentences','After class (same day!): write QUESTIONS on the LEFT that your notes answer','Before next class: cover the RIGHT side. Answer the questions from memory','At the bottom: write a 2-sentence summary — "The main thing I learned was..."'],

function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
  const panel = document.getElementById('tab-' + tab);
  if (panel) panel.classList.add('active');
  const link = document.querySelector(`.sidebar-nav a[onclick*="${tab}"]`);
  if (link) link.classList.add('active');

  // Lazy-render tab content
  if (tab === 'tasks') W.Tasks.load('widget-tasks');
  if (tab === 'errors') W.ErrorBook.load('widget-errors');
  if (tab === 'planner') W.Planner.load('widget-planner');
  if (tab === 'wiki') W.Wiki.load('widget-wiki');
  if (tab === 'chat') W.Chat.load('widget-chat');
}

function setTheme(theme) {
  const themes = {
    blue:   { accent: '#4f8cff', accent2: '#10b981' },
    purple: { accent: '#a855f7', accent2: '#c084fc' },
    pink:   { accent: '#f472b6', accent2: '#f9a8d4' },
    green:  { accent: '#10b981', accent2: '#34d399' },
    orange: { accent: '#f59e0b', accent2: '#fbbf24' }
  };
  const t = themes[theme] || themes.blue;
  document.documentElement.style.setProperty('--accent', t.accent);
  document.documentElement.style.setProperty('--accent2', t.accent2);
  localStorage.setItem('theme_jemma', theme);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
  document.querySelector(`.theme-dot[data-theme="${theme}"]`)?.classList.add('active');
}

function showAvatarPicker() {
  const grid = document.getElementById('avatar-picker-grid');
  const cur = document.getElementById('profile-avatar').textContent;
  grid.innerHTML = AVATARS.map(a => `<div class="avatar-option${a===cur?' selected':''}" onclick="selectAvatar('${a}')">${a}</div>`).join('');
  const modal = document.getElementById('avatar-modal');
  modal.style.display = 'flex'; modal.classList.add('open');
}

function selectAvatar(emoji) {
  document.getElementById('profile-avatar').textContent = emoji;
  W.Profile.save();
  const modal = document.getElementById('avatar-modal');
  modal.style.display = 'none'; modal.classList.remove('open');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block'; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.style.display = 'none', 300); }, 2000);
}

function logout() { localStorage.clear(); location.reload(); }

(function init() {
  const savedTheme = localStorage.getItem('theme_jemma') || 'green';
  setTheme('green');
  W.Profile.load();
  W.Streak.load();
  W.config.init();
  W.renderAll();
  // Countdown live update every minute
  setInterval(W.updateCountdown, 60000);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') W.closeConfig();
  });
})();
