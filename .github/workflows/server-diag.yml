name: Server diagnostics (read-only)

# 只读诊断：把 ECS 上的 nginx auth_basic 配置、服务环境变量、线上文件状态
# 抓回仓库的 diag-output 分支（本地 git fetch 即可查看）。不做任何修改。
#
# 触发方式：
#   1) 手动：GitHub → Actions → Server diagnostics → Run workflow
#   2) 推送触发：修改 .github/triggers/server-diag.txt 后 push
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/server-diag.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect diagnostics on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            OUT=/tmp/kid-diag.txt
            {
              echo "===== when ====="
              date -Is
              echo
              echo "===== site root ====="
              ls -la "${{ secrets.SITE_ROOT }}" | head -30
              echo
              echo "===== v2 dir ====="
              ls -d "${{ secrets.SITE_ROOT }}/v2" 2>/dev/null || echo "v2/ NOT present (offline ok)"
              echo
              echo "===== index.html v2 links ====="
              grep -n "v2" "${{ secrets.SITE_ROOT }}/index.html" 2>/dev/null || echo "no v2 in index.html"
              echo
              echo "===== auth_basic in panel vhost ====="
              ls -1 /www/server/panel/vhost/nginx/ 2>/dev/null | head -20
              echo "--- grep ---"
              grep -rn "auth_basic\|htpasswd\|satisfy" /www/server/panel/vhost/nginx/ 2>/dev/null | head -40
              echo
              echo "===== nginx -T auth_basic ====="
              nginx -T 2>/dev/null | grep -n "auth_basic\|htpasswd" | head -40
              echo
              echo "===== plan-api service env ====="
              systemctl show plan-api -p Environment -p ExecStart 2>/dev/null | head -10
              echo
              echo "===== backend health ====="
              curl -s -o /dev/null -w "api status: %{http_code}\n" http://127.0.0.1:5000/api/auth/status
            } > "$OUT" 2>&1
            echo "--- collected ---"
            cat "$OUT"

      - name: Pull diagnostics back to repo
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem
          mkdir -p diagnostics
          TS=$(date -u +%Y%m%d-%H%M%S)
          rsync -az -e "ssh -p $ECS_PORT -i key.pem -o StrictHostKeyChecking=no" \
            "$ECS_USER@$ECS_HOST:/tmp/kid-diag.txt" "diagnostics/server-$TS.txt"

      - name: Push to diag-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -B diag-output
          git add diagnostics/
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "diag: ECS nginx/service snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin diag-output
