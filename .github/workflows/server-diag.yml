name: Server diagnostics (read-only)

# 只读诊断：把 ECS 上的 nginx auth_basic 配置、服务环境变量、线上文件状态
# 抓回仓库的 diag-output 分支（本地 git fetch 即可查看）。不做任何修改。
#
# 触发方式：
#   1) 手动：GitHub → Actions → Server diagnostics → Run workflow
#   2) 推送触发：修改 .github/triggers/server-diag.txt 后 push
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/server-diag.txt'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect diagnostics on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            OUT=/tmp/kid-diag.txt
            {
              echo "===== when ====="
              date -Is
              echo
              echo "===== site root ====="
              ls -la "${{ secrets.SITE_ROOT }}" | head -30
              echo
              echo "===== v2 dir ====="
              ls -d "${{ secrets.SITE_ROOT }}/v2" 2>/dev/null || echo "v2/ NOT present (offline ok)"
              echo
              echo "===== index.html v2 links ====="
              grep -n "v2" "${{ secrets.SITE_ROOT }}/index.html" 2>/dev/null || echo "no v2 in index.html"
              echo
              echo "===== auth_basic in panel vhost ====="
              ls -1 /www/server/panel/vhost/nginx/ 2>/dev/null | head -20
              echo "--- grep ---"
              grep -rn "auth_basic\|htpasswd\|satisfy" /www/server/panel/vhost/nginx/ 2>/dev/null | head -40
              echo
              echo "===== nginx -T auth_basic ====="
              nginx -T 2>/dev/null | grep -n "auth_basic\|htpasswd" | head -40
              echo
              echo "===== plan-api service env ====="
              systemctl show plan-api -p Environment -p ExecStart 2>/dev/null | head -10
              echo
              echo "===== backend health ====="
              curl -s -o /dev/null -w "api status: %{http_code}\n" http://127.0.0.1:5000/api/auth/status
              echo
              echo "===== data dir (运行时数据真源) ====="
              ls -la --time-style=long-iso "${{ secrets.SITE_ROOT }}/data" | head -45
              echo "--- 关键文件 ---"
              for f in auth_state.json llm_config.json errors_diya.json errors_jemma.json planner_diya.json planner_jemma.json tasks_diya.json tasks_jemma.json wiki_diya.json wiki_jemma.json smc_records.json; do
                if [ -f "${{ secrets.SITE_ROOT }}/data/$f" ]; then echo "present: $f ($(stat -c %s "${{ secrets.SITE_ROOT }}/data/$f")B, $(stat -c %y "${{ secrets.SITE_ROOT }}/data/$f"))"; else echo "ABSENT : $f"; fi
              done
              echo "--- 部署探针（验证 rsync 不再删 data/）---"
              cat "${{ secrets.SITE_ROOT }}/data/.deploy-probe" 2>/dev/null || echo "PROBE ABSENT"
              echo
              echo "===== 备份 ====="
              echo "--- crontab ---"
              crontab -l 2>/dev/null | grep -i "kid-backup" || echo "NO BACKUP CRON"
              echo "--- /opt/kid-backup ---"
              ls -la /opt/kid-backup 2>/dev/null || echo "NO BACKUP DIR"
              echo "--- backup.log ---"
              tail -5 /opt/kid-backup/backup.log 2>/dev/null || echo "no log"
              echo "--- 恢复演练（解包最新备份并校验 JSON 可解析）---"
              LATEST=$(ls -1t /opt/kid-backup/data-*.tar.gz 2>/dev/null | head -1)
              echo "latest backup: $LATEST"
              if [ -n "$LATEST" ]; then
                rm -rf /tmp/restore-test && mkdir -p /tmp/restore-test
                tar xzf "$LATEST" -C /tmp/restore-test
                for f in errors_diya.json errors_jemma.json planner_diya.json tasks_diya.json; do
                  python3 -c "import json,sys; d=json.load(open('/tmp/restore-test/data/$f')); print('$f ok, type=%s, len=%s' % (type(d).__name__, len(d) if hasattr(d,'__len__') else 'n/a'))" 2>&1 | head -2
                done
              fi
              echo
              echo "===== LLM 配置来源检查 ====="
              echo "--- data/llm_config.json ---"
              ls -la "${{ secrets.SITE_ROOT }}/data/llm_config.json" 2>/dev/null || echo "ABSENT (UI 配置可能已被部署删除)"
              echo "--- .hermes/config.yaml ---"
              ls -la "${{ secrets.SITE_ROOT }}/.hermes/config.yaml" 2>/dev/null || echo "ABSENT"
              echo "--- 服务环境变量中的 LLM 相关 key（仅显示是否有值）---"
              systemctl show plan-api -p Environment 2>/dev/null | tr ' ' '\n' | grep -i "llm\|openai\|deepseek\|api_key" | sed 's/=.*/=<set>/' || echo "none"
            } > "$OUT" 2>&1
            echo "--- collected ---"
            cat "$OUT"

      - name: Pull diagnostics back to repo
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem
          mkdir -p diagnostics
          TS=$(date -u +%Y%m%d-%H%M%S)
          rsync -az -e "ssh -p $ECS_PORT -i key.pem -o StrictHostKeyChecking=no" \
            "$ECS_USER@$ECS_HOST:/tmp/kid-diag.txt" "diagnostics/server-$TS.txt"

      - name: Push to diag-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -B diag-output
          git add diagnostics/
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "diag: ECS nginx/service snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin diag-output
