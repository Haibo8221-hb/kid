name: Server fix - disable nginx basic auth (round 3)

# 一次性修复（用完即删）。前两轮已注释 auth_basic，但 reload 没打到真正的 nginx 进程。
# 本轮：定位宝塔 nginx 二进制 → -t → -s reload → 兜底 kill -HUP 真实 master → 用响应头验证。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/server-fix-auth.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reload the right nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -u
            OUT=/tmp/kid-fix.txt
            DROPIN=/etc/systemd/system/plan-api.service.d/10-app-auth.conf
            {
              echo "===== nginx 定位 ====="
              echo "which nginx: $(command -v nginx)"
              ls -l /www/server/nginx/sbin/nginx 2>/dev/null || echo "no panel nginx binary"
              echo "-- processes --"
              ps -eo pid,lstart,args | grep -i '[n]ginx' | head -8

              MASTER=$(ps -eo pid,args | awk '/nginx: master process/ {print $1; exit}')
              echo "master pid: ${MASTER:-none}"

              NGX=""
              if [ -x /www/server/nginx/sbin/nginx ]; then NGX=/www/server/nginx/sbin/nginx; else NGX=$(command -v nginx); fi
              echo "using nginx: $NGX"

              echo "-- conf test --"
              $NGX -t 2>&1 | tail -3

              echo "-- reload --"
              $NGX -s reload 2>&1 | tail -2 || echo "reload error"
              if [ -n "${MASTER:-}" ]; then kill -HUP "$MASTER" && echo "HUP -> $MASTER"; fi
              sleep 3
              echo "-- after reload --"
              ps -eo pid,lstart,args | grep -i '[n]ginx: master' | head -3

              echo
              echo "===== 验证（响应头不应再有 WWW-Authenticate）====="
              curl -skI -m 10 https://grow-consultant.com/index.html | head -12
              echo "index status: $(curl -sk -m 10 -o /dev/null -w '%{http_code}' https://grow-consultant.com/index.html)"
              echo "app.html status: $(curl -sk -m 10 -o /dev/null -w '%{http_code}' https://grow-consultant.com/app.html)"

              echo
              echo "===== 应用层登录仍在（应 401）====="
              echo "api status: $(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/auth/status)"

              echo
              echo "===== APP_PASSWORD（沿用 drop-in）====="
              grep -o 'APP_PASSWORD=[^"]*' "$DROPIN" 2>/dev/null | head -1 | cut -d= -f2-
            } > "$OUT" 2>&1
            cat "$OUT"

      - name: Pull result back to repo
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem
          mkdir -p diagnostics
          TS=$(date -u +%Y%m%d-%H%M%S)
          rsync -az -e "ssh -p $ECS_PORT -i key.pem -o StrictHostKeyChecking=no" \
            "$ECS_USER@$ECS_HOST:/tmp/kid-fix.txt" "diagnostics/fix-$TS.txt"

      - name: Push result to diag-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -B diag-output
          git add diagnostics/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix: nginx reload 结果 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin diag-output
