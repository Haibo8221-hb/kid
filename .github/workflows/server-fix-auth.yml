name: Server fix - disable nginx basic auth & set APP_PASSWORD

# 一次性修复（用完即删），幂等：已打补丁则跳过，密码优先复用已有 drop-in。
#   1) 注释掉三个 vhost 里的 auth_basic / auth_basic_user_file（消除 Windows Basic 弹窗），
#      改前备份，nginx -t 失败自动还原；reload 用多种方式兜底。
#   2) 为 plan-api 写 systemd drop-in，注入 APP_PASSWORD + APP_STRICT_PASSWORD=1，
#      重启并自检（未登录 401 / 错密码 401 / 正确密码 200 / 首页 200）。
# 结果写入 diag-output 分支的 diagnostics/。
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/server-fix-auth.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fix on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -u
            OUT=/tmp/kid-fix.txt
            STAMP=20261015
            CONFS="/www/server/panel/vhost/nginx/grow-consultant.conf /www/server/panel/vhost/nginx/python_kid.conf /www/server/panel/vhost/nginx/112.74.40.8.conf"
            DROPIN=/etc/systemd/system/plan-api.service.d/10-app-auth.conf
            {
              echo "===== 1) nginx basic auth ====="
              for f in $CONFS; do
                if [ -f "$f" ]; then
                  if grep -q '^[[:space:]]*auth_basic[[:space:]]' "$f"; then
                    cp -n "$f" "$f.bak-$STAMP-noauth"
                    sed -i 's/^\([[:space:]]*\)auth_basic[[:space:]]/\1# auth_basic /; s/^\([[:space:]]*\)auth_basic_user_file/\1# auth_basic_user_file/' "$f"
                    echo "patched: $f"
                  else
                    echo "already patched: $f"
                  fi
                fi
              done

              if nginx -t 2>&1 | tail -3; then
                echo "-- reload attempts --"
                systemctl reload nginx 2>&1 | tail -2 && echo "systemctl reload ok" \
                  || /etc/init.d/nginx reload 2>&1 | tail -2 && echo "init.d reload ok" \
                  || kill -HUP "$(cat /www/server/nginx/logs/nginx.pid 2>/dev/null || pgrep -f 'nginx: master' | head -1)" && echo "HUP sent"
                sleep 2
                echo "master pid: $(pgrep -f 'nginx: master' | head -1)"
              else
                echo "NGINX -T FAILED -> restoring"
                for f in $CONFS; do [ -f "$f.bak-$STAMP-noauth" ] && cp "$f.bak-$STAMP-noauth" "$f"; done
              fi

              echo
              echo "===== 2) APP_PASSWORD ====="
              if [ -f "$DROPIN" ]; then
                PW=$(grep -o 'APP_PASSWORD=[^"]*' "$DROPIN" | head -1 | cut -d= -f2-)
                echo "reuse existing password from drop-in"
              else
                PW=$(openssl rand -base64 18 | tr -d '\n' | tr '+/' 'Ab')
                mkdir -p /etc/systemd/system/plan-api.service.d
                printf '[Service]\nEnvironment="APP_PASSWORD=%s"\nEnvironment="APP_STRICT_PASSWORD=1"\n' "$PW" > "$DROPIN"
                echo "created drop-in"
              fi
              cat "$DROPIN"
              systemctl daemon-reload
              systemctl restart plan-api
              sleep 5
              echo "-- service --"
              systemctl is-active plan-api
              echo "-- backend checks --"
              echo "status(401): $(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/auth/status)"
              echo "login wrong(401): $(curl -s -m 8 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"password":"definitely-wrong"}' http://127.0.0.1:5000/api/auth/login)"
              echo "login right(200): $(curl -s -m 8 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"password\":\"$PW\"}" http://127.0.0.1:5000/api/auth/login)"
              echo "-- last log --"
              journalctl -u plan-api -n 12 --no-pager 2>/dev/null | tail -12

              echo
              echo "===== 3) site ====="
              echo "https index(200): $(curl -sk -m 10 -o /dev/null -w '%{http_code}' https://grow-consultant.com/index.html)"
              echo "https app.html(200): $(curl -sk -m 10 -o /dev/null -w '%{http_code}' https://grow-consultant.com/app.html)"

              echo
              echo "===== APP_PASSWORD ====="
              echo "$PW"
            } > "$OUT" 2>&1
            cat "$OUT"

      - name: Pull result back to repo
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_PORT: ${{ secrets.ECS_PORT }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem
          mkdir -p diagnostics
          TS=$(date -u +%Y%m%d-%H%M%S)
          rsync -az -e "ssh -p $ECS_PORT -i key.pem -o StrictHostKeyChecking=no" \
            "$ECS_USER@$ECS_HOST:/tmp/kid-fix.txt" "diagnostics/fix-$TS.txt"

      - name: Push result to diag-output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git checkout -B diag-output
          git add diagnostics/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "fix: ECS nginx/auth 修复结果 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin diag-output
