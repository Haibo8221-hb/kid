name: Deploy to Alibaba ECS (112.74.40.8)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps (minimal)
        run: pip install --quiet flask httpx pyyaml

      - name: P0 regression (auth / whitelist / errors)
        run: python tests/verify_p0_fixes.py

      - name: Resource link health check
        run: python tests/check_links.py

      # 注：需要完整测试输出时，手动跑 "Test only (debug harness)" 工作流（会推送日志到 ci-testlog 分支）

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard — 部署前确认服务器运行时数据目录存在
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            test -d "${{ secrets.SITE_ROOT }}/data" || { echo "::error::服务器 data/ 缺失，中止部署（防止空数据上线）"; exit 1; }
            echo "data 文件数: $(ls -1 "${{ secrets.SITE_ROOT }}/data" | wc -l)"
            echo "auth_state: $(test -f "${{ secrets.SITE_ROOT }}/data/auth_state.json" && echo present || echo absent)"

      - name: Rsync code to ECS (push mode — ECS does NOT pull GitHub)
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          echo "$KEY" > key.pem
          chmod 600 key.pem
          # ⚠️ data/ 与 logs/ 是运行时数据，服务器为唯一真源，绝不能被本地旧副本覆盖或被 --delete 删除
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='downloads/' \
            --exclude='resources/' \
            --exclude='backups/' \
            --exclude='research_collector.py' \
            --exclude='deploy.sh' \
            --exclude='.workbuddy/' \
            --exclude='tests/' \
            --exclude='internal/' \
            --exclude='.versions/' \
            --exclude='*/.versions/' \
            --exclude='data/' \
            --exclude='logs/' \
            -e "ssh -p ${{ secrets.ECS_PORT }} -i key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.SITE_ROOT }}/

      - name: Fix ownership and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            chown -R www:www "${{ secrets.SITE_ROOT }}"
            systemctl restart plan-api
            echo "==> deploy done"
