name: Deploy to Alibaba ECS (112.74.40.8)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps (minimal)
        run: pip install --quiet flask httpx pyyaml

      - name: P0 regression (auth / whitelist / errors)
        run: python tests/verify_p0_fixes.py

      - name: Resource link health check
        run: python tests/check_links.py

      # 注：需要完整测试输出时，手动跑 "Test only (debug harness)" 工作流（会推送日志到 ci-testlog 分支）

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard — 部署前确认服务器运行时数据目录存在
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            test -d "${{ secrets.SITE_ROOT }}/data" || { echo "::error::服务器 data/ 缺失，中止部署（防止空数据上线）"; exit 1; }
            echo "data 文件数: $(ls -1 "${{ secrets.SITE_ROOT }}/data" | wc -l)"
            echo "auth_state: $(test -f "${{ secrets.SITE_ROOT }}/data/auth_state.json" && echo present || echo absent)"

      - name: Rsync code to ECS (push mode — ECS does NOT pull GitHub)
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          # ⚠️ data/ 与 logs/ 是运行时数据，服务器为唯一真源，绝不能被本地旧副本覆盖或被 --delete 删除
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='downloads/' \
            --exclude='resources/' \
            --exclude='backups/' \
            --exclude='research_collector.py' \
            --exclude='deploy.sh' \
            --exclude='.workbuddy/' \
            --exclude='tests/' \
            --exclude='internal/' \
            --exclude='.versions/' \
            --exclude='*/.versions/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='key.pem' \
            -e "ssh -p ${{ secrets.ECS_PORT }} -i $RUNNER_TEMP/key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.SITE_ROOT }}/

      - name: Fix ownership and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            chown -R www:www "${{ secrets.SITE_ROOT }}"
            systemctl restart plan-api
            echo "==> deploy done"

      # ── /v3 预览子树：与主站同源，供孩子体验新版；主站内容不受影响 ──
      # 页面内 /api/* 与 /assets/* 均为绝对路径，/v3 复用主站后端与静态资源，
      # 因此无需独立 data/ logs/（运行时数据仍以服务器主站为唯一真源）。
      - name: Prepare /v3 directory on ECS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            mkdir -p "${{ secrets.SITE_ROOT }}/v3"
            chown -R www:www "${{ secrets.SITE_ROOT }}/v3"

      - name: Rsync /v3 preview subtree (main site untouched)
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          # --delete 仅作用于 /v3 子树；排除清单与主站部署保持一致
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='downloads/' \
            --exclude='resources/' \
            --exclude='backups/' \
            --exclude='research_collector.py' \
            --exclude='deploy.sh' \
            --exclude='.workbuddy/' \
            --exclude='tests/' \
            --exclude='internal/' \
            --exclude='.versions/' \
            --exclude='*/.versions/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='key.pem' \
            -e "ssh -p ${{ secrets.ECS_PORT }} -i $RUNNER_TEMP/key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:${{ secrets.SITE_ROOT }}/v3/

      - name: Fix /v3 ownership
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            chown -R www:www "${{ secrets.SITE_ROOT }}/v3"
            echo "==> /v3 deploy done: https://112.74.40.8/v3/app.html · https://112.74.40.8/v3/jemma.html"

      # ── IP 直连兼容层（2026-10-19 诊断结论）──────────────────────────
      # 公网唯一入口是 IP：112.74.40.8 的 vhost root = /var/www/plan（2026-10-14 旧镜像），
      # 域名 vhost（xgrow.me / grow-consultant.com）被阿里云 ICP 备案拦截（Beaver 403）。
      # 页面内 /assets/* 为绝对路径 → 必须在 /var/www/plan 根下提供 assets/；
      # /v3 子树整体镜像到 /var/www/plan/v3，主站 HTML 不覆盖（保持现状）。
      # 不用 --delete：保留该目录的 legacy 文件（.env.local / error_images / data 等）。
      # 长期正解：宝塔面板把 112.74.40.8 站点根目录改为 /www/wwwroot/kid，
      # 之后本兼容层与上面的 /v3 步骤可合并为一处。
      - name: Mirror assets/ to IP vhost root (/var/www/plan)
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='downloads/' \
            --exclude='resources/' \
            --exclude='backups/' \
            --exclude='research_collector.py' \
            --exclude='deploy.sh' \
            --exclude='.workbuddy/' \
            --exclude='tests/' \
            --exclude='internal/' \
            --exclude='.versions/' \
            --exclude='*/.versions/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='key.pem' \
            -e "ssh -p ${{ secrets.ECS_PORT }} -i $RUNNER_TEMP/key.pem -o StrictHostKeyChecking=no" \
            ./assets/ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/plan/assets/

      - name: Mirror /v3 subtree to IP vhost (/var/www/plan/v3)
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/key.pem"
          chmod 600 "$RUNNER_TEMP/key.pem"
          rsync -az \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='downloads/' \
            --exclude='resources/' \
            --exclude='backups/' \
            --exclude='research_collector.py' \
            --exclude='deploy.sh' \
            --exclude='.workbuddy/' \
            --exclude='tests/' \
            --exclude='internal/' \
            --exclude='.versions/' \
            --exclude='*/.versions/' \
            --exclude='data/' \
            --exclude='logs/' \
            --exclude='key.pem' \
            -e "ssh -p ${{ secrets.ECS_PORT }} -i $RUNNER_TEMP/key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/plan/v3/

      - name: Patch /v3 index + fix ownership on IP mirror
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_HOST }}
          port: ${{ secrets.ECS_PORT }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            # /v3 首页改为站内相对链接，避免跳回旧主站
            sed -i 's|href="/app.html"|href="app.html"|g; s|href="/jemma.html"|href="jemma.html"|g' /var/www/plan/v3/index.html
            chown -R www:www /var/www/plan/assets /var/www/plan/v3
            echo "==> IP mirror done: http://112.74.40.8/v3/app.html · http://112.74.40.8/v3/jemma.html"
