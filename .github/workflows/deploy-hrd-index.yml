name: Deploy HRD workbench index (single file)

# 单文件部署：只覆盖 /var/www/plan/hrd/index.html，不动 m.html / learn.html / rag_weekly.json。
# 用途：修复「迪拜搬迁台 iframe 被 refreshAll 反复重建」——该缺陷在外层工作台里，
# 搬迁页自身无法修复。仅 workflow_dispatch 触发，不随 push 运行。
on:
  workflow_dispatch:

jobs:
  deploy-index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload index.html and verify
        run: |
          set -e
          HOST="${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}"
          PORT="${{ secrets.ECS_PORT }}"
          install -m 700 -d ~/.ssh
          echo "${{ secrets.ECS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          SSHC="ssh -p $PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=15"

          # 上传到临时文件，先校验再替换（避免半截文件覆盖线上）
          $SSHC "$HOST" "cat > /tmp/hrd-index.new" < internal/hrd-workbench/index.html
          $SSHC "$HOST" "md5sum /tmp/hrd-index.new"
          md5sum internal/hrd-workbench/index.html

          $SSHC "$HOST" "set -e
            grep -q 'renderRelocView' /tmp/hrd-index.new || { echo 'GUARD FAILED: renderRelocView 不在新文件中'; exit 1; }
            if grep -q 'viewReloc(); bindReloc(); return;' /tmp/hrd-index.new; then echo 'GUARD FAILED: 仍存在整体重建分支'; exit 1; fi
            cp -a /var/www/plan/hrd/index.html /var/www/plan/hrd/index.html.bak-\$(date +%Y%m%d-%H%M%S)
            mv /tmp/hrd-index.new /var/www/plan/hrd/index.html
            chown www:www /var/www/plan/hrd/index.html
            echo '--- 服务器现状 ---'
            ls -la --time-style=long-iso /var/www/plan/hrd/
            echo -n 'renderRelocView 命中行数: '; grep -c renderRelocView /var/www/plan/hrd/index.html
            echo -n 'reloc 标签存在: '; grep -c \"key:'reloc'\" /var/www/plan/hrd/index.html"
