# =============================================================================
# 备选后端运行方式：supervisor 直接托管 gunicorn（宝塔 Python 管理器之外的兜底）
# 用法（ECS 上）：
#   cp deploy/supervisor-kid-api.conf /etc/supervisor/conf.d/kid-api.conf
#   supervisorctl reread && supervisorctl update && supervisorctl restart kid-api
# 注意：此文件里的环境变量的具体域名/端口需按实际情况调整。
# =============================================================================
[program:kid-api]
command=/www/wwwroot/kid/venv/bin/gunicorn -w 4 -b 127.0.0.1:5000 api_server:app
directory=/www/wwwroot/kid
user=www
# 安全必填（P0-3）：APP_PASSWORD 必须显式设置为强密码，禁止依赖代码内置默认值；
# 设置完成后追加 APP_STRICT_PASSWORD="1"（未配置密码时拒绝所有登录）。
#   APP_PASSWORD="<强密码>",APP_STRICT_PASSWORD="1",APP_SECRET="<随机长串>"
# 另建议：ALLOWED_ORIGINS 由 "*" 收紧为实际域名（如 https://grow-consultant.com）
environment=DATA_DIR="/www/wwwroot/kid/data",ALLOWED_ORIGINS="*",HERMES_HOME="/www/wwwroot/kid/.hermes",CHAT_MAX_HISTORY="20",APP_PASSWORD="__CHANGE_ME__"
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/www/wwwroot/kid/logs/gunicorn.out.log
stderr_logfile=/www/wwwroot/kid/logs/gunicorn.err.log
