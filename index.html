<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Study Compass · Diya & Jemma</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d28;--surface2:#232736;--border:#2a2f42;--text:#e2e6f0;--text2:#8892b0;--accent:#4f8cff;--accent2:#38d9a9;--red:#ff6b6b}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{max-width:520px;width:100%}
.header{text-align:center;margin-bottom:32px}
.header-icon{font-size:44px;display:block;margin-bottom:12px}
.header h1{font-size:24px;font-weight:700;margin-bottom:4px}
.header p{font-size:13px;color:var(--text2)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;transition:all 0.2s;cursor:pointer}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.card-icon{font-size:32px;display:block;margin-bottom:10px}
.card-name{font-size:18px;font-weight:700;margin-bottom:4px}
.card-info{font-size:11px;color:var(--text2);margin-bottom:16px}
.card-links{display:flex;flex-direction:column;gap:8px}
.card-link{display:block;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:all 0.15s}
.card-link.primary{background:var(--accent);color:#fff}
.card-link.primary:hover{background:#7aa5ff}
.footer{margin-top:28px;text-align:center;font-size:11px;color:var(--text2)}
.footer span{opacity:0.5}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="header-icon">📋</span>
    <h1>Study Compass</h1>
    <p>Diya (Y10) · Jemma (Y8) · Headington School</p>
  </div>

  <div class="cards">
    <div class="card">
      <span class="card-icon">🎨</span>
      <div class="card-name">Diya</div>
      <div class="card-info">Year 10 · STEM · GCSE Prep</div>
      <div class="card-links">
        <a href="app.html" class="card-link primary">打开工作台 →</a>
      </div>
    </div>

    <div class="card">
      <span class="card-icon">🧪</span>
      <div class="card-name">Jemma</div>
      <div class="card-info">Year 8 · Science · Building Foundations</div>
      <div class="card-links">
        <a href="jemma.html" class="card-link primary">打开工作台 →</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <span>Study Compass · 家庭学习工作台</span>
  </div>
</div>
</body>
</html>
